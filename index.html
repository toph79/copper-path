,"3 mA","30 A"],"w":"Common-mode current on cables is a powerful radiator."}]}]},{"u":"Why power integrity matters","c":11,"L":[{"t":"Rail collapse","s":["bogatin",720],"x":"When many outputs switch at once, their currents overlap in shared power and return paths. The noise is ground bounce, also called simultaneous switching noise (SSN). Noisy rails cause bit errors and timing failures.","q":[{"k":"mc","p":"What is another name for ground bounce?","o":["Simultaneous switching noise (SSN)","Skin effect","Fiber weave","Thermal relief"],"w":"Shared paths turn switching current into rail noise."}]},{"t":"IR drop","s":["bogatin",721],"x":"Even steady DC current drops voltage across the resistance of the power path: the IR drop. As current changes, so does the drop.","q":[{"k":"mc","p":"What causes IR drop?","o":["Current through the resistance of the power path","Crosstalk between traces","Solder mask thickness","Via stubs"],"w":"V = I × R in the PDN copper."}]},{"t":"Voltage noise = I × Z","s":["bogatin",721],"x":"The chip's fluctuating current flows through the PDN's impedance at each frequency, making voltage noise: V(f) = I(f) × Z(f).","q":[{"k":"mc","p":"Which equation describes PDN voltage noise?","o":["V(f) = I(f) × Z(f)","V = L × C","Z = √(L/C)","P = V²/R"],"w":"Lower Z(f) means less noise for the same current."}]},{"t":"The PDN target idea","s":["bogatin",722],"x":"To keep rail noise within the ripple spec, keep the PDN impedance seen by the chip below a target value. That is the guiding principle of PDN design.","q":[{"k":"tf","p":"PDN design aims to keep impedance below a target value across frequency.","v":true,"w":"Below target means noise stays within the ripple spec."}]},{"t":"Three PDN guidelines","s":["bogatin",723],"x":"Bogatin's top PDN rules: power and ground planes on adjacent layers with thin dielectric near the surface; short, wide connections from decaps to the planes; and simulation to choose capacitor count and values.","q":[{"k":"mc","p":"Which is one of Bogatin's three key PDN guidelines?","o":["Adjacent power and ground planes with thin dielectric","Use one large capacitor only","Route power on thin traces","Keep planes far apart"],"w":"Close planes lower loop inductance."}]},{"t":"Every rail is separate","s":["bogatin",724],"x":"Set a target impedance separately for each voltage rail. Some designs use as many as 10 rails, each with its own target.","q":[{"k":"tf","p":"One target impedance covers every voltage rail on a board.","v":false,"w":"Each rail has its own current and ripple spec."}]}]},{"u":"Calculating the target","c":11,"L":[{"t":"Target impedance formula","s":["bogatin",727],"x":"Ztarget = (Vdd × ripple%) ÷ Itransient. Keep the PDN below this from DC to high frequency.","q":[{"k":"num","p":"1.8 V rail, 5% ripple, 2 A transient. Target impedance in Ω?","v":0.045,"tol":0.001,"u":"Ω","w":"1.8 × 0.05 ÷ 2 = 0.045 Ω."}]},{"t":"Estimating transient current","s":["bogatin",728],"x":"Datasheets rarely give transient current. Without better data, estimate it as half the maximum current.","q":[{"k":"num","p":"A chip draws up to 6 A. Estimated transient current in A?","v":3,"tol":0,"u":"A","w":"½ × 6 A = 3 A."}]},{"t":"Don't overdesign","s":["bogatin",728],"x":"Aim below the target, but not far below. Going much lower adds capacitors and cost without benefit.","q":[{"k":"tf","p":"The lower the PDN impedance, the better, regardless of cost.","v":false,"w":"Far below target means an overdesigned, more expensive PDN."}]},{"t":"Target from power","s":["bogatin",729],"x":"With 5% ripple and transient = half peak current, Ztarget ≈ 0.1 × Vdd² ÷ Pmax. A 1 V, 1 W device needs about 0.1 Ω.","q":[{"k":"num","p":"1.2 V rail, 3.6 W device. Ztarget by 0.1 × Vdd² ÷ P, in Ω?","v":0.04,"tol":0.001,"u":"Ω","w":"0.1 × 1.44 ÷ 3.6 = 0.04 Ω."}]},{"t":"I/O rail target","s":["bogatin",731],"x":"For an I/O rail driving n lines of impedance Z0, Ztarget < 0.05 × Z0 ÷ n. 32 bits into 50 Ω lines gives about 0.08 Ω.","q":[{"k":"num","p":"16 outputs driving 50 Ω lines. Ztarget in Ω by 0.05 × Z0 ÷ n?","v":0.156,"tol":0.002,"u":"Ω","w":"0.05 × 50 ÷ 16 ≈ 0.156 Ω."}]}]},{"u":"Planes, vias and capacitors","c":11,"L":[{"t":"Thin plane dielectric","s":["bogatin",834],"x":"To minimise rail collapse, put power and ground planes on adjacent layers with the thinnest dielectric you can afford.","q":[{"k":"mc","p":"How should power and ground planes be arranged to reduce rail collapse?","o":["Adjacent, with the thinnest dielectric affordable","Far apart","On opposite outer layers","Only one plane"],"w":"Thin spacing lowers loop inductance."}]},{"t":"Higher Dk between planes","s":["bogatin",834],"x":"Between power and ground planes, a higher dielectric constant gives lower impedance, the opposite of what you want for signal layers.","q":[{"k":"tf","p":"A higher Dk between power and ground planes lowers PDN impedance.","v":true,"w":"More interplane capacitance."}]},{"t":"Power via near ground via","s":["bogatin",834],"x":"Pair each power via with a nearby ground via. If they aren't within a pitch about equal to their length, there's no coupling benefit.","q":[{"k":"mc","p":"Why place power vias close to ground vias?","o":["To lower loop inductance through coupling","To raise impedance","To save drill sizes","For silkscreen space"],"w":"Opposite currents close together cancel inductance."}]},{"t":"Many small vias","s":["bogatin",834],"x":"For power and ground connections, several small vias spread apart beat one large via.","q":[{"k":"mc","p":"Which is better for a power connection?","o":["Several small vias spread apart","One large via","Vias clustered tightly","No vias"],"w":"Parallel paths cut inductance."}]},{"t":"Opposite currents together","s":["bogatin",834],"x":"Route same-direction currents far apart and opposite-direction currents (like a supply and its return) close together.","q":[{"k":"mc","p":"How should a supply path and its return be routed?","o":["Close together","Far apart","On different boards","It doesn't matter"],"w":"Close opposite currents shrink loop inductance."}]},{"t":"Bulk vs many caps","s":["bogatin",835],"x":"Bulk capacitance takes over from the regulator at low frequency. Many smaller capacitors lower the equivalent inductance at high frequency.","q":[{"k":"match","p":"Match each capacitor role to its frequency range.","pairs":[["Bulk decoupling","Low frequency, after the regulator"],["Many small capacitors","High frequency, lower inductance"]],"w":"Different capacitors cover different bands."}]},{"t":"Small capacitor bodies","s":["bogatin",835],"x":"Use the smallest decoupling capacitor body you can and keep connections from its pads to the planes as short as possible.","q":[{"k":"mc","p":"Why prefer small decoupling capacitor packages?","o":["Lower loop inductance","Higher capacitance always","Cheaper solder","Easier silkscreen"],"w":"Smaller bodies and shorter connections mean less inductance."}]},{"t":"How long a cap lasts","s":["bogatin",840],"x":"For a 1 W chip, a decoupling capacitance holds the rail within 5% droop for about C/2 seconds. 10 nF covers only 5 ns.","q":[{"k":"num","p":"For a 1 W chip, how many ns does 100 nF of decoupling last by C/2?","v":50,"tol":0.5,"u":"ns","w":"100 nF ÷ 2 = 50 ns."}]},{"t":"Plane capacitance","s":["bogatin",840],"x":"Power-ground planes 1 mil apart give about 1 nF per square inch, scaling inversely with spacing.","q":[{"k":"num","p":"Planes 4 mil apart over 8 square inches. Capacitance in nF?","v":2,"tol":0.01,"u":"nF","w":"8 in² × 1 nF ÷ 4 = 2 nF."}]},{"t":"Capacitor loop inductance","s":["bogatin",841],"x":"A mounted SMT capacitor, including traces, vias and body, has about 2 nH of loop inductance. Getting below 1 nH takes careful design.","q":[{"k":"mc","p":"Typical loop inductance of a mounted SMT decoupling capacitor?","o":["About 2 nH","About 2 µH","About 2 pH","About 2 mH"],"w":"Mounting, not just the part, sets the inductance."}]},{"t":"Plane pair inductance","s":["bogatin",841],"x":"A pair of planes has about 33 pH per square for each mil of spacing. 2 mil spacing gives 66 pH per square.","q":[{"k":"num","p":"Planes 3 mil apart. Loop inductance per square in pH?","v":99,"tol":0.5,"u":"pH","w":"33 × 3 = 99 pH per square."}]},{"t":"Decap placement","s":["emi",54],"f":"decap","x":"Place decoupling capacitors millimetres, not centimetres, from IC power pins. Ground them straight into the adjacent plane and keep the loop small.","q":[{"k":"mc","p":"How close should decoupling caps be to IC power pins?","o":["Millimetres","Several centimetres","Anywhere on the board","At the connector"],"w":"Every bit of distance adds inductance."}]},{"t":"Fighting PDN noise","s":["si",30],"x":"To cut PDN noise: minimise PDN impedance, place power and ground planes close together, and use several low-inductance decoupling caps close to the pins.","q":[{"k":"mc","p":"Which reduces power distribution noise?","o":["Power and ground planes placed close together","Planes far apart","Fewer decoupling caps","Long power traces"],"w":"All three tactics lower PDN impedance."}]},{"t":"Differential I/O helps power","s":["bogatin",835],"x":"Differential I/Os draw steadier current than single-ended ones, reducing switching dI/dt on the power rails.","q":[{"k":"mc","p":"How can I/O choice reduce rail noise?","o":["Use differential pairs to reduce dI/dt","Use longer single-ended lines","Remove decoupling","Use faster edges"],"w":"Balanced current draw means less rail disturbance."}]}]},{"u":"Is it high speed?","c":12,"L":[{"t":"Is it a high-speed design?","s":["hs",11],"x":"Estimate the highest frequency content: Fm ≈ 0.5 ÷ Tr ≈ 2.5 × data rate. As a rough rule of thumb, Fm above 50 MHz means a high-speed design.","q":[{"k":"num","p":"Fastest rise time is 250 ps. Fm ≈ 0.5 ÷ Tr, in GHz?","v":2,"tol":0.01,"u":"GHz","w":"0.5 ÷ 250 ps = 2 GHz."},{"k":"num","p":"Data rate is 1 Gbps. Fm ≈ 2.5 × DTR, in GHz?","v":2.5,"tol":0.01,"u":"GHz","w":"2.5 × 1 = 2.5 GHz."}]},{"t":"The λ/12 rule","s":["hs",13],"x":"Wavelength λ = v ÷ Fm. If a connection is at least λ/12 long, treat it as high speed. On 370HR, signals travel about 6.9 in/ns as microstrip and 5.9 in/ns as stripline.","q":[{"k":"num","p":"Stripline at 5.9 in/ns, Fm = 200 MHz. What is λ/12 in inches?","v":2.46,"tol":0.03,"u":"in","w":"λ = 5.9 ÷ 0.2 = 29.5 in; ÷ 12 ≈ 2.46 in."},{"k":"tf","p":"At Fm ≥ 1 GHz, almost every PCB interconnect counts as high speed.","v":true,"w":"λ/12 drops to about half an inch."}]},{"t":"Signs of a complex board","s":["hs",14],"x":"Complexity needs its own care. Signs include more than 110 pins per square inch, more than 10 parts per square inch, mixed digital/RF/analog, mixed materials, or 8 to 12+ layers.","q":[{"k":"mc","p":"Which is listed as a sign of a complex design?","o":["More than 110 pins per square inch","A single resistor","Only through-hole parts","A one-layer board"],"w":"Density drives complexity."}]}]},{"u":"Placement for speed","c":12,"L":[{"t":"Floorplan first","s":["hs",79],"x":"A floorplan links schematic to layout. It lets small parts like bypass capacitors and termination resistors be placed early instead of squeezed in at the end, and groups functional blocks to reduce crossings.","q":[{"k":"mc","p":"What does a pre-placement floorplan prevent?","o":["Bypass caps and terminations getting squeezed in at the end","Running DRC","Exporting Gerbers","Using net labels"],"w":"Plan the small parts with the big ones."},{"k":"tf","p":"High-speed lines may cross splits in power planes.","v":false,"w":"Crossing a split breaks the return path."}]},{"t":"Placement order","s":["hs",80],"x":"Group circuits with the same VCC and GND. Place the main chips first per the floorplan with the shortest traces between them, then their crystals, decoupling capacitors and terminations.","q":[{"k":"ord","p":"Order these placement steps.","o":["Break the schematic into functional sections","Place main chips per the floorplan","Place crystals, decaps and terminations near them"],"w":"Big parts first, their helpers right after."}]},{"t":"Keep fast parts central","s":["hs",80],"x":"Board edges have different impedance and more EMI, and connectors there can radiate. Place sensitive high-speed devices near the centre. Keep big parts like connectors out of a hot BGA's airflow.","q":[{"k":"tf","p":"Sensitive high-speed devices are best placed near the board edge.","v":false,"w":"Near the centre reduces EMI influence."},{"k":"mc","p":"What should not sit in the airflow path to a hot BGA?","o":["Large components like connectors","Small resistors","Fiducials","Silkscreen"],"w":"Tall parts block the cooling air."}]},{"t":"Where terminations go","s":["hs",81],"f":"term","x":"A parallel termination goes as close as possible to the receiver's load pin, to keep its stub short. A series resistor goes inline right after the driver pin.","q":[{"k":"match","p":"Match the termination to its location.","pairs":[["Parallel termination","At the receiver load pin"],["Series termination","Right after the driver pin"]],"w":"Each is placed where it does its job with the shortest stub."}]},{"t":"Orientation and sides","s":["hs",82],"x":"Align similar parts the same way for easier routing and soldering. Put SMDs on one side and all through-hole parts on the top to cut assembly steps.","q":[{"k":"mc","p":"Where should through-hole parts go?","o":["Top side","Bottom side","Split across both","Inside the board"],"w":"Fewer assembly steps."}]},{"t":"Avoid sockets","s":["hs",83],"x":"Sockets add inductance. Minimise them in high-speed designs and choose packages that allow short traces.","q":[{"k":"tf","p":"Sockets add inductance to high-speed paths.","v":true,"w":"Solder the part down when you can."}]},{"t":"Surge protection at the door","s":["hs",84],"x":"Put surge-suppressing diodes and inductors right at the incoming connectors, and avoid vias between them, since vias add parasitic inductance.","q":[{"k":"mc","p":"Where do surge suppressors belong?","o":["Close to the incoming signal connectors","Next to the processor","Anywhere on the board","On the bottom side only"],"w":"Stop the surge where it enters."}]},{"t":"Pick package to fit the trace","s":["hs",103],"x":"Prefer SMDs for high speed. Pick a package whose width is close to the 50 Ω track width so the pad doesn't create a big impedance step.","q":[{"k":"mc","p":"Which package choice helps high-speed performance?","o":["Component width close to the 50 Ω track width","The largest package available","Through-hole only","A socketed part"],"w":"Matched widths mean smaller impedance mismatch."}]}]},{"u":"Routing for speed","c":12,"L":[{"t":"Routing order","s":["hs",85],"x":"Design the stack-up first, then set rules and net classes. Route critical traces first: crystals, then decoupling caps and their ground vias, then controlled-impedance traces, then the rest.","q":[{"k":"ord","p":"Order the routing stages.","o":["Design the stack-up","Set rules and net classes","Route crystals","Route decoupling caps and ground vias","Route controlled-impedance traces","Finish the remaining routing"],"w":"Critical first, everything else after."}]},{"t":"Never route in the ground plane","s":["hs",85],"x":"Use at least four layers so one inner layer is a full ground plane. Never break it with small tracks: removing copper adds parasitic impedance to nearby traces.","q":[{"k":"tf","p":"Running a short track through the ground plane is harmless.","v":false,"w":"Any gap adds impedance to neighbouring traces."}]},{"t":"Grounds on two-layer boards","s":["hs",86],"x":"On a two-layer board a good ground isn't guaranteed. Put a full ground under the most critical section, route mostly on top, and tie top and bottom grounds with lots of vias.","q":[{"k":"mc","p":"How are top and bottom grounds joined on a two-layer board?","o":["Lots of interconnecting vias","One via","A jumper wire","They aren't joined"],"w":"Many vias keep the two pours acting as one ground."}]},{"t":"Via voids and hot spots","s":["hs",87],"x":"Signal vias punch holes in planes. Crowded vias create hot spots where plane current crowds. Leave room for copper between vias, about 15 mil apart where possible.","q":[{"k":"num","p":"Rule-of-thumb via spacing to avoid plane hot spots, in mil?","v":15,"tol":0,"u":"mil","w":"Leave copper between the holes."}]},{"t":"Serpentine geometry","s":["hs",88],"f":"serp","x":"For length tuning with a serpentine, keep at least 4× the trace width between adjacent copper of the same trace, and make each segment at least 1.5× the width. DRC usually won't check this because it's one net.","q":[{"k":"num","p":"A 5 mil trace meanders. Minimum gap between its own segments, in mil?","v":20,"tol":0,"u":"mil","w":"4 × 5 = 20 mil."},{"k":"tf","p":"Most DRCs catch serpentine segments that are too close.","v":false,"w":"Same net, so DRC ignores it."}]},{"t":"Stubs from pull-ups","s":["hs",89],"x":"Long stubs act as antennas and cause reflections. Pull-up and pull-down resistors are common sources. Route through them as a daisy chain instead.","q":[{"k":"mc","p":"How should a pull-up on a fast line be routed?","o":["As a daisy chain","On a long branch","Through a socket","On another board"],"w":"No branch, no stub."}]},{"t":"Pairs on one layer","s":["hs",92],"x":"Route both traces of a differential pair on the same layer with the same number of vias so the impedance requirement is met.","q":[{"k":"tf","p":"Each trace of a pair may use a different number of vias.","v":false,"w":"Same layer, same via count."}]},{"t":"Match each segment","s":["hs",94],"x":"When vias split a pair into segments, correct the length mismatch in each segment. DRC only checks the total, so it misses this. Route matched signals on the same layer, since speed differs between layers.","q":[{"k":"mc","p":"Why doesn't DRC catch per-segment mismatch?","o":["It only checks length difference over the whole connection","It ignores differential pairs","It only checks silkscreen","It needs Gerbers"],"w":"Total match can hide local skew."}]},{"t":"CAD length quirks","s":["hs",95],"x":"Some tools count trace inside a pad as length, and some skip via length. Make pad entries equal for both signals, and prefer a symmetric breakout over serpentines.","q":[{"k":"mc","p":"How do you stop pad-internal length from showing false mismatch?","o":["Make pad entry equal for both signals","Use bigger pads","Turn off DRC","Add vias"],"w":"Symmetric entries cancel the tool's quirk."}]},{"t":"Stitching capacitors","s":["hs",97],"f":"returnpath","x":"Don't route over a split plane. If a signal must cross between reference planes, place a stitching capacitor close to the signal so the return current can jump planes. Values are generally 10 nF to 100 nF.","q":[{"k":"mc","p":"Typical stitching capacitor range?","o":["10 nF to 100 nF","1 pF to 10 pF","1 µF to 10 µF","1 mF"],"w":"Placed close to where the signal crosses."}]},{"t":"Ground vias at both ends","s":["hs",98],"x":"Place ground vias at the source and sink. Without them, return current flows on a top-layer ground trace instead of the plane the impedance was calculated against.","q":[{"k":"tf","p":"One ground via at the far end is enough for the return path.","v":false,"w":"Both source and sink need ground vias."}]},{"t":"Joining analog and digital ground","s":["hs",101],"x":"With split grounds, join analog and digital ground at a single point close to the IC, often through a ferrite bead or 0 Ω resistor. Digital signals must not cross the analog ground and vice versa. One solid ground plane is still preferable.","q":[{"k":"mc","p":"What commonly joins split analog and digital ground?","o":["A ferrite bead or zero-ohm resistor","A long trace","A fuse","Nothing"],"w":"One controlled joint, near the IC."}]},{"t":"Thermal pad vias","s":["hs",108],"x":"Vias in a QFN thermal pad let solder flow to the planes and stop the package floating during reflow. Stencil windowpanes help when vias are missing, but less well.","q":[{"k":"mc","p":"Why put vias in a QFN thermal pad?","o":["Help solder flow and stop the package floating","Increase impedance","Hide the pad","Replace the stencil"],"w":"Better joint, better heat path."}]}]},{"u":"When speed matters","c":13,"L":[{"t":"Edges, not clocks","s":["ritchey",149],"x":"Ritchey shows that overshoot comes from the fast edge, not the clock frequency. A slow clock with fast edges is still a high-speed design.","q":[{"k":"tf","p":"A board with a slow clock can't have high-speed problems.","v":false,"w":"Edge speed sets the problem, not clock rate."}]},{"t":"The ¼ TEL rule","s":["ritchey",152],"f":"tel","x":"TEL (Transition Electrical Length) is the edge's rise or fall time converted to a length on the board. Lines shorter than ¼ TEL can be treated as \"don't care\"; longer ones need impedance control. Signals travel about 6 in/ns on most PCBs.","q":[{"k":"num","p":"0.5 ns edge at 6 in/ns. ¼ TEL in inches?","v":0.75,"tol":0.01,"u":"in","w":"0.5 × 6 = 3 in; ÷ 4 = 0.75 in."}]},{"t":"Almost every line counts","s":["ritchey",153],"x":"Modern logic has edges of 0.5 ns or less, so nearly every signal on a current board can fail from overshoot. The edge-to-length ratio decides when to control impedance.","q":[{"k":"mc","p":"What primarily decides when to invoke impedance control?","o":["Ratio of TEL to rise/fall time","Clock frequency alone","Board colour","Number of layers"],"w":"Fast edges make short lines \"long\"."}]}]},{"u":"Stubs","c":13,"L":[{"t":"A quarter-wave stub","s":["ritchey",194],"f":"stub","x":"A stub's open end reflects the wave back un-inverted. At a quarter wavelength it returns 180° out of phase and cancels the signal. This happens at every odd multiple of a quarter wave.","q":[{"k":"mc","p":"At which stub lengths does the signal get \"shorted out\"?","o":["Odd multiples of a quarter wavelength","Any length under 1 mm","Even multiples of a wavelength","Only exactly 1 wavelength"],"w":"Reflected wave arrives 180° out of phase."}]},{"t":"How short is short enough","s":["ritchey",196],"x":"A 1.5 ns edge has a first harmonic near 240 MHz, where a quarter-wave stub in FR-4 is about 6 in and an eighth-wave about 3 in. Ritchey's limit for 1.5 ns edges: stubs under 3 in.","q":[{"k":"num","p":"Stub limit for 1.5 ns edges, in inches?","v":3,"tol":0,"u":"in","w":"An eighth wave at the first harmonic."}]},{"t":"Fast links are point-to-point","s":["ritchey",196],"x":"Below about 300 ps edges, even the leads into an IC package act as stubs. That's why Gb/s links connect only two points.","q":[{"k":"tf","p":"Gb/s links are kept point-to-point to avoid stub problems.","v":true,"w":"A part in the middle of a net adds a long stub."}]}]},{"u":"Myths, tested","c":13,"L":[{"t":"Right angles are fine","s":["ritchey",224],"x":"Ritchey's TDR tests at 125 ps (and a Rolla test at 18 ps) found no impedance change from 90° bends. He says they don't cause SI problems or EMI and are not acid traps. The \"no 90°\" rule traces back to a flawed 1973 handbook figure.","q":[{"k":"tf","p":"Per Ritchey's tests, 90° bends cause measurable reflections at practical edge speeds.","v":false,"w":"No detectable impedance change, even at 125 ps."},{"k":"mc","p":"Where did the \"no right angles\" rule come from, per Ritchey?","o":["A flawed figure in a 1973 handbook","An IPC standard","FCC rules","A fab capability limit"],"w":"The handbook's author said the figure should not have been published."}]},{"t":"How big is a via?","s":["ritchey",225],"x":"Measured in a 100 mil thick board, a 13 mil drilled via adds about 0.25 pF and a 30 mil via about 0.6 pF. The drilled hole size, not the finished size, sets the capacitance.","q":[{"k":"match","p":"Match the drilled via to its measured capacitance.","pairs":[["13 mil drill","≈ 0.25 pF"],["30 mil drill","≈ 0.6 pF"]],"w":"Bigger barrel, more capacitance."}]},{"t":"Routing vias are fine","s":["ritchey",230],"x":"Small routing vias (13 mil or less) are visible on a TDR but too small to matter, even with 200 ps edges. Banning them complicates routing for no benefit. Very large vias, like press-fit holes in thick backplanes, are a different story at 2.4 Gb/s and up.","q":[{"k":"tf","p":"Small routing vias significantly degrade signals with 200 ps edges.","v":false,"w":"Their effect is too small to notice."}]}]},{"u":"Flex materials","c":14,"L":[{"t":"Polyimide's steady Dk","s":["flex",8],"x":"Flex cores and coverlays are polyimide, with Dk around 3.2 to 3.4. With no woven glass, Dk varies less. Copper is usually thin rolled-annealed, 0.5 oz or less.","q":[{"k":"mc","p":"Why does polyimide flex have less Dk variation?","o":["No woven glass reinforcement","Thicker copper","It has a higher Tg","It is always black"],"w":"No glass weave, no weave effect."}]},{"t":"Adhesive or adhesive-less","s":["flex",9],"x":"Acrylic adhesive softens with heat and can crack via plating; it also thickens the laminate and absorbs moisture. Adhesive-less material is thinner, more flexible and better for impedance and harsh environments.","q":[{"k":"match","p":"Match the material to its trait.","pairs":[["Adhesive-based","Can crack via holes, absorbs moisture"],["Adhesive-less","Thinner, better controlled impedance"]],"w":"No glue layer, fewer problems."}]}]},{"u":"Bending","c":14,"L":[{"t":"Bend radius by layer count","s":["flex",11],"f":"bend","x":"Sierra's flex guide sets minimum bend radius by layer count: single-sided 6× flex thickness, double-sided 12×, multilayer 24×.","q":[{"k":"num","p":"Double-sided flex, 8 mil thick. Minimum bend radius (12×), in mil?","v":96,"tol":0,"u":"mil","w":"8 × 12 = 96 mil."}]},{"t":"Dynamic flex","s":["flex",13],"f":"bend","x":"A static flex bends fewer than about 100 times, usually just at install. A dynamic flex bends tens of thousands of times in use and needs a minimum bend radius of 100× its finished thickness.","q":[{"k":"num","p":"Dynamic flex, 0.004 in thick. Minimum bend radius in inches?","v":0.4,"tol":0.001,"u":"in","w":"100 × 0.004 = 0.4 in."}]},{"t":"The neutral bend axis","s":["flex",14],"x":"When flex bends, one plane feels almost no stretch or squeeze: the neutral bend axis. Single-layer builds keep copper close to it, which is why IPC-2223 favours them for dynamic flex.","q":[{"k":"mc","p":"What is the neutral bend axis?","o":["The plane with minimum tension or compression","The stiffener edge","The thickest layer","The copper pour"],"w":"Copper near it suffers least."}]},{"t":"Traces across the bend","s":["flex",15],"f":"flexbend","x":"Run traces straight across the bend, perpendicular to the bend line. Keep plated holes out of the bend and leave room between the bend and any rigid transition.","q":[{"k":"tap","p":"Tap the trace routed the right way through the bend.","scene":"flexbend","hit":"perp","w":"Perpendicular traces flex evenly."}]},{"t":"Hatch the planes","s":["flex",15],"x":"Solid planes stiffen flex. Cross-hatch ground and power planes; Sierra suggests 0.015 in lines with 0.025 in spacing.","q":[{"k":"tf","p":"A solid copper flood is the best plane for a flex area.","v":false,"w":"A solid plane won't bend; hatch it."}]},{"t":"Stagger front and back","s":["flex",16],"x":"In multilayer flex, offset traces on the front and back layers instead of stacking them. Stacked traces stiffen the bend and thin the copper there. Use curved traces, not corners.","q":[{"k":"mc","p":"How should traces on opposite flex layers be arranged?","o":["Staggered","Stacked directly on top of each other","Both on one layer only","It doesn't matter"],"w":"Staggering spreads the stress."}]}]},{"u":"Pads and vias on flex","c":14,"L":[{"t":"Teardrops everywhere","s":["flex",19],"x":"Flex pads can lift. Anchor them with spurs under coverlay, make them large, and add teardrops where traces meet pads or change width.","q":[{"k":"tf","p":"Teardrops are recommended on all flexible PCBs.","v":true,"w":"They remove stress points."}]},{"t":"Keep vias out of the bend","s":["flex",20],"x":"Vias in flexing areas crack quickly. Vias over a stiffener a const CLOUD={db:null,ref:null,state:"local",busy:false,again:false,t:null};
function save(keepStamp){if(!keepStamp) S.u=Date.now(); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} queueCloud();}
function queueCloud(){if(!CLOUD.ref) return; clearTimeout(CLOUD.t); CLOUD.t=setTimeout(pushCloud,1200);}
async function pushCloud(){
  if(!CLOUD.ref) return; if(CLOUD.busy){CLOUD.again=true; return;}
  CLOUD.busy=true; const body=JSON.parse(JSON.stringify(S));
  try{await CLOUD.ref.set({v:2,s:body}); CLOUD.state="cloud";}
  catch(e){ if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{await CLOUD.ref.set({v:2,s:body}); CLOUD.state="cloud";}catch(e2){CLOUD.state="error";}}

}
function syncText(){if(PWA) return "Saved on this device. Use Export to keep a backup or move to another device."; return CLOUD.state==="cloud"?"Saved to your Claude account. It follows you to any device where you open this page.":CLOUD.state==="error"?"Couldn't reach your account just now; saved in this browser and will retry on your next answer.":"Saved in this browser only. Open the page signed in to claude.ai to save to your account.";}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [user,db]=await Promise.all([claude.use("user"),claude.use("db")]);
    if(!user||!db) return;
    const uid=await user.id(); if(!uid) return;
    const ref=db.doc("data/users/"+uid+"/progress");
    const snap=await ref.get();
    CLOUD.db=db; CLOUD.ref=ref;
    const remote=snap.exists&&snap.data()&&snap.data().s;
    if(remote&&(remote.u||0)>(S.u||0)){ S=Object.assign(fresh(),JSON.parse(JSON.stringify(remote))); try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} checkStreak(); CLOUD.state="cloud"; if(!run) render(); }

}
const pad2=n=>String(n).padStart(2,"0");
const dayOf=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const today=()=>dayOf(new Date());
const daysBetween=(a,b)=>Math.round((new Date(b+"T12:00")-new Date(a+"T12:00"))/864e5);
function checkStreak(){ // break the streak on load if a day was missed and no freeze covers it
  if(!S.lastDay) return;
  const gap=daysBetween(S.lastDay,today());
  if(gap>1){const need=gap-1; if(S.freezes>=need){S.freezes-=need; S.frozeOn=today(); S.lastDay=dayOf(new Date(Date.now()-864e5));} else S.streak=0; save(true);}
}
checkStreak();
function addXP(n){
  if(n<=0) return;
  const t=today();
  if(S.lastDay!==t){const gap=S.lastDay?daysBetween(S.lastDay,t):99; S.streak=gap===1?S.streak+1:1; S.lastDay=t;
    if(S.streak>0&&S.streak%7===0&&S.freezes<2){S.freezes++; toast("Streak freeze earned");}
    S.best=Math.max(S.best||0,S.streak);}
  S.days[t]=(S.days[t]||0)+n; S.xp+=n;
}

function curve(P){ // Catmull-Rom through points -> cubic bezier path
  if(P.length<2) return "";
  let d=`M${P[0].x.toFixed(2)} ${P[0].y}`;
  for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=` C${c1x.toFixed(2)} ${c1y.toFixed(1)} ${c2x.toFixed(2)} ${c2y.toFixed(1)} ${p2.x.toFixed(2)} ${p2.y}`;}
  return d;
}
let listW=358;
function unitTrack(u,ui,nid){
  const n=u.ids.length, step=90, top=52, H=top+(n-1)*step+58, ph=ui*1.7;
  const P=u.ids.map((id,k)=>({x:50+30*Math.sin(k*1.05+ph),y:top+k*step}));
  let s=u.ids.findIndex(id=>!(id in S.done)); const all=s<0; if(all) s=n-1;
  const dDone=curve(P.slice(0,s+1)), dLock=all?"":curve(P.slice(s));
  const T=(d,cls,w)=>d?`<path d="${d}" class="${cls}" fill="none" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`:"";
  let h=`<div class="track" style="height:${H}px"><svg class="tube" viewBox="0 0 100 ${H}" preserveAspectRatio="none" style="height:${H}px" aria-hidden="true">${T(dLock,"ink",26)}${T(dLock,"hole",20)}${T(dDone,"ink",28)}${T(dDone,"lime",22)}</svg>`;
  u.ids.forEach((id,k)=>{const p=P[k], L=LESSONS[id], d=id in S.done, cur=id===nid, miss=S.miss.some(m=>m.split(":")[0]==id);
    h+=`<button class="bead ${BL(id)} ${d?"done":""} ${cur?"cur":""}" style="left:${p.x}%;top:${p.y}px" data-open="${id}" aria-label="Lesson ${id+1}: ${esc(L.t)}${d?" (done)":cur?" (up next)":""}" title="${esc(L.t)}">${id+1}${d&&S.done[id].p?'<span class="st" aria-hidden="true">★</span>':""}${miss?'<span class="mx" aria-hidden="true"></span>':""}</button>`;
    if(cur){const left=p.x<50, room=(left?100-p.x:p.x)/100*listW-66, pos=left?`left:calc(${p.x}% + 56px)`:`right:calc(${100-p.x}% + 56px)`;
      h+=`<span class="splat" style="left:calc(${p.x}% ${left?"-":"+"} 52px);top:${p.y-30}px;width:12px;height:12px"></span><span class="splat" style="left:calc(${p.x}% ${left?"-":"+"} 40px);top:${p.y+30}px;width:18px;height:18px"></span><span class="splat" style="left:calc(${p.x}% ${left?"+":"-"} 30px);top:${p.y-50}px;width:9px;height:9px"></span>`;
      if(room>=140) h+=`<div class="nextcard" style="${pos};top:${p.y}px;width:${Math.min(200,room)}px;${left?"":"text-align:right;align-items:flex-end"}"><span class="eyebrow">Up next · ${L.q.length} step${L.q.length>1?"s":""}</span><b>${esc(L.t)}</b><button class="go" data-open="${id}">START →</button></div>`;}
  });
  return h+`</div>`;
}

function drawOrder(q,st){

function drawMatch(q,st){
  const tags={}; let n=1; st.left.forEach(i=>{if(st.pair[i]!==undefined) tags[i]=n++;});
  $$("[data-ml]").forEach(b=>{const i=+b.dataset.ml; b.classList.toggle("sel",st.sel===i); if(st.pair[i]!==undefined){b.dataset.pair=st.pair[i]; b.dataset.tag=tags[i];} else {delete b.dataset.pair; delete b.dataset.tag;}});
  $$("[data-mr]").forEach(b=>{const r=+b.dataset.mr; const l=Object.keys(st.pair).find(k=>st.pair[k]===r); if(l!==undefined){b.dataset.pair=l; b.dataset.tag=tags[l];} else {delete b.dataset.pair; delete b.dataset.tag;}});
  $("[data-act=checkmatch]").disabled=Object.keys(st.pair).length!==q.pairs.length;
}
function parseNum(s){s=String(s).trim().replace(",",".").replace(/[^\d.eE+-]/g,""); const v=parseFloat(s); return Number.isFinite(v)?v:null;}
function numOK(q,v){if(v===null) return false; const tol=q.tol||0; return Math.abs(v-q.v)<=tol+Math.max(1e-9,Math.abs(q.v)*1e-9);}
/* handle a step interaction; returns null if not finished, else true/false */
function handleStep(e,q,st){
  if(st.answered) return null;
  if(q.k==="mc"){const a=e.target.closest("[data-ans]"); if(!a) return null; const ok=+a.dataset.ans===0;
    $$("#lesson [data-ans]").forEach(b=>{b.disabled=true; if(+b.dataset.ans===0) b.classList.add("right"); else if(b===a) b.classList.add("wrong");}); return ok;}
  if(q.k==="tf"){const a=e.target.closest("[data-tf]"); if(!a) return null; const pick=a.dataset.tf==="1", ok=pick===q.v;
    $$("#lesson [data-tf]").forEach(b=>{b.disabled=true; if((b.dataset.tf==="1")===q.v) b.classList.add("right"); else if(b===a) b.classList.add("wrong");}); return ok;}
  if(q.k==="ord"){
    const p=e.target.closest("[data-pick]"); if(p){st.seq.push(+p.dataset.pick); drawOrder(q,st); return null;}
    const u=e.target.closest("[data-unpick]"); if(u){st.seq.splice(+u.dataset.unpick,1); drawOrder(q,st); return null;}
    const act=e.target.closest("[data-act]"); if(!act) return null;
    if(act.dataset.act==="reset"){st.seq=[]; drawOrder(q,st); return null;}
    if(act.dataset.act==="checkord"){const ok=st.seq.every((v,k)=>v===k);
      $("#seq").innerHTML=st.seq.map((i,k)=>`<div class="chip ${i===k?"ok":"no"}"><span class="n">${k+1}</span>${esc(q.o[i])}</div>`).join("");
      $("#pool").innerHTML=ok?"":`<div class="eyebrow" style="margin:6px 0">Correct order</div>`+q.o.map((o,k)=>`<div class="chip ok"><span class="n">${k+1}</span>${esc(o)}</div>`).join("");
      $$("#lesson [data-act]").forEach(b=>b.disabled=true); return ok;}
    return null;}
  if(q.k==="num"){const act=e.target.closest("[data-act=checknum]"); if(!act) return null; const inp=$("#numv"); const v=parseNum(inp.value); if(v===null){inp.focus(); return null;}
    const ok=numOK(q,v); inp.classList.add(ok?"ok":"no"); inp.disabled=true; act.disabled=true; if(!ok) st.extra=`Answer: ${q.v}${q.u?" "+q.u:""}`; return ok;}
  if(q.k==="match"){
    const l=e.target.closest("[data-ml]"); if(l){const i=+l.dataset.ml; if(st.pair[i]!==undefined){delete st.pair[i]; st.sel=i;} else st.sel=(st.sel===i?null:i); drawMatch(q,st); return null;}
    const r=e.target.closest("[data-mr]"); if(r){const j=+r.dataset.mr; if(st.sel===null){const l2=Object.keys(st.pair).find(k=>st.pair[k]===j); if(l2!==undefined){delete st.pair[l2]; st.sel=+l2;} drawMatch(q,st); return null;}
      Object.keys(st.pair).forEach(k=>{if(st.pair[k]===j) delete st.pair[k];}); st.pair[st.sel]=j; st.sel=null; drawMatch(q,st); return null;}
    const act=e.target.closest("[data-act=checkmatch]"); if(!act) return null;
    let ok=true; $$("[data-ml]").forEach(b=>{const i=+b.dataset.ml, good=st.pair[i]===i; if(!good) ok=false; b.classList.add(good?"ok":"no"); b.disabled=true;});
    $$("[data-mr]").forEach(b=>{const j=+b.dataset.mr; const l2=Object.keys(st.pair).find(k=>st.pair[k]===j); b.classList.add(+l2===j?"ok":"no"); b.disabled=true;});
    act.disabled=true; if(!ok) st.extra="Correct pairs: "+q.pairs.map(p=>p[0]+" → "+p[1]).join(" · "); return ok;}
  if(q.k==="tap"){const h=e.target.closest("[data-hit]"); if(!h) return null; const ok=h.dataset.hit===q.hit;
    const sc=h.closest(".scene"); if(sc) sc.classList.add("answered");
    $$("#lesson [data-hit]").forEach(g=>{g.removeAttribute("tabindex"); if(g.dataset.hit===q.hit) g.classList.add("ok"); else if(g===h) g.classList.add("no");}); return ok;}
  return null;
}

  <section class="card" style="margin-top:20px"><b style="font:800 18px var(--f-display)">Your progress</b><p style="font-size:13px;margin:4px 0 10px" id="syncnote">${syncText()}</p>${PWA?`<div class="row" style="margin:0 0 10px"><button class="btn" id="exp">EXPORT BACKUP</button><label class="btn" for="impf">IMPORT BACKUP</label><input type="file" id="impf" accept="application/json,.json" hidden></div>`:""}<button class="btn" id="rs">RESET PROGRESS</button><div id="rsc"></div></section>`;
  $$("[data-goal]").forEach(b=>b.onclick=()=>{S.goal=+b.dataset.goal;save();renderBadges();});
  $("#rs").onclick=()=>{$("#rsc").innerHTML=`<div class="confirm"><p style="margin:0 0 10px">Erase all progress, XP, streak and badges${PWA?" on this device":" (here and in your account)"}?</p><div class="row" style="margin:0"><button class="btn primary" id="rsy">ERASE</button><button class="btn" id="rsn">KEEP IT</button></div></div>`;$("#rsy").onclick=()=>{S=fresh();save();render();};$("#rsn").onclick=()=>{$("#rsc").innerHTML="";};};
}
/* ---------- SOURCES ---------- */
function renderSources(){
  const cnt={}; LESSONS.forEach(L=>{cnt[L.s[0]]=(cnt[L.s[0]]||0)+1;});
  const keys=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]);
  let html=`<div class="phead">${melt()}${header()}<h1 class="on-melt">Every lesson<br>cites a page.</h1></div>
  <p class="lead">Before this app was built, a script checked a phrase from each of the ${TOTAL} lessons against the exact page it cites. Lessons are paraphrased; tap a citation inside a lesson to open it.</p>
  <section class="card" style="margin-bottom:12px"><b style="font:800 16px var(--f-display)">How sources were checked</b><p style="margin:4px 0 0;font-size:13.5px">Book PDFs: phrase matched exactly in the page's text.${Object.values(SRC).some(s=>s.ocr)?" Scanned books were read with OCR and matched with a small tolerance.":""} Altium lessons: matched against short quotes taken from Altium's live documentation; Altium's own screenshots are on those pages, and the drawings here are original.</p></section><div class="list">`;
  keys.forEach((k,i)=>{const s=SRC[k]; const link=s.web?`<a href="${s.urls[0]}" target="_blank" rel="noopener">DOCS ↗</a>`:s.url?`<a href="${s.url}" target="_blank" rel="noopener">PDF ↗</a>`:"";
    html+=`<div class="srcrow"><span class="c ${BL(i)} num">${cnt[k]}</span><span><b>${esc(s.title)}</b><small>${esc(s.author)}${s.year?" · "+s.year:""}${s.ocr?" · OCR":""}${link?" · "+link:""}${s.note?"<br>"+esc(s.note):""}</small></span></div>`;});
  $("#app").innerHTML=html+`</div>`;
}
render();
if(PWA){
  if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  document.addEventListener("click",e=>{
    if(e.target.id!=="exp") return;
    const blob=new Blob([JSON.stringify({app:"copper-path",v:2,s:S})],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`copper-path-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
  document.addEventListener("change",async e=>{
    if(e.target.id!=="impf"||!e.target.files[0]) return;
    try{const j=JSON.parse(await e.target.files[0].text()); if(j.app!=="copper-path"||!j.s||typeof j.s!=="object") throw 0;
      S=Object.assign(fresh(),j.s); save(); render(); toast("Backup restored");}
    catch(err){toast("That file isn't a Copper Path backup");}
  });
} else initCloud();
</script>
</body></html>
