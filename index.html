mum outer-layer width and space for 2 oz copper?","o":["7 mil / 7 mil","2 mil / 2 mil","14 mil / 14 mil","5 mil / 5 mil"],"w":"2 oz copper: 7 mil line, 7 mil space on outer layers."}]}]},{"u":"Etching and minimums","c":5,"L":[{"t":"Undercut","s":["trace",7],"x":"Etchant attacks trace sidewalls, leaving a trapezoid instead of a rectangle. Thicker copper undercuts more because it etches longer, so specify slightly wider traces.","q":[{"k":"mc","p":"Why does 2 oz copper undercut more than 1 oz?","o":["It needs longer etching","It is softer","It has lower Dk","It is plated with gold"],"w":"Longer etch time removes more copper from the sides."}]},{"t":"Etch tolerance","s":["trace",7],"x":"Typical etch tolerances are about ±10% of trace width, or ±0.025 mm on high-precision processes. Traces under 0.1 mm need advanced processes.","q":[{"k":"num","p":"A 10 mil trace has ±10% etch tolerance. What is the narrowest it could come out, in mil?","v":9,"tol":0,"u":"mil","w":"10 mil − 10% = 9 mil."}]},{"t":"Fab capability tiers","s":["trace",7],"x":"Sierra lists minimum trace/space for rigid boards as 4 mil standard, 3 mil advanced and 2 mil micro. Flex and rigid-flex need at least 3.5 mil.","q":[{"k":"match","p":"Match each rigid-board tier to its minimum trace/space.","pairs":[["Standard","4 mil"],["Advanced","3 mil"],["Micro","2 mil"]],"w":"Finer features cost more; use standard when you can."}]},{"t":"Copper away from edges","s":["trace",9],"x":"Keep copper 15 mil from the board edge on inner layers and 10 mil on outer layers. Keep 15 mil from any V-score.","q":[{"k":"mc","p":"Recommended inner-layer edge-to-copper clearance?","o":["15 mil","1 mil","100 mil","0 mil"],"w":"Copper too close to the edge risks delamination and exposure."}]},{"t":"Pad-to-pad","s":["trace",9],"x":"Keep more than 5 mil between adjacent pads to avoid solder bridging and accidental connections.","q":[{"k":"mc","p":"What pad-to-pad clearance does the guide recommend?","o":["More than 5 mil","Less than 1 mil","Exactly 0 mil","More than 100 mil"],"w":"Over 5 mil helps prevent solder bridges."}]},{"t":"Sizing a pad","s":["trace",10],"x":"Minimum pad size = drill size + 2 × annular ring + fabrication tolerance. The tolerance covers drill wander.","q":[{"k":"num","p":"Drill 10 mil, annular ring 5 mil, tolerance 4 mil. Minimum pad size in mil?","v":24,"tol":0,"u":"mil","w":"10 + 2×5 + 4 = 24 mil."}]}]},{"u":"High voltage spacing","c":5,"L":[{"t":"Creepage vs clearance","s":["trace",10],"x":"Clearance is the shortest distance through air between conductors. Creepage is the shortest distance along the surface of the insulation.","q":[{"k":"match","p":"Match each term to how it is measured.","pairs":[["Clearance","Straight line through air"],["Creepage","Along the insulation surface"]],"w":"Creepage follows the board surface, so it is usually longer."}]},{"t":"Which voltage to use","s":["trace",11],"x":"Clearance is based on peak DC voltage; creepage uses RMS AC voltage. Both depend on the working voltage.","q":[{"k":"mc","p":"Creepage is calculated from which voltage?","o":["RMS AC voltage","Peak DC voltage","Average DC voltage","Ripple voltage"],"w":"Creepage uses RMS AC; clearance uses peak DC."}]},{"t":"Class 2/3 minimum spacing","s":["trace",11],"x":"For class 2 and 3 boards, the recommended minimum trace-to-trace spacing is 0.25 mm (10 mil) for low voltage and 0.50 mm (20 mil) for high voltage.","q":[{"k":"mc","p":"Recommended high-voltage trace spacing for class 2/3?","o":["0.50 mm (20 mil)","0.05 mm (2 mil)","5 mm (200 mil)","0.25 mm (10 mil)"],"w":"High voltage: 20 mil; low voltage: 10 mil."}]},{"t":"Pollution degrees","s":["trace",12],"x":"IEC 62368-1 creepage depends on pollution degree: 1 is dry or sealed, 2 is mostly non-conductive with occasional condensation, 3 is conductive dust or humidity, 4 is persistent conductivity like rain or snow.","q":[{"k":"match","p":"Match each pollution degree to an example.","pairs":[["Degree 1","Sealed or potted product"],["Degree 2","Laboratory"],["Degree 3","Heavy industrial, dusty site"],["Degree 4","Exposed to rain or snow"]],"w":"Dirtier environments need more creepage."}]},{"t":"IPC-2221B spacing table","s":["trace",21],"x":"IPC-2221B lists spacing by voltage and condition. Column B2 covers uncoated external conductors up to 3050 m; for 31-50 V it requires 0.6 mm.","q":[{"k":"mc","p":"What does IPC-2221B column B1 cover?","o":["Internal conductors","Uncoated external conductors above 3050 m","Conformal-coated leads","Mounting hardware"],"w":"B1 is internal; B2 and B3 are uncoated external below and above 3050 m."}]}]},{"u":"Planes, impedance and crosstalk","c":5,"L":[{"t":"Plane clearances","s":["trace",12],"x":"Sierra recommends 6 mil from a plane to any pad or trace, and 6 mil or more between split-plane segments.","q":[{"k":"mc","p":"Recommended plane-to-pad clearance?","o":["6 mil","0.6 mil","60 mil","600 mil"],"w":"6 mil for both plane-to-feature and split gaps."}]},{"t":"Typical 50 Ω width","s":["trace",13],"x":"On 1 oz copper, FR-4 and a 4 mil dielectric, a 50 Ω single-ended trace is typically 5-7 mil wide. A 90-100 Ω pair uses 4-6 mil traces with 4-8 mil spacing.","q":[{"k":"mc","p":"Typical 50 Ω trace width on 1 oz, FR-4, H = 4 mil?","o":["5-7 mil","25-30 mil","1 mil","50 mil"],"w":"The guide's table gives 5-7 mil."}]},{"t":"Spacing beats crosstalk","s":["trace",14],"x":"Minimum spacing guidelines: digital above 50 MHz more than 4× trace width, RF/microwave more than 5×, sensitive analog more than 3×.","q":[{"k":"match","p":"Match each signal type to its minimum spacing.","pairs":[["Digital >50 MHz","More than 4× trace width"],["RF/microwave","More than 5× trace width"],["Sensitive analog","More than 3× trace width"]],"w":"More spacing means less coupling."},{"k":"num","p":"A digital trace above 50 MHz is 5 mil wide. Minimum spacing in mil (by the 4× rule)?","v":20,"tol":0,"u":"mil","w":"4 × 5 mil = 20 mil (more is better)."}]},{"t":"Heavy copper","s":["trace",14],"x":"Heavy copper boards use 2 oz to 20 oz or more. They carry more current, spread heat and make tougher plated holes.","q":[{"k":"mc","p":"What range do heavy copper boards commonly use?","o":["2 oz to 20 oz","0.25 oz to 0.5 oz","Exactly 1 oz","50 oz to 100 oz"],"w":"Anything well above 1 oz counts as heavy."}]},{"t":"Heavy copper DFM","s":["trace",15],"x":"For heavy copper, design traces 0.05-0.1 mm wider than nominal to cover undercut, and use thermal relief spokes on pads tied to big planes.","q":[{"k":"mc","p":"How much extra width does the guide suggest for heavy copper undercut?","o":["0.05-0.1 mm","5-10 mm","0 mm","1-2 mm"],"w":"A small allowance offsets sidewall loss."}]},{"t":"Thermal relief","s":["trace",16],"f":"thermal","x":"A thermal relief pad joins a copper pour through four spokes instead of solid copper, so soldering heat isn't sucked away.","q":[{"k":"tap","p":"Tap the thermal relief pad.","scene":"thermal","hit":"relief","w":"The spoked pad limits heat flow into the pour."}]}]},{"u":"Holes, rings and standards","c":5,"L":[{"t":"Drill-to-drill spacing","s":["trace",17],"x":"Keep mechanically drilled holes 8-10 mil apart and laser holes at least 5 mil apart to prevent breakouts and shorts.","q":[{"k":"mc","p":"Minimum spacing between mechanically drilled holes?","o":["8-10 mil","1-2 mil","50 mil","0 mil"],"w":"Laser holes can be closer, at 5 mil or more."}]},{"t":"Annular ring sizes","s":["trace",18],"x":"Recommended pad sizes: class 2 vias = drill + 7 mil; class 2 component holes = drill + 9 mil; class 3 outer = drill + 10 mil; class 3 inner = drill + 11 mil.","q":[{"k":"num","p":"A class 2 via has a 12 mil drill. Recommended pad size in mil?","v":19,"tol":0,"u":"mil","w":"12 + 7 = 19 mil."}]},{"t":"Aspect ratio limits","s":["trace",19],"x":"Aspect ratio = board thickness ÷ drill diameter. Maximums: standard via 10:1, buried mechanical via 8:1, microvia 1:1.","q":[{"k":"num","p":"A 62 mil board at the 10:1 limit. Smallest standard drill in mil?","v":6.2,"tol":0.05,"u":"mil","w":"62 ÷ 10 = 6.2 mil."},{"k":"match","p":"Match each via to its max aspect ratio.","pairs":[["Standard via","10:1"],["Buried mechanical via","8:1"],["Microvia","1:1"]],"w":"Deep, narrow holes are hard to plate."}]},{"t":"Three key IPC standards","s":["trace",20],"x":"IPC-2221 sets general design rules. IPC-2152 sizes conductors for temperature rise. IPC-6012 sets performance and quality requirements for rigid boards.","q":[{"k":"match","p":"Match each standard to its focus.","pairs":[["IPC-2221","Generic design rules and spacing"],["IPC-2152","Current capacity and temperature rise"],["IPC-6012","Quality and performance of rigid boards"]],"w":"Design, conductor sizing, then acceptance."}]},{"t":"IPC-2152 replaced old charts","s":["trace",22],"x":"The old IPC-2221 current charts came from one board type with fixed copper weight, over 50 years ago. IPC-2152 uses data across copper weights, internal and external traces and environments.","q":[{"k":"tf","p":"For high-current designs, IPC-2152 is preferred over IPC-2221's sizing formulas.","v":true,"w":"IPC-2152's data covers far more real conditions."}]},{"t":"IPC classes","s":["trace",24],"x":"IPC-6012 defines Class 1 (general), Class 2 (commercial) and Class 3 (high reliability).","q":[{"k":"match","p":"Match each class to its meaning.","pairs":[["Class 1","General"],["Class 2","Commercial"],["Class 3","High reliability"]],"w":"Class 3 is for products that must not fail."}]},{"t":"Class 2 vs class 3","s":["trace",25],"x":"Class 2 averages 20 µm hole plating and allows 90° annular ring breakout. Class 3 needs 25 µm, allows no breakout and no plating voids.","q":[{"k":"mc","p":"What average copper plating does class 3 require?","o":["25 µm","20 µm","5 µm","100 µm"],"w":"Class 3: 25 µm average; class 2: 20 µm."}]}]},{"u":"Via types","c":6,"L":[{"t":"What vias do","s":["via",4],"x":"Vias are small plated holes that carry signals or power between layers. Without them, routing would be stuck on one layer.","q":[{"k":"mc","p":"What is a via's main job?","o":["Carry signals or power between layers","Hold components in place","Mark pin 1","Mount the board"],"w":"They are the vertical links in a multilayer board."}]},{"t":"Four kinds of via","s":["via",5],"f":"vias","x":"Through-hole vias go top to bottom. Blind vias join an outer layer to inner layers. Buried vias join inner layers only. Microvias are laser-drilled between adjacent layers.","q":[{"k":"tap","p":"Tap the buried via.","scene":"vias","hit":"buried","w":"A buried via connects inner layers only and never reaches the surface."},{"k":"match","p":"Match each via to its description.","pairs":[["Through-hole","Drilled from top to bottom"],["Blind","Outer layer to inner layers"],["Buried","Inner layers only"],["Microvia","Laser-drilled between adjacent layers"]],"w":"Type depends on which layers you need to join."}]},{"t":"Through-hole trade-off","s":["via",5],"x":"Through-hole vias are cheap and easy to make, but they occupy every layer and leave stubs.","q":[{"k":"mc","p":"What is a drawback of through-hole vias?","o":["They take space on every layer and leave stubs","They are the most expensive","They need laser drilling","They can't carry current"],"w":"The barrel passes through layers it doesn't use."}]},{"t":"Extra lamination cycles","s":["via",6],"x":"Microvias, blind and buried vias each need separate lamination cycles. That adds complexity and affects yield and cost.","q":[{"k":"tf","p":"Blind and buried vias can be made in the same single lamination as a plain through-hole board.","v":false,"w":"They need sequential lamination, which costs more."}]},{"t":"Pick the via for the job","s":["via",6],"x":"Typical picks: microvia or via-in-pad for fine-pitch BGA fanout, through-hole for power to an inner plane, blind or buried for RF routing, and arrays of thermal vias for hot parts.","q":[{"k":"match","p":"Match each scenario to the recommended via.","pairs":[["Fine-pitch BGA fanout","Microvia or via-in-pad"],["Power to an inner plane","Through-hole"],["RF signal routing","Blind or buried via"],["Hot power component","Array of thermal vias"]],"w":"Each choice trades cost against density or performance."}]}]},{"u":"How vias are made","c":6,"L":[{"t":"Drilling methods","s":["via",8],"x":"Mechanical drilling makes 8-32 mil holes for through and buried vias. Laser drilling makes 3-6 mil holes for blind vias and microvias. Plasma etching handles under 4 mil in flex.","q":[{"k":"match","p":"Match each method to its typical hole size.","pairs":[["Mechanical drilling","8-32 mil"],["Laser drilling","3-6 mil"],["Plasma etching","Under 4 mil"]],"w":"Smaller holes need non-mechanical methods."}]},{"t":"Metallizing the hole","s":["via",8],"x":"After drilling, the hole is desmeared to remove resin, seeded with a thin electroless copper layer, then thickened by electrolytic plating.","q":[{"k":"ord","p":"Put the metallization steps in order.","o":["Desmear and condition the hole","Electroless copper seed layer","Electrolytic copper plating"],"w":"Clean, seed, then build up the barrel."}]},{"t":"Electroless seed layer","s":["via",9],"x":"Electroless copper deposits a thin 1-3 µm conductive layer on the bare hole wall, giving electroplating something to build on.","q":[{"k":"mc","p":"How thick is the electroless copper seed layer?","o":["1-3 µm","20-25 µm","1-3 mm","100 µm"],"w":"It is a thin seed; electroplating adds the bulk."}]},{"t":"Throwing power","s":["via",10],"x":"Throwing power compares plating thickness in the middle of the hole to the surface. It is a key quality measure because thin barrels can open under thermal stress.","q":[{"k":"mc","p":"What does throwing power compare?","o":["Plating at the hole centre vs the surface","Drill speed vs feed","Dk vs Df","Pad vs antipad size"],"w":"Deep holes tend to plate thinner in the middle."}]}]},{"u":"Advanced via structures","c":6,"L":[{"t":"What counts as a microvia","s":["via",12],"x":"IPC-T-50M defines a microvia as 0.010 in (254 µm) or smaller with an aspect ratio of 1:1 or lower.","q":[{"k":"mc","p":"By IPC-T-50M, what is the largest diameter a microvia can have?","o":["0.010 in (254 µm)","0.100 in","0.001 in","1 mm"],"w":"254 µm or less, with aspect ratio at most 1:1."}]},{"t":"Stack no more than two","s":["via",14],"x":"Interconnect stress tests show more failures when more than two microvias are stacked. For deeper builds, mix stacked and staggered vias.","q":[{"k":"mc","p":"How many microvias should you stack at most?","o":["Two","Five","Ten","Unlimited"],"w":"More than two stacked raises failure rates."}]},{"t":"Via-in-pad","s":["via",15],"x":"Via-in-pad puts the via inside the component pad, often under BGAs. It saves space, removes dog-bone fanout and lowers inductance, but adds fabrication steps.","q":[{"k":"mc","p":"Which is a benefit of via-in-pad?","o":["No dog-bone fanout needed","Lower fabrication cost","No filling required","Works without capping"],"w":"It frees routing space and shortens paths."}]},{"t":"Type VII for VIP","s":["via",15],"x":"For via-in-pad, use IPC-4761 Type VII: filled and capped with plated copper, giving a flat, solderable pad.","q":[{"k":"mc","p":"Which IPC-4761 via type suits via-in-pad?","o":["Type VII (filled and copper-capped)","An open via","A tented via","An unplated hole"],"w":"Filled and capped vias stay flat and solderable."}]},{"t":"Don't leave VIPs open","s":["via",17],"x":"Unfilled or tented vias in pads let solder wick down the hole, leaving weak or incomplete joints.","q":[{"k":"tf","p":"A tented, unfilled via in a BGA pad is fine for soldering.","v":false,"w":"Solder wicks into it and starves the joint."}]}]},{"u":"Stitching, fencing and heat","c":6,"L":[{"t":"Via stitching","s":["via",19],"x":"Stitching vias tie ground pours and planes together across layers. They lower return-path impedance, equalise ground and help heat move between layers.","q":[{"k":"mc","p":"What does via stitching provide?","o":["Low-impedance return paths between planes","Higher trace impedance","Solder mask openings","Component markings"],"w":"Stitching ties planes into one low-impedance ground."}]},{"t":"Stitching for current","s":["via",20],"x":"A typical via (10 mil drill, 20 mil pad, 1 mil plating) has about 1.5 mΩ DC resistance. The guide's example spreads 20 A over 10 vias to keep each at 2 A.","q":[{"k":"num","p":"Using the guide's 2 A per via, how many vias carry 30 A?","v":15,"tol":0,"u":"vias","w":"30 A ÷ 2 A per via = 15 vias."}]},{"t":"Via fencing","s":["via",22],"x":"A via fence is a row of grounded vias along a critical trace. For RF, keep pitch at or below λ/20 at the highest frequency, about 12 mil at 10 GHz. Elsewhere, 50-100 mil is usually enough.","q":[{"k":"mc","p":"What fence via pitch does the guide give for 10 GHz?","o":["About 12 mil","About 500 mil","About 1 inch","Any pitch works"],"w":"λ/20 at 10 GHz with εr ≈ 4 is roughly 12 mil."}]},{"t":"Stitching vs fencing","s":["via",23],"x":"Stitching spreads arrays 100-500 mil apart to join planes. Fencing places tight rows along critical signals to block EMI.","q":[{"k":"match","p":"Match each technique to its purpose.","pairs":[["Via stitching","Join ground planes and spread current and heat"],["Via fencing","Isolate signals and block EMI"]],"w":"Same vias, different layout and goal."}]},{"t":"Thermal vias","s":["via",25],"x":"A thermal via is a plated hole that pipes heat to inner or bottom copper. One 10 mil via removes roughly 100-200 mW at a 10-20°C rise, so parts over 1 W need several.","q":[{"k":"mc","p":"Roughly how much heat does one 10 mil thermal via remove?","o":["100-200 mW","10-20 W","1-2 mW","5 W"],"w":"That is why power parts use via arrays."},{"k":"num","p":"One 10 mil via is ~180 °C/W. About what is 10 in parallel, in °C/W?","v":18,"tol":0.5,"u":"°C/W","w":"Ten equal paths in parallel: 180 ÷ 10 ≈ 18 °C/W."}]}]},{"u":"Via DFM","c":6,"L":[{"t":"Drill data mistakes","s":["via",30],"x":"Common drill-data errors include Gerber and NC drill mismatches, missing layer spans for blind and buried vias, and mixed or missing units in Excellon files.","q":[{"k":"mc","p":"Which is a common drill-file error?","o":["Mixed or missing units","Using standard drill sizes","Listing layer spans","Including a drill chart"],"w":"The fab can't guess whether 10 means mil or mm."}]},{"t":"Hole tolerances","s":["via",32],"x":"Typical fab recommendations: plated holes ±3 mil, non-plated holes ±2 mil, annular ring at least 4 mil for class 2.","q":[{"k":"match","p":"Match each hole type to its typical tolerance.","pairs":[["Plated (PTH)","±3 mil"],["Non-plated (NPTH)","±2 mil"]],"w":"Plating adds variation to finished size."}]},{"t":"Clearances around vias","s":["via",37],"x":"Keep vias 6-8 mil from traces and 10 mil from SMD pads. Keep drilled holes 10-20 mil from the board outline.","q":[{"k":"mc","p":"Recommended via-to-SMD-pad clearance?","o":["10 mil","1 mil","100 mil","0 mil"],"w":"Too close and solder can migrate into the via."}]},{"t":"Annular ring math","s":["via",42],"x":"Annular ring = (pad diameter − drill diameter) ÷ 2. A 10 mil drill in a 20 mil pad gives a 5 mil ring. Class 2 needs at least 4 mil.","q":[{"k":"num","p":"Drill 12 mil, pad 22 mil. Annular ring in mil?","v":5,"tol":0,"u":"mil","w":"(22 − 12) ÷ 2 = 5 mil."}]},{"t":"Antipads","s":["via",43],"x":"An antipad is the clearance hole in a plane that isolates a via. IPC-4761 suggests drill size + 16 mil; IPC-2221 sets a 10 mil minimum clearance.","q":[{"k":"num","p":"By the IPC-4761 rule, antipad for a 10 mil drill in mil?","v":26,"tol":0,"u":"mil","w":"10 + 16 = 26 mil."}]},{"t":"Via current","s":["via",40],"x":"A 10 mil via with 1 oz plating carries about 1.0-1.5 A; a 12 mil via about 2.0-2.5 A; a 16 mil via about 3-4 A. Use several vias for big currents.","q":[{"k":"mc","p":"About how much current does a 12 mil, 1 oz via carry?","o":["2.0-2.5 A","20-25 A","0.1 A","10 A"],"w":"So 6 A needs at least 3-4 of them."}]}]},{"u":"Vias and signal integrity","c":6,"L":[{"t":"Backdrilling","s":["via",49],"x":"Backdrilling drills out the unused stub below the last connected layer. Consider it for SerDes, USB 3.0+, PCIe, DDR4+, data rates above 3 Gbps, or stubs over 10 mil.","q":[{"k":"mc","p":"When should you consider backdrilling?","o":["Data rates above 3 Gbps","Any LED circuit","Single-sided boards","DC power only"],"w":"Stubs resonate at multi-gigabit rates."}]},{"t":"Etchback","s":["via",50],"x":"Etchback cleans resin smear from the hole before plating. Negative etchback removes more resin than copper; positive etchback removes resin and copper, leaving copper tongues that grip the plating.","q":[{"k":"match","p":"Match each etchback to what it does.","pairs":[["Negative etchback","Removes more resin than copper"],["Positive etchback","Removes resin and copper, leaving copper tongues"]],"w":"Positive etchback is common in military and aerospace boards."}]},{"t":"Vias cause reflections","s":["via",61],"x":"A via usually has lower impedance than the trace. Reflection coefficient Γ = (Zvia − Ztrace) ÷ (Zvia + Ztrace). A 35 Ω via on a 50 Ω trace gives about −0.18.","q":[{"k":"num","p":"A 40 Ω via on a 60 Ω trace. Reflection coefficient Γ?","v":-0.2,"tol":0.005,"u":"","w":"(40 − 60) ÷ (40 + 60) = −20 ÷ 100 = −0.2."}]},{"t":"Stubs resonate","s":["via",63],"x":"A via stub acts like an open-ended line that resonates. On FR-4, a 1.0 mm stub resonates near 3.5 GHz and a 0.2 mm stub near 17 GHz.","q":[{"k":"mc","p":"About where does a 1.0 mm stub resonate on FR-4?","o":["~3.5 GHz","~17 GHz","~35 MHz","~350 GHz"],"w":"Longer stubs resonate lower, right in USB 3.0 and PCIe bands."}]},{"t":"Stub limits by interface","s":["via",64],"x":"Maximum stub guidelines: USB 3.0 ≤0.3 mm, PCIe Gen 3 ≤0.25 mm, 10G Ethernet ≤0.2 mm, DDR4/DDR5 ≤0.3 mm.","q":[{"k":"mc","p":"Maximum via stub for PCIe Gen 3?","o":["≤0.25 mm","≤2.5 mm","≤25 mm","No limit"],"w":"Faster links need shorter stubs."}]},{"t":"Vias in differential pairs","s":["via",55],"x":"For differential pairs, use identical drill, pad and antipad sizes, place the two vias symmetrically, keep stubs equal and short, and add ground vias nearby.","q":[{"k":"mc","p":"Which rule applies to vias in a differential pair?","o":["Use the same drill, pad and antipad sizes","Use different sizes for each leg","Place them far apart","Give one leg a longer stub"],"w":"Any asymmetry converts differential signal to common mode."}]},{"t":"Soldermask on vias","s":["via",56],"x":"Tented vias are fully covered by mask, preventing wicking under BGAs and QFNs. Untented vias stay open for probing. VIPPO vias are filled and plated over for dense BGAs.","q":[{"k":"match","p":"Match each via finish to its use.","pairs":[["Tented","Prevent wicking under BGA/QFN"],["Untented","Test and probe access"],["Filled and capped (VIPPO)","High-density BGAs and RF"]],"w":"Mask choice depends on soldering and test needs."}]}]},{"u":"What DFM means","c":7,"L":[{"t":"Design for manufacturability","s":["dfm",6],"x":"DFM checks whether a design can actually be built, and built without unnecessary cost. It pulls designers, engineers, contract manufacturers and suppliers into one review.","q":[{"k":"mc","p":"What is DFM mainly about?","o":["Making sure the design can be built at sensible cost","Choosing the enclosure colour","Writing firmware","Simulating antennas"],"w":"It catches design choices that make fabrication hard or expensive."}]},{"t":"DFF + DFA = DFM","s":["dfm",10],"x":"DFM has two halves: design for fabrication (DFF, the bare board) and design for assembly (DFA, putting parts on it).","q":[{"k":"match","p":"Match each term to what it covers.","pairs":[["DFF","Fabricating the bare board"],["DFA","Assembling parts onto the board"],["DFM","Both together"]],"w":"DFF and DFA combine into DFM."}]},{"t":"DRC is not DFM","s":["dfm",10],"x":"DRC is a pass/fail check against your rules and the schematic. A thin copper sliver can pass DRC yet peel off and bridge parts in assembly. DFM catches that kind of risk.","q":[{"k":"tf","p":"A design that passes DRC can still have manufacturing problems.","v":true,"w":"DRC only checks the rules it is given; DFM looks for process risks."},{"k":"mc","p":"A DRC short shows up on how many boards in a lot?","o":["Every board","Only some boards","None","Only the first board"],"w":"DRC defects repeat on every copy; DFM issues may hit only some."}]},{"t":"Files the fab needs","s":["dfm",12],"x":"A fab package includes Gerbers for each layer, an NC drill file, an IPC-356 netlist, a pick-and-place file, assembly and fab PDFs, and optionally ODB++. Sierra accepts RS-274X Gerber, ODB++ and IPC-2581.","q":[{"k":"mc","p":"Which file is part of the fabrication package?","o":["NC drill file","Firmware hex file","Enclosure CAD only","Marketing brochure"],"w":"The fab can't drill without it."}]},{"t":"Why send a netlist","s":["dfm",13],"x":"An IPC-356 netlist lets the fab compare your intended connections with what the Gerbers actually show. Netlist errors almost always produce dead boards, so catch them early. Gerber 274X does not include a netlist; ODB++ and IPC-2581 do.","q":[{"k":"mc","p":"Which format does NOT include a netlist?","o":["Gerber RS-274X","ODB++","IPC-2581","All of them include one"],"w":"That's why you send IPC-356 alongside Gerbers."}]}]},{"u":"Drilling and holes","c":7,"L":[{"t":"Drilling is costly","s":["dfm",15],"x":"Drilling happens after lamination and is the most expensive, irreversible and slow step. Mechanical drilling runs at about 5,000 holes per hour, so more holes cost more.","q":[{"k":"mc","p":"About how many holes per hour can mechanical drilling do?","o":["5,000","50","500,000","5"],"w":"Hole count drives drilling time and cost."}]},{"t":"Smallest holes","s":["dfm",16],"x":"Mechanical drills reach about 6 mil and need bigger annular rings because of drill wander. Laser drills reach about 4 mil and go one layer at a time.","q":[{"k":"match","p":"Match each method to its smallest hole.","pairs":[["Mechanical drill","About 6 mil"],["Laser drill","About 4 mil"]],"w":"Lasers drill smaller, layer to layer."}]},{"t":"Ideal aspect ratios","s":["dfm",18],"x":"For through-holes, aspect ratio is board thickness ÷ hole diameter. For microvias it is drill depth ÷ diameter. Targets: 10:1 for through-holes, 0.75:1 for microvias.","q":[{"k":"num","p":"A microvia is 4 mil wide. Maximum dielectric depth at 0.75:1, in mil?","v":3,"tol":0,"u":"mil","w":"0.75 × 4 = 3 mil, matching the guide's table."}]},{"t":"Drill-to-copper","s":["dfm",20],"x":"Drill-to-copper is the gap from a hole edge to the nearest copper. Any fab should hold 8 mil. Layout tools usually have no direct DRC for it.","q":[{"k":"mc","p":"What drill-to-copper clearance should any fab achieve?","o":["8 mil","0.8 mil","80 mil","Zero"],"w":"8 mil is the safe common baseline."}]},{"t":"PTH vs NPTH","s":["dfm",22],"x":"Plated holes (PTH) carry signals between layers. Non-plated holes (NPTH) are non-conductive, used for mounting and locating. Leave a note so the fab knows they're intentional.","q":[{"k":"match","p":"Match each hole type to its use.","pairs":[["PTH","Carries signals between layers"],["NPTH","Mounting and holding parts"]],"w":"Mark NPTHs clearly in your drill data."}]},{"t":"What really drives cost","s":["dfm",23],"x":"At Sierra, the number of drill sizes doesn't affect cost. Via structures that start and stop on different layers do, because they add laminations and registration risk.","q":[{"k":"mc","p":"Per this guide, what raises board cost more?","o":["Via structures spanning different layer pairs","Using several drill sizes","Using round pads","Using green mask"],"w":"Each new layer pair can mean another lamination."}]},{"t":"Resin smear","s":["dfm",25],"x":"Drilling heat melts resin onto the hole wall. That smear blocks plating from bonding to inner copper, so fabs remove it chemically (desmear) and also deburr.","q":[{"k":"mc","p":"How is resin smear removed?","o":["A chemical desmear process","Extra silkscreen","Wave soldering","It is left in place"],"w":"Desmear exposes clean copper for plating."}]},{"t":"Backdrill sizing","s":["dfm",36],"x":"A backdrill bit is usually 8 mil larger than the original drill, with 3 mil tolerance. Keep traces and planes at least 10 mil from the backdrill.","q":[{"k":"num","p":"Primary drill 10 mil. Typical backdrill diameter in mil?","v":18,"tol":0,"u":"mil","w":"10 + 8 = 18 mil."}]}]},{"u":"Rings, mask and silkscreen","c":7,"L":[{"t":"Tangency and breakout","s":["dfm",43],"x":"If the drill lands off-centre, the ring can shrink to zero where the hole touches the pad edge (tangency) or the hole can exit the pad entirely (breakout).","q":[{"k":"match","p":"Match each defect to its description.","pairs":[["Tangency","Hole edge just touches the pad edge"],["Breakout","Hole runs outside the pad"]],"w":"Wider rings tolerate drill wander."}]},{"t":"Teardrops","s":["dfm",44],"x":"Teardrops widen the pad toward the trace like a comet, giving the drill more copper to land in. They are mandatory on IPC Class 3 medical and military boards.","q":[{"k":"tf","p":"Teardrops are required on IPC Class 3 boards.","v":true,"w":"They reduce breakout and copper tearing."}]},{"t":"Mask expansion","s":["dfm",63],"x":"Solder mask expansion can be positive (gap around the pad), zero (mask meets pad edge) or negative (mask overlaps the pad).","q":[{"k":"match","p":"Match each expansion to what it means.","pairs":[["Positive","A gap between pad and mask"],["Zero","Mask starts exactly at the pad edge"],["Negative","Mask covers part of the pad"]],"w":"Real boards need some tolerance because layers never align perfectly."}]},{"t":"Solder mask dam","s":["dfm",68],"x":"The mask strip between two pad openings is the solder mask dam. Keep it at least 2 mil, or the fab can't keep solder from bridging.","q":[{"k":"mc","p":"Absolute minimum solder mask dam?","o":["2 mil","0.2 mil","20 mil","No minimum"],"w":"Below 2 mil the dam may not survive."}]},{"t":"Slivers","s":["dfm",68],"x":"Slivers are narrow wedges of copper or mask. Copper slivers can break off and create unintended connections. A DFM review catches them.","q":[{"k":"mc","p":"Why are copper slivers dangerous?","o":["They can break off and short things","They improve impedance","They lower cost","They are required by IPC"],"w":"Loose copper becomes a stray conductor."}]},{"t":"Acid traps","s":["dfm",87],"x":"Acute angles in copper trap etchant, which over-etches the trace there and can cause opens.","q":[{"k":"tap","p":"Tap the acid trap.","scene":"acidtrap","hit":"acute","w":"The acute inside corner holds etchant and over-etches."}]},{"t":"Silkscreen rules","s":["dfm",70],"x":"Keep reference designators next to parts, not under them. Don't print over vias. Put polarity marks beside the designator.","q":[{"k":"mc","p":"Where should reference designators go?","o":["Next to the component","Under the component","Over via holes","On the pads"],"w":"Under the part they vanish after assembly."}]},{"t":"Readable silkscreen","s":["dfm",72],"x":"Sierra prints silkscreen lines down to 4 mil and recommends at least 25 mil text height for readability.","q":[{"k":"mc","p":"Recommended minimum silkscreen text height?","o":["25 mil","2.5 mil","250 mil","1 mil"],"w":"Smaller text blurs into blobs."}]}]},{"u":"Manufacturing tolerances","c":7,"L":[{"t":"Standard board thicknesses","s":["dfm",73],"x":"Industry standard thicknesses are 31, 62, 93 and 125 mil. Boards 31 mil and up are held to ±10%.","q":[{"k":"num","p":"A 62 mil board at ±10%. Thickest acceptable, in mil?","v":68.2,"tol":0.05,"u":"mil","w":"62 × 1.10 = 68.2 mil."}]},{"t":"Layer registration","s":["dfm",84],"x":"Layers shift slightly during pressing and curing. Up to 50 µm layer-to-layer misregistration is acceptable.","q":[{"k":"mc","p":"Acceptable layer-to-layer registration tolerance?","o":["50 µm","5 mm","0.5 µm","500 µm"],"w":"Design rings and clearances with this shift in mind."}]},{"t":"Impedance tolerance","s":["dfm",84],"x":"Standard controlled impedance tolerance is ±10%. Sierra's advanced and micro processes hold ±5%.","q":[{"k":"num","p":"A 50 Ω trace at ±10%. Lowest acceptable impedance in Ω?","v":45,"tol":0,"u":"Ω","w":"50 − 5 = 45 Ω."}]},{"t":"Bow and twist","s":["dfm",86],"x":"Per IPC 2422, maximum bow and twist is 0.75% for boards with SMD parts and 1.5% without.","q":[{"k":"mc","p":"Maximum bow and twist for a board with SMD parts?","o":["0.75%","1.5%","7.5%","0%"],"w":"Flat boards matter for placing and soldering SMDs."}]}]},{"u":"Design for assembly","c":7,"L":[{"t":"What DFA does","s":["dfa",5],"x":"DFA cuts assembly cost by simplifying the design: fewer parts, easier placement. Early DFA checks the BOM for obsolete parts and that part numbers match footprints.","q":[{"k":"mc","p":"Which is an early DFA check?","o":["BOM part numbers match the footprints","Mask colour is green","Board is square","Silkscreen font is bold"],"w":"A footprint mismatch makes a part impossible to place."}]},{"t":"Vibration means through-hole","s":["dfa",8],"x":"Boards that see heavy vibration benefit from through-hole parts, which anchor more securely than SMDs.","q":[{"k":"tf","p":"Through-hole parts hold up better than SMDs on boards with heavy vibration.","v":true,"w":"Leads through the board resist mechanical stress."}]},{"t":"Fewer parts, fewer errors","s":["dfa",9],"x":"Fewer components means fewer assembly steps and fewer chances for assembly errors.","q":[{"k":"mc","p":"What happens when you remove components from a design?","o":["Assembly steps and errors drop","Assembly cost rises","Board must get thicker","Nothing changes"],"w":"Every part is a placement and a solder joint."}]},{"t":"One reflow pass","s":["dfa",10],"x":"Put SMT parts on one side so the board needs a single reflow pass, then add through-hole parts by wave or hand soldering. Flipping boards adds time.","q":[{"k":"mc","p":"Why keep all SMT parts on one side?","o":["So one reflow pass solders them all","To make the board heavier","Because IPC requires it","To avoid fiducials"],"w":"Repositioning a board for a second side costs assembly time."}]},{"t":"Flying probe vs bed of nails","s":["dfa",13],"x":"A bed-of-nails tester needs a custom fixture of pogo pins. A flying probe moves probes under software control with no fixture, which is cheaper for prototypes and small runs.","q":[{"k":"match","p":"Match each test method to its trait.","pairs":[["Bed of nails","Custom fixture of pogo pins"],["Flying probe","Fixtureless, moves probes by software"]],"w":"Flying probe suits low volumes; fixtures pay off at high volume."}]},{"t":"Poka-yoke","s":["dfa",15],"x":"Poka-yoke is mistake-proofing. A control system makes the error impossible, like offset tooling holes that stop a panel going in backwards; a warning system only alerts.","q":[{"k":"mc","p":"Which is a control-type poka-yoke?","o":["Offset tooling that only fits one way","A warning buzzer","A checklist","A sticky note"],"w":"Control systems make the mistake physically impossible."}]},{"t":"Do not include","s":["dfa",19],"x":"DNI (do not include) parts are left off during assembly and not purchased by the assembler. They're useful for optional parts or prototype experiments.","q":[{"k":"tf","p":"The assembler buys and places DNI parts.","v":false,"w":"DNI parts are neither procured nor placed."}]},{"t":"Gerber vs ODB++","s":["dfa",23],"x":"Gerber RS-274X describes each layer's artwork. It can't define the stack-up and doesn't include drill files. ODB++ bundles layers, drill data, stack-up, placement and BOM in one package.","q":[{"k":"mc","p":"What can ODB++ carry that Gerber cannot?","o":["Layer stack-up and drill data","Copper artwork","Pad shapes","Board outline"],"w":"ODB++ is an intelligent all-in-one format."}]},{"t":"Silkscreen sizes","s":["dfa",24],"x":"Best silkscreen uses 0.050 in text, never below 0.025 in, with line width at least 0.005 in and 0.005 in clearance from pads. Rotate designators only in 90° steps.","q":[{"k":"mc","p":"Minimum silkscreen font size?","o":["0.025 in","0.005 in","0.25 in","0.0025 in"],"w":"0.050 in is best; 0.025 in is the floor."}]}]},{"u":"Placement for assembly","c":7,"L":[{"t":"Keep BGAs off-centre","s":["dfa",27],"x":"Bow and twist peak at the centre of a board, which can crack joints. Keep sensitive packages like BGAs away from the middle, and on one side only if you can.","q":[{"k":"mc","p":"Why avoid putting a BGA in the board's centre?","o":["Bow and twist are worst there","It's too cold there","Fiducials can't see it","It blocks the silkscreen"],"w":"Flexing is greatest mid-board."}]},{"t":"Don't stack BGAs","s":["dfa",27],"x":"If BGAs must go on both sides, don't place them at the same XY position top and bottom. Stacked BGAs complicate X-ray inspection and rework.","q":[{"k":"tf","p":"Placing two BGAs directly back-to-back is recommended.","v":false,"w":"X-ray can't separate the two ball patterns easily."}]},{"t":"Courtyard clearances","s":["dfa",30],"x":"Default courtyard clearance is 0.25 mm. BGAs need 1.0 mm, parts smaller than 0603 need 0.15 mm, and connectors, crystals and canned caps need 0.5 mm.","q":[{"k":"match","p":"Match each part to its clearance.","pairs":[["Default","0.25 mm"],["BGA","1.0 mm"],["Smaller than 0603","0.15 mm"],["Connectors, crystals","0.5 mm"]],"w":"Bigger or rework-heavy parts need more room."}]},{"t":"Plan for shortages","s":["dfa",33],"x":"Check part availability more than once, list alternates in the BOM, stay flexible on values where you can, and answer fab queries quickly.","q":[{"k":"mc","p":"Which helps avoid component shortage delays?","o":["Listing alternate part numbers in the BOM","Choosing obsolete parts","Ignoring fab queries","Locking every value exactly"],"w":"Pre-approved alternates avoid substitution delays."}]},{"t":"Sizing thermal spokes","s":["dfa",35],"x":"Match thermal relief spokes to the pin's current. If the pin needs a 40 mil trace, the spokes should add up to 40 mil, such as four 10 mil spokes.","q":[{"k":"num","p":"A pin needs a 60 mil trace. With 4 spokes, how wide is each spoke in mil?","v":15,"tol":0,"u":"mil","w":"60 ÷ 4 = 15 mil per spoke."}]},{"t":"IPC-A-610 classes","s":["dfa",38],"x":"IPC-A-610 judges assembly acceptability in three classes: Class 1 low-end products like toys, Class 2 higher reliability non-critical, Class 3 critical military and space.","q":[{"k":"mc","p":"Which IPC-A-610 class covers military and space assemblies?","o":["Class 3","Class 1","Class 2","Class 0"],"w":"Class 3 is the strictest."}]},{"t":"Three common defects","s":["dfa",44],"x":"Common assembly defects: opens (no bond between lead and pad), solder bridges (solder joins leads that should be separate), and component shift (parts drift on molten solder).","q":[{"k":"match","p":"Match each defect to its description.","pairs":[["Open","No bond between lead and pad"],["Solder bridge","Solder joins separate leads"],["Component shift","Part drifts off its location"]],"w":"Each has its own design and process fixes."}]},{"t":"Edge clearances","s":["dfa",50],"x":"Keep larger components 125 mil from the board edge, smaller ones 25 mil, and manually installed ones 10 mil, to survive depanelization.","q":[{"k":"mc","p":"Recommended edge clearance for larger components?","o":["125 mil","10 mil","1 mil","500 mil"],"w":"Depanelization stresses joints near edges."}]},{"t":"Fiducials for alignment","s":["dfa",51],"x":"Fiducials are bare, round copper marks 1-3 mm across, 3 mm from the edge. Use three global fiducials on the board and two local ones diagonally around quad-packaged parts.","q":[{"k":"mc","p":"How many global fiducials does the guide recommend?","o":["Three","One","Ten","None"],"w":"Three points fix position and orientation."}]},{"t":"Rush jobs cost more","s":["dfa",53],"x":"Shorter assembly turnaround raises cost by 30-200% compared to standard lead times.","q":[{"k":"mc","p":"How much can expedited assembly add to cost?","o":["30-200%","1-2%","Nothing","1000%"],"w":"The fab may have to pause other work."}]},{"t":"Package affects cost","s":["dfa",54],"x":"BGAs and QFNs cost more to assemble because their hidden joints need precise placement and X-ray inspection. SMT overall is cheaper than through-hole.","q":[{"k":"mc","p":"Why do BGAs cost more to assemble?","o":["Hidden joints need precise placement and X-ray","They are heavier","They use more silkscreen","They need hand soldering"],"w":"You can't see BGA joints without X-ray."}]}]},{"u":"What signal integrity is","c":8,"L":[{"t":"Signal integrity","s":["si",5],"x":"Signal integrity is a signal's ability to travel without distortion. Digital signals are really analog waveforms, so noise, distortion and loss all apply.","q":[{"k":"mc","p":"What does signal integrity describe?","o":["How well a signal travels without distortion","How much power a board uses","The colour of the solder mask","How many layers a board has"],"w":"Good SI means the waveform arrives the way it left."}]},{"t":"When integrity is lost","s":["si",6],"x":"A signal loses integrity when its shape distorts, when noise rides on it and degrades signal-to-noise ratio, or when it creates noise for other circuits.","q":[{"k":"mc","p":"Which is a sign of lost signal integrity?","o":["The waveform shape is distorted","The trace is wide","The board is green","The via is plated"],"w":"Distortion, added noise, or causing noise elsewhere."}]},{"t":"Rise time is the culprit","s":["si",7],"x":"Fast rise times are the main cause of SI problems. At moderate speeds layout rarely matters; with very short rise times it matters a lot.","q":[{"k":"tf","p":"Slower rise times generally reduce signal integrity problems.","v":true,"w":"Bogatin's first guideline is to use the longest rise time you can."}]},{"t":"Characteristic impedance","s":["si",7],"x":"At high frequency, a trace's characteristic impedance is √(L/C). Anything that changes the trace's inductance-to-capacitance ratio creates a discontinuity.","q":[{"k":"mc","p":"Characteristic impedance is approximately…","o":["√(L/C)","L × C","R + L","C / L"],"w":"Resistance and conductance are negligible at high frequency."}]},{"t":"What breaks impedance","s":["si",8],"x":"Impedance discontinuities come from source/load mismatch, changes in trace geometry or material, branches and stubs, splits in the return path, and vias.","q":[{"k":"mc","p":"Which creates an impedance discontinuity?","o":["A split in the return plane under the trace","A uniform 50 Ω trace","A solid ground plane","Matched termination"],"w":"The return current is forced to detour around the split."}]},{"t":"Daisy chain, not branches","s":["si",9],"x":"When one signal feeds several chips, route it as a daisy chain instead of branching stubs, or add a matched buffer.","q":[{"k":"mc","p":"How should a signal feeding several chips be routed?","o":["Daisy chain from chip to chip","Many branching stubs","A star with long arms","Any way, it doesn't matter"],"w":"Branches add stubs that reflect."}]},{"t":"Overshoot and undershoot","s":["si",11],"x":"The reflection coefficient runs from −1 to +1. If the new impedance is higher, a positive reflection causes overshoot; if lower, a negative reflection causes undershoot.","q":[{"k":"mc","p":"A signal hits a section with higher impedance. What happens?","o":["Positive reflection and overshoot","Negative reflection and undershoot","No reflection","The signal stops"],"w":"Higher impedance ahead reflects a positive wave."}]}]},{"u":"Crosstalk and reflections","c":8,"L":[{"t":"Two ways to couple","s":["si",15],"x":"Crosstalk couples through electric fields (mutual capacitance) and magnetic fields (mutual inductance) between neighbouring traces.","q":[{"k":"match","p":"Match each field to the coupling it causes.","pairs":[["Electric field","Mutual capacitance"],["Magnetic field","Mutual inductance"]],"w":"Both add up to crosstalk."}]},{"t":"The 3W rule","s":["si",16],"x":"Spacing traces 3W apart (three trace widths) cuts crosstalk about 70%; 10W cuts it about 98%. Field energy falls with the square of distance.","q":[{"k":"mc","p":"About how much does the 3W rule reduce crosstalk?","o":["70%","7%","98%","100%"],"w":"3W ≈ 70%; 10W ≈ 98%."},{"k":"num","p":"Traces are 6 mil wide. Centre spacing for the 3W rule, in mil?","v":18,"tol":0,"u":"mil","w":"3 × 6 = 18 mil."}]},{"t":"Forward and backward crosstalk","s":["si",18],"x":"Forward crosstalk travels with the aggressor (capacitive minus inductive coupling). Backward crosstalk travels opposite (capacitive plus inductive). NEXT is at the driver end, FEXT at the receiver end.","q":[{"k":"match","p":"Match each term to its meaning.","pairs":[["Forward crosstalk","Travels with the aggressor"],["Backward crosstalk","Travels against the aggressor"],["NEXT","Noise at the driver end of the victim"],["FEXT","Noise at the receiver end of the victim"]],"w":"Direction and measurement point name the types."}]},{"t":"Fiber weave effect","s":["si",25],"x":"Glass has higher Dk than resin. A trace over glass bundles travels at a different speed than one over resin, causing skew. Tighter weaves or zig-zag routing help.","q":[{"k":"mc","p":"What causes the fiber weave effect?","o":["Glass and resin have different Dk","Copper roughness","Solder mask colour","Drill wander"],"w":"Uneven Dk under a trace changes its speed."}]},{"t":"Stubs null odd harmonics","s":["si",23],"x":"A via stub resonates when its length equals a quarter wavelength. It notches the signal at that frequency and at its odd multiples: 3×, 5× and so on.","q":[{"k":"mc","p":"If a stub resonates at 4 GHz, where is the next null?","o":["12 GHz","8 GHz","6 GHz","2 GHz"],"w":"Nulls fall at odd multiples: 3 × 4 = 12 GHz."}]},{"t":"Ground bounce","s":["si",29],"x":"When outputs switch, current through package lead inductance creates V = L·di/dt. That lifts the chip's internal ground above board ground: ground bounce.","q":[{"k":"mc","p":"What equation drives ground bounce?","o":["V = L·di/dt","V = I·R only","P = V·I","f = 1/T"],"w":"Fast current changes through inductance make voltage."},{"k":"tf","p":"Sharing ground vias between several parts helps reduce ground bounce.","v":false,"w":"The guide says never share ground vias; give each its own."}]},{"t":"Termination schemes","s":["si",41],"x":"Parallel termination puts a resistor equal to Z0 at the load. Series termination puts the resistor at the source. Differential termination puts about 100 Ω across the pair at the receiver.","q":[{"k":"match","p":"Match each termination to where the resistor goes.","pairs":[["Parallel","At the load"],["Series","At the source"],["Differential","Across the pair at the receiver"]],"w":"Series termination absorbs the reflection when it returns to the driver."}]},{"t":"Series for point-to-point","s":["bogatin",831],"x":"Bogatin: use series termination for point-to-point links and terminate both ends of a multidrop bus. Keep terminators close to the package pads.","q":[{"k":"mc","p":"Which termination suits a point-to-point link?","o":["Series termination","No termination ever","Terminate only the middle","Parallel at every via"],"w":"One resistor at the driver handles both directions."}]}]},{"u":"Measuring SI","c":8,"L":[{"t":"Eye diagrams","s":["si",44],"x":"An eye diagram overlays many bits. A wide-open eye means little distortion; loss, jitter and reflections close it.","q":[{"k":"tf","p":"A more closed eye diagram means a cleaner signal.","v":false,"w":"Open eye = good; closing eye = distortion."}]},{"t":"TDR","s":["si",44],"x":"A TDR sends a pulse down a line and reads reflections over time to find characteristic impedance and discontinuities. Fabs test TDR coupons built on the same panel.","q":[{"k":"mc","p":"What does a TDR measure?","o":["Impedance along a line from reflections","Board thickness","Copper purity","Solder paste volume"],"w":"Reflections in time map to impedance along the line."}]},{"t":"S11 and S21","s":["si",47],"x":"S-parameters describe a network by frequency. S11 is reflection at port 1 (related to return loss). S21 is transmission from port 1 to port 2 (related to insertion loss).","q":[{"k":"match","p":"Match each S-parameter to what it shows.","pairs":[["S11","Reflection, return loss"],["S21","Transmission, insertion loss"]],"w":"A VNA measures them."}]},{"t":"FR-4's speed limit","s":["si",36],"x":"FR-4 works well below about 2.5-3 GHz. Above that, laminates like Rogers RO4350B keep Dk steadier and lose less.","q":[{"k":"mc","p":"Below roughly what frequency is FR-4 a good choice, per the SI eBook?","o":["2.5-3 GHz","25-30 GHz","250 MHz","100 GHz"],"w":"Higher frequencies favour low-loss laminates."}]}]},{"u":"Bogatin's rules of thumb","c":8,"L":[{"t":"Use slow edges","s":["bogatin",830],"x":"Bogatin's guideline zero: always use the longest rise time you can. Slower edges mean less reflection, crosstalk and EMI.","q":[{"k":"mc","p":"Bogatin's very first design guideline is to…","o":["Use the longest rise time you can","Use the shortest rise time possible","Avoid ground planes","Always use 90° corners"],"w":"Everything gets easier with slower edges."}]},{"t":"Rise time from clock","s":["bogatin",839],"x":"Rule of thumb: rise time is about 10% of the clock period. A 100 MHz clock has about a 1 ns rise time.","q":[{"k":"num","p":"Estimate the rise time of a 200 MHz clock, in ns.","v":0.5,"tol":0.01,"u":"ns","w":"Period 5 ns × 10% = 0.5 ns."}]},{"t":"Bandwidth from rise time","s":["bogatin",839],"x":"Bandwidth ≈ 0.35 ÷ rise time. A 1 ns rise time has about 350 MHz of bandwidth.","q":[{"k":"num","p":"A signal has a 0.5 ns rise time. Bandwidth in MHz?","v":700,"tol":1,"u":"MHz","w":"0.35 ÷ 0.5 ns = 0.7 GHz = 700 MHz."}]},{"t":"Bandwidth from clock","s":["bogatin",839],"x":"If you don't know the rise time, estimate bandwidth as about five times the clock frequency.","q":[{"k":"num","p":"A 400 MHz clock. Estimated bandwidth in GHz?","v":2,"tol":0.01,"u":"GHz","w":"5 × 400 MHz = 2 GHz."}]},{"t":"Sheet resistance","s":["bogatin",839],"x":"1 oz copper is about 0.5 mΩ per square. Count squares as length ÷ width: a 5 mil × 1 inch trace is 200 squares, or 0.1 Ω.","q":[{"k":"num","p":"A 1 oz trace is 10 mil wide and 2 inches long. Resistance in mΩ?","v":100,"tol":0.5,"u":"mΩ","w":"2000 ÷ 10 = 200 squares × 0.5 mΩ = 100 mΩ."}]},{"t":"Signal speed","s":["bogatin",841],"x":"Signals travel about 12 in/ns in air and about 6 in/ns in most laminates, a delay of about 170 ps per inch.","q":[{"k":"num","p":"About how long, in ns, does a signal take to cross 9 inches of laminate?","v":1.5,"tol":0.05,"u":"ns","w":"9 in ÷ 6 in/ns = 1.5 ns."}]},{"t":"Spatial extent of an edge","s":["bogatin",841],"x":"An edge's physical length on the board = rise time × 6 in/ns. A 0.5 ns edge spans about 3 inches.","q":[{"k":"num","p":"A 0.2 ns rise time. Spatial extent in inches?","v":1.2,"tol":0.01,"u":"in","w":"0.2 ns × 6 in/ns = 1.2 in."}]},{"t":"Inside a 50 Ω line","s":["bogatin",842],"x":"Every 50 Ω line in FR-4 has about 3.3 pF/inch and 8.3 nH/inch. A 0.5 inch 50 Ω lead carries about 1.7 pF.","q":[{"k":"mc","p":"Capacitance per inch of any 50 Ω line in FR-4?","o":["About 3.3 pF","About 33 pF","About 0.33 pF","About 3.3 nF"],"w":"And about 8.3 nH per inch."}]},{"t":"50 Ω geometry shortcuts","s":["bogatin",842],"x":"A 50 Ω microstrip in FR-4 has dielectric thickness about half its line width. A 50 Ω stripline has plane-to-plane spacing about twice its line width.","q":[{"k":"num","p":"A 50 Ω microstrip in FR-4 is 8 mil wide. Approximate dielectric thickness in mil?","v":4,"tol":0,"u":"mil","w":"About half the width: 4 mil."}]},{"t":"Wide return paths","s":["bogatin",842],"x":"If the return plane under a 50 Ω microstrip is at least 3× the trace width, impedance is within 1% of an infinite plane. If it's only as wide as the trace, impedance rises about 20%.","q":[{"k":"mc","p":"How wide should the return path under a trace be?","o":["At least 3× the trace width","Exactly the trace width","Half the trace width","It doesn't matter"],"w":"3× keeps impedance within 1%."}]},{"t":"When to terminate","s":["bogatin",843],"x":"If a line's time delay is under 20% of the signal rise time, you may not need termination.","q":[{"k":"num","p":"Rise time 1 ns. Longest line delay (ns) that may skip termination?","v":0.2,"tol":0.005,"u":"ns","w":"20% × 1 ns = 0.2 ns, about 1.2 inches."}]},{"t":"Small changes, small reflections","s":["bogatin",843],"x":"In a 50 Ω system, a 5 Ω change gives about a 5% reflection.","q":[{"k":"mc","p":"A 50 Ω trace meets a 55 Ω section. About how big is the reflection?","o":["5%","50%","0.5%","100%"],"w":"(55 − 50) ÷ 105 ≈ 4.8%, about 5%."}]},{"t":"Keep discontinuities short","s":["bogatin",843],"x":"Keep any discontinuity, like a neck-down through a via field, shorter in inches than the rise time in ns.","q":[{"k":"num","p":"Rise time 0.3 ns. Longest neck-down by this rule, in inches?","v":0.3,"tol":0.005,"u":"in","w":"Inches < ns: 0.3 inch."}]},{"t":"Corners don't matter much","s":["bogatin",831],"x":"A 90° corner adds only a few femtofarads. Bogatin says not to worry about corners unless 10 fF matters to your design.","q":[{"k":"tf","p":"For most boards, a 90° corner is a major signal integrity problem.","v":false,"w":"Corner capacitance is tiny; it matters only at extreme edge rates."}]},{"t":"Decibels","s":["bogatin",844],"x":"−3 dB means 50% power and 70% amplitude. −20 dB means 1% power and 10% amplitude.","q":[{"k":"match","p":"Match each attenuation to the amplitude left.","pairs":[["−3 dB","About 70% amplitude"],["−20 dB","10% amplitude"]],"w":"Power falls faster than amplitude."}]},{"t":"FR-4 dielectric loss","s":["bogatin",844],"x":"FR-4's dissipation factor is about 0.02. Its dielectric loss is about 0.1 dB/inch at 1 GHz and grows linearly with frequency.","q":[{"k":"num","p":"About how much dielectric loss (dB) does 10 inches of FR-4 add at 1 GHz?","v":1,"tol":0.01,"u":"dB","w":"0.1 dB/in × 10 in = 1 dB."}]},{"t":"Crosstalk by spacing","s":["bogatin",845],"x":"Near-end crosstalk on 50 Ω microstrip: about 5% at spacing = 1× width, 2% at 2×, 1% at 3×.","q":[{"k":"match","p":"Match microstrip spacing to near-end crosstalk.","pairs":[["Spacing = 1× width","5%"],["Spacing = 2× width","2%"],["Spacing = 3× width","1%"]],"w":"A little extra spacing goes a long way."}]},{"t":"Stripline has no far-end noise","s":["bogatin",846],"x":"Far-end crosstalk cancels in stripline and fully embedded microstrip, because the dielectric surrounds the traces uniformly.","q":[{"k":"tf","p":"Stripline traces have no far-end crosstalk.","v":true,"w":"Capacitive and inductive far-end terms cancel."}]},{"t":"Bus spacing rule","s":["bogatin",846],"x":"In a 50 Ω bus, spacing lines more than twice the line width keeps worst-case near-end noise below 5%.","q":[{"k":"mc","p":"To keep bus near-end noise below 5%, space lines…","o":["More than 2× the line width","Exactly 1× the line width","Half the line width","Touching"],"w":"Beyond 2×, only the nearest neighbours matter."}]}]},{"u":"Transmission line types","c":9,"L":[{"t":"Controlled impedance","s":["zc",7],"x":"Controlled impedance is the characteristic impedance of a trace and its reference planes. It matters for high-speed signals, roughly above 100 MHz, and is set by trace dimensions and dielectric properties.","q":[{"k":"mc","p":"Above roughly what frequency does controlled impedance become crucial, per the guide?","o":["100 MHz","1 kHz","10 Hz","100 GHz only"],"w":"High-speed signals need uniform impedance."}]},{"t":"Microstrip, stripline, coplanar","s":["zc",10],"f":"tlines","x":"Microstrip is an outer-layer trace over one plane. Stripline is an inner trace between two planes. Coplanar puts ground copper beside the trace on the same layer.","q":[{"k":"tap","p":"Tap the stripline trace.","scene":"tlines","hit":"stripline","w":"Stripline sits between two reference planes."},{"k":"match","p":"Match each structure to its description.","pairs":[["Microstrip","Outer-layer trace over one plane"],["Stripline","Inner trace between two planes"],["Coplanar","Ground copper beside the trace on the same layer"]],"w":"Each gives a different impedance and shielding."}]},{"t":"Stripline keeps fields in","s":["zc",11],"x":"In stripline, the return current flows in planes above and below the trace, so the signal stays inside the board: fewer emissions and better shielding.","q":[{"k":"tf","p":"Stripline traces radiate less than microstrip because the fields stay inside the board.","v":true,"w":"Planes on both sides contain the fields."}]},{"t":"Broadside coupling","s":["zc",14],"x":"A broadside-coupled pair stacks one trace directly above the other, separated by laminate, between two planes. Keeping them aligned is hard to fabricate.","q":[{"k":"mc","p":"What is the main challenge with broadside-coupled pairs?","o":["Hard to fabricate with traces aligned","They can't carry signals","They need no planes","They only work on single-sided boards"],"w":"Layer-to-layer registration shifts the traces."}]},{"t":"Fabs adjust your widths","s":["zc",16],"x":"On controlled impedance traces, the fab cares about the final impedance more than the drawn width. They may tweak width, height or dielectric to hit the target.","q":[{"k":"tf","p":"A fab may change your controlled-impedance trace width to meet the target impedance.","v":true,"w":"They work from pressed-out thicknesses, not datasheet values."}]}]},{"u":"Differential impedance","c":9,"L":[{"t":"Zdiff vs Zse","s":["zc",16],"x":"For a coupled pair, differential impedance is always less than twice the single-ended impedance. Prioritise hitting the differential target.","q":[{"k":"mc","p":"For a coupled pair, how does Zdiff compare to 2 × Zse?","o":["Zdiff is smaller","Zdiff is larger","They are always equal","Zdiff is zero"],"w":"Coupling between the traces pulls Zdiff below 2 × Zse."}]},{"t":"No coupling, double","s":["bogatin",847],"x":"With no coupling between the traces, differential impedance is exactly twice either line's single-ended impedance.","q":[{"k":"num","p":"Two uncoupled 45 Ω lines form a pair. Differential impedance in Ω?","v":90,"tol":0,"u":"Ω","w":"2 × 45 = 90 Ω."}]},{"t":"Modelling heights","s":["zc",21],"x":"When modelling impedance yourself, start with a 4 mil dielectric height for inner layers and 3 mil for outer layers.","q":[{"k":"mc","p":"Suggested starting dielectric height for inner layers?","o":["4 mil","40 mil","0.4 mil","62 mil"],"w":"3 mil for outer layers, 4 mil for inner."}]},{"t":"Pair spacing rule","s":["zc",25],"x":"Keep the gap inside a differential pair no more than twice the trace width. Also keep trace width no more than twice the dielectric thickness to the nearest reference.","q":[{"k":"num","p":"Pair traces are 5 mil wide. Maximum gap by this rule, in mil?","v":10,"tol":0,"u":"mil","w":"2 × 5 = 10 mil."}]},{"t":"Avoid starved prepregs","s":["zc",25],"x":"Very low resin, high glass prepregs like 7628 and 2116 risk resin starvation. 2113 is borderline.","q":[{"k":"mc","p":"Which prepreg styles have very low resin content?","o":["7628 and 2116","106 and 1067","1080 and 106","None"],"w":"High glass content means less resin to flow."}]},{"t":"Annotate impedances","s":["zc",29],"x":"Mark controlled nets on the schematic: differential pairs (100, 90 or 85 Ω) or single-ended (40-75 Ω). Add N/P suffixes to differential net names.","q":[{"k":"mc","p":"Which is a common differential pair target?","o":["90 Ω","9 Ω","900 Ω","9 kΩ"],"w":"100, 90 and 85 Ω are typical differential targets."}]},{"t":"How dimensions move Z","s":["zc",30],"x":"Impedance falls as trace width and thickness grow. It rises with laminate height and falls with the square root of Dk.","q":[{"k":"match","p":"Match each change to its effect.","pairs":[["Thicker laminate (more height)","Higher impedance"],["Wider trace","Lower impedance"],["Higher Dk","Lower impedance"]],"w":"Z ∝ height, ∝ 1/width, ∝ 1/√Er."}]},{"t":"Make impedance traces unique","s":["zc",30],"x":"Give impedance traces a width no other trace uses, like 5.1 or 4.9 mil instead of 5 mil, so the fab can find and adjust them.","q":[{"k":"mc","p":"Why draw a 50 Ω trace at 5.1 mil instead of 5 mil?","o":["So the fab can tell it apart from other traces","5.1 mil carries more current","CAD tools require odd widths","It looks better"],"w":"Unique widths flag the traces that need tuning."}]}]},{"u":"Routing pairs","c":9,"L":[{"t":"Pair-to-pair spacing","s":["ti",9],"x":"TI: keep high-speed pairs at least 5 trace widths apart (5W), at least 30 mil from other signals, and 50 mil from clocks or periodic signals.","q":[{"k":"num","p":"Pair traces are 6 mil wide. Minimum pair-to-pair spacing by 5W, in mil?","v":30,"tol":0,"u":"mil","w":"5 × 6 = 30 mil."}]},{"t":"Nothing between the pair","s":["zc",32],"f":"diffpair","x":"Don't put components or vias between the two traces of a pair, even symmetrically. Place series coupling capacitors symmetrically on both legs.","q":[{"k":"tf","p":"Placing a via between the two traces of a differential pair is fine if it's centred.","v":false,"w":"It creates a discontinuity regardless."}]},{"t":"Fix skew near the source","s":["zc",34],"x":"Add serpentine length matching on the shorter trace, as close as possible to where the mismatch starts.","q":[{"k":"mc","p":"Where should a serpentine go to fix intra-pair skew?","o":["Near where the mismatch starts","At the far end always","In the middle always","On the longer trace"],"w":"Correct it before the skew travels down the line."}]},{"t":"Bends cancel out","s":["zc",34],"x":"Each bend makes the inner trace shorter. Two opposite bends within 15 mm compensate each other, so no serpentine is needed.","q":[{"k":"tf","p":"Two opposite bends within 15 mm of each other need no extra length matching.","v":true,"w":"The skews cancel."}]},{"t":"Return current paths","s":["zc",35],"x":"High-speed return current flows in the plane directly under the trace. Low-speed return current takes the shortest path. So never route high-speed signals over a split.","q":[{"k":"match","p":"Match each signal type to its return path.","pairs":[["High-speed signal","Directly under the trace"],["Low-speed signal","Shortest available path"]],"w":"Inductance dominates at high frequency, resistance at low."}]},{"t":"Crossing two planes","s":["zc",36],"f":"returnpath","x":"If a signal must cross from one reference plane to another, place a stitching capacitor near the crossing so return current can follow. Sierra suggests 10-100 nF.","q":[{"k":"mc","p":"Suggested stitching capacitor value across reference planes?","o":["10-100 nF","10-100 µF","1-10 pF","1 F"],"w":"Placed right next to the signal path."}]},{"t":"Stitch near layer changes","s":["ti",8],"x":"If a high-speed signal changes ground reference, stitch the two ground planes with vias within 200 mils of the signal via (closer is better).","q":[{"k":"mc","p":"How close should ground stitching vias be to the signal via, per TI?","o":["Within 200 mils","Within 2 inches","Within 2 mils exactly","Anywhere on the board"],"w":"Closer keeps the return loop small."}]},{"t":"Rotate away from the weave","s":["ti",4],"x":"To beat fiber weave skew, rotate the whole image or route high-speed pairs at 10-35° to the weave, or zig-zag them. A tighter glass style also helps.","q":[{"k":"mc","p":"At what angle does TI suggest routing pairs relative to the weave?","o":["10-35°","0°","90° exactly","180°"],"w":"An angle averages glass and resin under both legs."}]},{"t":"Keep away from plane edges","s":["ti",9],"x":"TI: route high-speed pairs at least 90 mils from a reference plane edge and at least 1.5 trace widths from plane voids.","q":[{"k":"mc","p":"Minimum distance from a reference plane edge, per TI?","o":["90 mils","9 mils","900 mils","0 mils"],"w":"Fields need plane beneath them on both sides."}]},{"t":"Break out fast","s":["ti",10],"x":"Pairs naturally split apart at package escapes and connectors. Keep those uncoupled segments short; break out within 0.25 inch of the package.","q":[{"k":"mc","p":"Within what distance of the package should pair breakout happen?","o":["0.25 inch","2.5 inches","25 inches","Anywhere"],"w":"Short asymmetry keeps impedance consistent."}]},{"t":"Through-hole connectors","s":["ti",10],"x":"For a through-hole receptacle like USB Type-A, connect high-speed pairs on the bottom layer so the pin isn't left as a stub. For SMT receptacles, connect on top.","q":[{"k":"mc","p":"On which layer should high-speed traces meet a through-hole USB receptacle?","o":["Bottom layer","Top layer","Any inner layer","It doesn't matter"],"w":"Top-layer entry leaves the rest of the pin as a stub."}]},{"t":"Stub and antipad limits","s":["ti",11],"x":"TI keeps via stubs under 15 mils and back-drills longer ones. It also recommends large antipads, around 30 mils, on high-speed vias.","q":[{"k":"mc","p":"TI's maximum via stub length before back-drilling?","o":["15 mils","150 mils","1.5 mils","50 mils"],"w":"Longer stubs resonate at lower frequencies."}]},{"t":"Small AC caps","s":["ti",12],"x":"If a pair needs AC coupling capacitors, TI allows 0603 at most and strongly prefers 0402 or smaller, placed symmetrically, with the reference plane voided under the pads.","q":[{"k":"mc","p":"Largest AC coupling capacitor package TI permits?","o":["0603","1206","2512","Through-hole"],"w":"Smaller pads mean smaller discontinuities."}]},{"t":"Gentle bends","s":["ti",13],"x":"Avoid bends in high-speed pairs. When you must, keep the bend angle above 135° so it is as loose as possible.","q":[{"k":"mc","p":"Minimum bend angle for high-speed pairs, per TI?","o":["Greater than 135°","Exactly 90°","Less than 45°","Any angle"],"w":"Loose bends keep the pair balanced."}]},{"t":"Interface impedances","s":["ti",16],"x":"Typical TI targets: USB 2.0 pairs 90 Ω differential, PCIe pairs 100 Ω differential, SuperSpeed USB pairs 90 Ω differential.","q":[{"k":"match","p":"Match each interface to its typical differential impedance.","pairs":[["USB 2.0","90 Ω"],["PCIe","100 Ω"]],"w":"Always check the device datasheet."}]},{"t":"Keep pairs symmetric","s":["bogatin",831],"x":"Avoid every asymmetry in a differential pair. Whatever you do to one trace, do the same to the other.","q":[{"k":"tf","p":"It's fine to add a via to only one leg of a differential pair.","v":false,"w":"Asymmetry converts differential signal into common mode."}]},{"t":"Crossing gaps","s":["bogatin",833],"x":"If a signal must cross a gap in the return path, only do it with differential pairs. Never cross a gap with closely spaced single-ended signals.","q":[{"k":"mc","p":"If a trace must cross a return-path gap, which signal type should it be?","o":["A differential pair","A single-ended clock","A group of single-ended lines","Any type"],"w":"A pair carries much of its own return current."}]}]},{"u":"EMI basics","c":10,"L":[{"t":"Radiated vs conducted","s":["emi",5],"x":"EMI is energy from one device disrupting another. It travels through the air (radiated) or along wires and cables (conducted).","q":[{"k":"match","p":"Match each path to its name.","pairs":[["Through the air","Radiated"],["Along wires and cables","Conducted"]],"w":"Both emissions and immunity tests cover each path."}]},{"t":"The EMI band","s":["emi",5],"x":"EMI problems most often sit between 9 kHz and 6 GHz. Above 6 GHz, interference usually stays on one board and is treated as signal integrity.","q":[{"k":"mc","p":"What range covers most EMI problems?","o":["9 kHz to 6 GHz","1 Hz to 100 Hz","10 GHz to 100 GHz","Only 50/60 Hz"],"w":"Radios, Wi-Fi, SMPS and motors all fall in this band."}]},{"t":"Source, path, victim","s":["emi",6],"x":"Every EMI problem has a noisy source, a sensitive victim and a coupling path between them. Break any one and the problem goes away.","q":[{"k":"mc","p":"Which is NOT one of the three elements of an EMI problem?","o":["A solder mask colour","A noisy source","A sensitive victim","A coupling path"],"w":"Source, path, victim."}]},{"t":"EMI can't be eliminated","s":["emi",6],"x":"You can't eliminate EMI entirely. You design to be less vulnerable and to emit less; that is electromagnetic compatibility (EMC).","q":[{"k":"tf","p":"Good design can eliminate EMI completely.","v":false,"w":"The goal is compatibility, not zero EMI."}]},{"t":"Most products fail first","s":["emi",7],"x":"60-90% of products fail their first EMC compliance test. Fixes get harder and costlier the later you find them.","q":[{"k":"mc","p":"What share of products fail their first EMC test, per industry data in the guide?","o":["60-90%","1-5%","10-20%","100%"],"w":"Design for EMC early to avoid respins."}]},{"t":"FCC Part 15 radiators","s":["emi",9],"x":"FCC Part 15 sorts devices into intentional radiators (Wi-Fi routers), unintentional radiators (computers, TV receivers) and incidental radiators (motors, light dimmers).","q":[{"k":"match","p":"Match each device to its FCC class.","pairs":[["Wi-Fi router","Intentional radiator"],["Computer","Unintentional radiator"],["Electric motor","Incidental radiator"]],"w":"The class sets which rules apply."}]},{"t":"Class A vs Class B","s":["emi",10],"x":"Under CISPR, Class A equipment is for industrial and heavy commercial settings. Class B is for residential and light commercial, with stricter emission limits.","q":[{"k":"mc","p":"Which class has the stricter emission limits?","o":["Class B (residential)","Class A (industrial)","They are identical","Neither has limits"],"w":"Homes are full of sensitive radios and TVs."}]},{"t":"Military testing","s":["emi",10],"x":"MIL-STD-461 defines 19 test methods in four groups: conducted emissions (CE), radiated emissions (RE), conducted susceptibility (CS) and radiated susceptibility (RS). Programs tailor which apply.","q":[{"k":"mc","p":"What does the 'RS' test group in MIL-STD-461 cover?","o":["Radiated susceptibility","Radiated solder","Resistive shorts","Reflow soldering"],"w":"CE, RE, CS, RS."}]}]},{"u":"Resilience and sources","c":10,"L":[{"t":"Watchdog timers","s":["emi",14],"x":"Software matters too. A watchdog timer resets the system if the program stops checking in, so EMI can't leave it stuck.","q":[{"k":"mc","p":"What does a watchdog timer do?","o":["Resets the system if software hangs","Filters RF noise","Measures temperature","Shields a cable"],"w":"Detect, survive, recover."}]},{"t":"No floating inputs","s":["emi",15],"x":"Floating input pins act like antennas and pick up noise. Use pull-up or pull-down resistors so every input has a defined state.","q":[{"k":"tf","p":"Leaving unused input pins floating is harmless.","v":false,"w":"Floating pins pick up noise and behave randomly."}]},{"t":"Fast edges, more noise","s":["emi",17],"x":"Faster rise and fall times create more high-frequency noise. Designs that passed EMC have failed after switching to SiC or GaN parts, which switch much faster.","q":[{"k":"mc","p":"Why can swapping in GaN or SiC transistors cause EMC failures?","o":["They switch much faster, creating more HF noise","They are bigger","They use less copper","They run cooler"],"w":"Choose the slowest edges your design allows."}]},{"t":"Harmonic cut-off","s":["emi",21],"x":"Harmonics fall off quickly above 1/(π × rise time). A 20 MHz clock with 2 ns edges has significant harmonics to about 159 MHz; with 10 ns edges, only to about 32 MHz.","q":[{"k":"num","p":"Using 1/(π × tr), where do harmonics start falling fast for a 5 ns rise time, in MHz?","v":63.7,"tol":0.5,"u":"MHz","w":"1 ÷ (π × 5 ns) ≈ 63.7 MHz."}]},{"t":"Motors are broadband","s":["emi",23],"x":"Motor noise is broadband, roughly 100 kHz to 200 MHz, from brush arcing, commutation and bearing arcing. It looks like a hump rather than sharp spikes.","q":[{"k":"mc","p":"What does motor noise look like on a spectrum plot?","o":["A broad hump across a wide range","Evenly spaced sharp peaks","A single line at 50 Hz","Nothing measurable"],"w":"Clocks make spikes; motors make humps."}]}]},{"u":"Accidental antennas","c":10,"L":[{"t":"Cables at λ/4","s":["emi",24],"x":"A cable radiates best when its length is near a quarter wavelength. The 5th harmonic of a 20 MHz clock (100 MHz) has λ = 3 m, so a 75 cm cable is an excellent antenna.","q":[{"k":"num","p":"A harmonic at 300 MHz has λ = 1 m in air. Worst-case cable length in cm (λ/4)?","v":25,"tol":0,"u":"cm","w":"1 m ÷ 4 = 25 cm."}]},{"t":"Ribbon cable grounds","s":["emi",27],"x":"The worst ribbon cable puts all grounds at one edge. Best is alternating ground-signal-ground; next best is grounds spread evenly through the cable.","q":[{"k":"mc","p":"Which ribbon cable layout gives the best EMC?","o":["Alternate ground and signal wires","All grounds on one edge","No ground wires","One ground in the middle only"],"w":"Each signal then has its own return path."}]},{"t":"Traces as antennas","s":["emi",29],"x":"Traces radiate when their length nears a fraction of a wavelength. The 5th harmonic of a 500 MHz clock (2.5 GHz) makes an unterminated 3 cm trace a likely antenna.","q":[{"k":"mc","p":"What helps keep a trace from becoming an antenna?","o":["Keep it short, terminated, over a solid plane","Make it longer","Route it at the board edge","Leave it unterminated"],"w":"All four of the guide's trace rules point the same way."}]},{"t":"Ground the heat sink","s":["emi",29],"x":"An ungrounded heat sink can pick up high-frequency noise from nearby parts and radiate it. Connect it to ground with screws, conductive TIM or clips.","q":[{"k":"tf","p":"An ungrounded heat sink can act as an antenna.","v":true,"w":"Large floating metal radiates."}]},{"t":"Loops radiate","s":["emi",30],"x":"Every current loop is a potential antenna. Radiation grows with frequency, current and loop area. Keep signal and return close together.","q":[{"k":"mc","p":"Which change increases loop radiation?","o":["Larger loop area","Smaller loop area","Lower current","Lower frequency"],"w":"Area, current and frequency all raise it."}]},{"t":"Slots at λ/2","s":["emi",31],"x":"A slot in a plane or enclosure radiates best when its longest side is half a wavelength. At 2.5 GHz (λ = 12 cm), a 6 cm slot is a good radiator.","q":[{"k":"num","p":"At 1 GHz in air (λ = 30 cm), what slot length radiates best, in cm?","v":15,"tol":0,"u":"cm","w":"30 cm ÷ 2 = 15 cm."}]},{"t":"Enclosure openings","s":["emi",34],"x":"For vents in metal enclosures, honeycomb mesh is best, many small round holes are good, and long thin slots are worst.","q":[{"k":"ord","p":"Order vent styles from best to worst EMC.","o":["Honeycomb mesh","Many small round holes","Long thin slots"],"w":"Smaller maximum dimension means less radiation."}]},{"t":"Bonding needs bare metal","s":["emi",35],"x":"Screws hold panels together but don't guarantee an electrical bond. Paint or anodizing blocks contact, and loose fasteners degrade it over time.","q":[{"k":"tf","p":"Two anodized aluminium panels screwed together are well bonded for EMC.","v":false,"w":"Anodizing kills surface conductivity."}]},{"t":"Bond strap shape","s":["emi",37],"x":"Bond straps should be short and wide, ideally no longer than 5 times their width. Thin wires add inductance.","q":[{"k":"num","p":"A bond strap is 10 cm long. Minimum width in cm by the 5:1 rule?","v":2,"tol":0,"u":"cm","w":"10 ÷ 5 = 2 cm."}]}]},{"u":"Designing for EMC","c":10,"L":[{"t":"Don't split ground","s":["emi",44],"x":"High-frequency return current stays under its trace, so fields contain themselves. Use a continuous ground plane; splitting analog and digital grounds often causes more problems.","q":[{"k":"tf","p":"This guide recommends splitting ground planes between analog and digital sections.","v":false,"w":"Keep ground continuous; let return currents follow their traces."}]},{"t":"Away from the edge","s":["emi",46],"x":"Traces near the board edge lack plane underneath to contain their fields. Keep traces and components at least one dielectric thickness from the edge.","q":[{"k":"mc","p":"Minimum trace-to-edge distance per the EMI guide?","o":["One dielectric thickness","Zero","One inch always","Ten board thicknesses"],"w":"The plane must extend beyond the trace's fields."}]},{"t":"Layer 2 is ground","s":["emi",48],"x":"Every noisy layer needs a solid plane right next to it. On any multilayer board, make layer 2 a solid ground. Six-layer stack-ups are excellent for EMC.","q":[{"k":"mc","p":"What should layer 2 of a multilayer board be?","o":["A solid ground reference plane","A signal layer","Silkscreen","Nothing"],"w":"Layer 1 is noisy; layer 2 contains its fields."}]},{"t":"Best 4-layer stack","s":["emi",49],"x":"The better 4-layer stack is signals, ground, power, signals, so both outer layers have an adjacent plane.","q":[{"k":"ord","p":"Order the layers of the recommended 4-layer stack, top to bottom.","o":["Components/signals","Ground plane","Power plane","Components/signals"],"w":"Each outer layer sits next to a solid plane."}]},{"t":"Ground floods need vias","s":["emi",49],"x":"Ground pours on outer layers help only if stitched to the adjacent plane with many vias. A poorly connected flood can be worse than none.","q":[{"k":"tf","p":"A ground flood with few via connections can be worse than no flood.","v":true,"w":"Poorly tied copper floats and radiates."}]},{"t":"Edge via fences","s":["emi",53],"x":"A row of ground vias around the board edge contains fields. Space them under λ/20 at your highest frequency: about 9 mm at 1 GHz in FR-4.","q":[{"k":"mc","p":"Maximum via fence spacing for 1 GHz in FR-4?","o":["About 9 mm","About 9 cm","About 0.9 mm","About 90 cm"],"w":"λ in FR-4 at 1 GHz ≈ 18 cm; ÷ 20 = 9 mm."}]},{"t":"Filter at the entry","s":["emi",55],"x":"Put EMI filters where signals and power enter or leave: power inputs, I/O connectors and communication ports. Filter before noise reaches cables.","q":[{"k":"mc","p":"Where should EMI filters go?","o":["Where signals enter or leave the system","In the middle of the board","Only on the ground plane","Nowhere; shields are enough"],"w":"Stop noise before it reaches cables."}]},{"t":"Choosing ferrites","s":["emi",58],"x":"Ferrites add impedance at high frequency. Watch for DC saturation, signal-edge distortion, and pick a material whose impedance peaks at your noise frequency.","q":[{"k":"mc","p":"A nickel-zinc ferrite effective above 100 MHz is used on 250 kHz noise. Result?","o":["Little or no improvement","Perfect suppression","The board shorts","The noise doubles"],"w":"Wrong material for the frequency."}]},{"t":"360° shield termination","s":["emi",63],"x":"Cable shields work when bonded 360° to the enclosure at both ends. Pigtail or drain-wire terminations have high inductance and can turn the shield into an antenna.","q":[{"k":"mc","p":"Why do pigtail shield connections fail at high frequency?","o":["High inductance and field leakage","They are too short","They use too much copper","They block DC"],"w":"Terminate shields 360° to the chassis."}]},{"t":"Board to chassis","s":["emi",63],"x":"A common way to tie a PCB to its metal chassis is through a capacitor at a mounting hole: low impedance at high frequency, but it blocks DC to avoid ground loops.","q":[{"k":"mc","p":"Why connect a PCB to chassis through a capacitor?","o":["Low impedance at HF while blocking DC","To store energy for the CPU","To raise impedance at HF","To pass DC only"],"w":"It handles EMI without creating a DC ground loop."}]},{"t":"Decibel shortcuts","s":["emi",67],"x":"For voltage, current or field strength, ±6 dB doubles or halves the value. For power, ±3 dB doubles or halves it.","q":[{"k":"match","p":"Match each change to its effect.","pairs":[["+6 dB in voltage","Voltage doubles"],["+3 dB in power","Power doubles"],["+20 dB in voltage","Voltage × 10"]],"w":"Voltage uses 20 log; power uses 10 log."}]},{"t":"Tiny currents fail FCC","s":["bogatin",847],"x":"Only about 3 µA of common-mode current on an unshielded twisted-pair cable is enough to fail FCC Class B.","q":[{"k":"mc","p":"About how much common current on an unshielded cable fails FCC Class B?","o":["3 µA","3 A"
