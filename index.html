<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="PCB design lessons with sources, streaks and quizzes."><meta name="theme-color" content="#C6FF2E"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Copper Path"><title>Copper Path</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Copper Path — Neo Swiss "Melt + Solder": white paper, ink, one acid-lime accent, lumpy organic shapes. */
:root{
  --bg:#ffffff; --paper:#ffffff; --soft:#f2f2ee; --ink:#0a0a0a; --muted:#555555; --line:#0a0a0a;
  --lime:#C6FF2E; --on-lime:#0a0a0a; --bad:#D7261E;
  --copper:#0a0a0a; --fr:#e8e6dd; --fr2:#d6d3c6; --mask:#0a0a0a; --pi:#E7B04A; --violet:#9b6ee0; --bot:#3d6fd6; --glow:#C6FF2E; --sunk:#f2f2ee; --surface:#ffffff; --good:#0a0a0a;
  --f-display:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-body:"Inter Tight","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --tabh:64px;
  --lump:30px 24px 32px 22px / 24px 30px 22px 32px;
  --lump2:24px 30px 22px 32px / 30px 24px 32px 22px;
  --pill:20px 16px 22px 15px / 16px 21px 15px 20px;
  --pri-bg:#0a0a0a; --pri-fg:#C6FF2E;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0a0a0a; --paper:#121212; --soft:#1b1b1a; --ink:#f4f4ef; --muted:#b4b4ad; --line:#f4f4ef;
  --copper:#f4f4ef; --fr:#3a3830; --fr2:#4b483c; --mask:#f4f4ef; --sunk:#1b1b1a; --surface:#121212; --good:#f4f4ef; --pri-bg:#C6FF2E; --pri-fg:#0a0a0a; color-scheme:dark }}
:root[data-theme="dark"]{
  --pri-bg:#C6FF2E; --pri-fg:#0a0a0a;
  --bg:#0a0a0a; --paper:#121212; --soft:#1b1b1a; --ink:#f4f4ef; --muted:#b4b4ad; --line:#f4f4ef;
  --copper:#f4f4ef; --fr:#3a3830; --fr2:#4b483c; --mask:#f4f4ef; --sunk:#1b1b1a; --surface:#121212; --good:#f4f4ef; color-scheme:dark }
.lesson.dark{--pri-bg:#C6FF2E; --pri-fg:#0a0a0a; --bg:#0a0a0a; --paper:#121212; --soft:#1b1b1a; --ink:#f4f4ef; --muted:#b4b4ad; --line:#f4f4ef; --copper:#f4f4ef; --fr:#3a3830; --fr2:#4b483c; --mask:#f4f4ef; --sunk:#1b1b1a; --surface:#121212; --good:#f4f4ef; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow-x:clip}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--lime)}
button,input{font:inherit;color:inherit}
a{color:var(--ink)}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:560px;margin:0 auto;position:relative;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(var(--tabh) + 32px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
.mono,.eyebrow{font-family:var(--f-mono)}
.eyebrow{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.b1{border-radius:58% 42% 55% 45% / 45% 55% 45% 55%}
.b2{border-radius:42% 58% 47% 53% / 56% 44% 56% 44%}
.b3{border-radius:55% 45% 40% 60% / 48% 60% 40% 52%}
.b4{border-radius:46% 54% 60% 40% / 52% 44% 56% 48%}
.b5{border-radius:62% 38% 54% 46% / 42% 58% 44% 56%}
.b6{border-radius:52% 48% 42% 58% / 58% 46% 54% 42%}
.b7{border-radius:40% 60% 52% 48% / 50% 42% 58% 50%}

/* melt headers */
.melt{position:absolute;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);pointer-events:none;z-index:0;display:flex;flex-direction:column}
.melt i{display:block;flex:1;background:var(--lime);margin-bottom:-1px}
.melt svg{display:block;width:100%;height:76px;flex:none}
.melt path{fill:var(--lime)}
.mhead{position:relative;padding-bottom:64px}
.on-melt{position:relative;z-index:1;color:#0a0a0a}
.on-melt a{color:#0a0a0a}

/* top bar */
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:calc(14px + env(safe-area-inset-top,0px));font:700 11px/1 var(--f-mono);letter-spacing:.06em}
.top>span:first-child{white-space:nowrap}
.top .chips{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip-b{background:#0a0a0a;color:var(--lime);padding:5px 10px;border-radius:var(--pill);white-space:nowrap}
.chip-o{border:2px solid #0a0a0a;padding:3px 8px;border-radius:var(--pill);white-space:nowrap}
.chip-b svg{vertical-align:-2px}

/* learn header */
.lhead{position:relative;padding-bottom:84px}
.lrow{display:flex;gap:12px;align-items:flex-start}
.bignum{flex:none;font:900 clamp(104px,36vw,176px)/.86 var(--f-display);letter-spacing:-.07em;margin:8px 0 0 -4px}
.lhead .side{flex:1;min-width:0;margin-top:22px;display:flex;flex-direction:column;gap:7px}
.lhead .side b{font:800 19px/1.05 var(--f-display);letter-spacing:-.02em}
.charge-pill{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:#0a0a0a;color:var(--lime)!important;text-decoration:none;padding:8px 13px;border-radius:22px 18px 24px 16px / 18px 22px 16px 24px;font:700 10.5px var(--f-mono);border:0;cursor:pointer;margin-top:4px}
.charge-pill.done{background:var(--lime);color:#0a0a0a!important;border:2px solid #0a0a0a;cursor:default}
.newbie{border:2px solid var(--ink);border-radius:var(--lump);padding:12px 14px;margin:10px 0 12px;font-size:14px}
.newbie b{display:block;font:800 17px var(--f-display);margin-bottom:2px}
.overall{display:flex;align-items:center;gap:10px;font:700 11px var(--f-mono);margin:12px 0 10px}
.overall .bar{flex:1;height:10px;border:2px solid var(--ink);border-radius:6px 4px 7px 5px;overflow:hidden}
.overall .bar i{display:block;height:100%;background:var(--lime)}
.search{position:relative}
.search input{width:100%;min-height:50px;padding:0 14px 0 42px;border:2px solid var(--ink);border-radius:var(--lump);background:var(--paper);font-size:16px}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%)}

/* path */
.chap{display:flex;align-items:flex-end;gap:12px;margin:34px 0 6px}
.chap .n{font:900 84px/.8 var(--f-display);letter-spacing:-.07em}
.chap h2{font:800 20px/1.05 var(--f-display);letter-spacing:-.02em;flex:1}
.chap .c{font:700 11px var(--f-mono)}
.unit-h{display:flex;justify-content:space-between;gap:10px;border-top:2px solid var(--ink);padding-top:6px;margin-top:14px;font:700 10.5px var(--f-mono);letter-spacing:.05em;text-transform:uppercase}
.track{position:relative}
.track svg.tube{position:absolute;left:0;top:0;width:100%;overflow:visible}
.tube .lime{stroke:var(--lime)} .tube .ink{stroke:var(--ink)} .tube .hole{stroke:var(--bg)}
.bead{position:absolute;width:60px;height:58px;margin:-29px 0 0 -30px;border:2.5px solid var(--ink);background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;font:700 14px var(--f-mono);cursor:pointer;padding:0;z-index:2}
.bead.done{background:var(--lime);color:#0a0a0a}
.bead.cur{width:90px;height:86px;margin:-43px 0 0 -45px;background:var(--lime);color:#0a0a0a;border-width:4px;font:900 28px var(--f-display);letter-spacing:-.04em;z-index:3}
@media (prefers-reduced-motion:no-preference){.bead.cur{animation:wob 2.4s ease-in-out infinite}}
@keyframes wob{50%{transform:scale(1.05) rotate(-3deg)}}
.bead .st{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center;font-size:10px;line-height:1;color:var(--ink)}
.bead .mx{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}
.splat{position:absolute;border-radius:50%;background:var(--lime);border:1.5px solid var(--ink);z-index:1}
.nextcard{position:absolute;z-index:4;background:var(--bg);padding:8px 10px;border:2px solid var(--ink);border-radius:var(--lump);display:flex;flex-direction:column;gap:5px;transform:translateY(-50%)}
.nextcard b{font:800 18px/1.02 var(--f-display);letter-spacing:-.02em}
.nextcard .go{align-self:flex-start;background:var(--ink);color:var(--bg);font:700 10.5px var(--f-mono);padding:7px 12px;border-radius:var(--pill);border:0;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:14px;font:700 10px var(--f-mono);margin:14px 0 0;text-transform:uppercase}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:18px;height:17px;border:2px solid var(--ink)}
.legend i.d{background:var(--lime)}
.results{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.result{display:flex;gap:12px;align-items:center;text-align:left;padding:12px 14px;border:2px solid var(--ink);border-radius:var(--lump);background:var(--paper);cursor:pointer;width:100%}
.result .rb{flex:none;width:40px;height:38px;border:2.5px solid var(--ink);display:grid;place-items:center;font:700 11px var(--f-mono)}
.result .rb.d{background:var(--lime);color:#0a0a0a}
.result b{display:block;font-weight:700;font-size:16px;line-height:1.2}
.result small{font:500 10px var(--f-mono);text-transform:uppercase}
.empty{border:2px dashed var(--ink);border-radius:var(--lump);padding:24px;text-align:center}
.empty b{display:block;font:800 19px var(--f-display);margin-bottom:4px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border:2px solid var(--ink);border-radius:var(--lump);background:var(--paper);color:var(--ink);font:700 13px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg);min-height:60px;font-size:14px}
.btn.lime{background:var(--lime);color:#0a0a0a;border-color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:1;background:var(--paper);color:var(--muted);border-style:dashed;cursor:default}
.btn:active{transform:translateY(1px)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.row .btn{flex:1}

/* lesson overlay */
.lesson{position:fixed;inset:0;overflow-x:hidden;z-index:20;background:var(--bg);color:var(--ink);overflow-y:auto;overscroll-behavior:contain}
.lesson .wrap{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.lbar{position:relative;z-index:2;display:flex;align-items:center;gap:12px;padding-top:calc(14px + env(safe-area-inset-top,0px));margin-bottom:6px}
.x{width:46px;height:46px;flex:none;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;cursor:pointer;padding:0}
.beads{flex:1;display:flex;align-items:center;gap:5px;min-width:0}
.beads i{flex:none;width:22px;height:21px;border:2px solid var(--ink);background:var(--paper)}
.beads i.d{background:var(--lime)}
.beads i.c{width:28px;height:26px;border-width:3px}
.beads s{flex:1;height:6px;border:2px solid var(--ink);border-radius:4px;min-width:6px}
.beads s.d{background:var(--ink)}
.pbar{flex:1;height:12px;border:2px solid var(--ink);border-radius:7px 5px 8px 6px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lime);transition:width .3s}
.lbar .tag{font:700 11px var(--f-mono);flex:none;text-transform:uppercase}
.melt + .lbar{color:#0a0a0a}
.melt + .lbar .beads i,.melt + .lbar .beads s{border-color:#0a0a0a}
.melt + .lbar .beads s.d{background:#0a0a0a}
.melt + .lbar .x{background:#fff;border-color:#0a0a0a;color:#0a0a0a}
.stage{position:relative;z-index:1;padding-top:14px}
.stage h1{font:800 32px/1.03 var(--f-display);letter-spacing:-.03em;margin:8px 0 18px}
.intro h1{font:900 44px/.95 var(--f-display);letter-spacing:-.04em;margin:8px 0 12px}
.teach{margin:0;font-size:17px;line-height:1.45}
.fix{display:inline-block;background:var(--pri-bg);color:var(--pri-fg);font:700 10px var(--f-mono);letter-spacing:.06em;padding:4px 10px;border-radius:var(--pill);margin-bottom:8px}
.fig{margin:16px 0 4px;border:2px solid var(--ink);border-radius:26px 32px 24px 30px / 30px 24px 32px 26px;padding:12px;background:var(--paper);overflow:hidden}
.fig svg{display:block;width:100%;height:auto}
.figcap{font:700 9px var(--f-mono);letter-spacing:.06em;color:var(--muted);margin-top:6px}
.fig text,.scene text{font:500 10px var(--f-mono);fill:var(--ink)}
.fig text.s,.scene text.s{font-size:8.5px;fill:var(--muted)}
.fig text.w,.scene text.w{fill:var(--bg)}
.fig text.k,.scene text.k{fill:#0a0a0a}
.cu{fill:var(--lime);stroke:var(--ink);stroke-width:1} .cu-s{stroke:var(--ink);fill:none} .fr{fill:var(--fr)} .fr2{fill:var(--fr2)} .mk{fill:var(--mask)} .pi{fill:var(--pi)}
.ln{stroke:var(--ink);fill:none} .lm{stroke:var(--muted);fill:none} .sf{fill:var(--paper);stroke:var(--ink)} .bgc{fill:var(--soft)}
.scene{border:2px solid var(--ink);border-radius:26px 32px 24px 30px / 30px 24px 32px 26px;padding:12px;background:var(--paper)}
.scene svg{display:block;width:100%;height:auto;touch-action:manipulation}
.hit{cursor:pointer}
.hit .hz{fill:transparent;stroke:transparent;stroke-width:2.5}
.scene:not(.answered) .hit:hover .hz{stroke:var(--ink);stroke-dasharray:4 3}
.scene.answered .hit{cursor:default}
.hit.ok .hz{stroke:var(--ink);stroke-dasharray:none;fill:color-mix(in srgb,var(--lime) 55%,transparent)}
.hit.no .hz{stroke:var(--ink);stroke-dasharray:3 3;fill:color-mix(in srgb,var(--ink) 18%,transparent)}
.srcpill{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border:2px solid var(--ink);border-radius:var(--pill);font:700 10.5px/1.3 var(--f-mono);text-decoration:none;color:var(--ink);max-width:100%;text-transform:uppercase;background:var(--paper)}
.srcpill span{overflow-wrap:anywhere}

.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;min-height:58px;padding:10px 16px;border:2px solid var(--ink);border-radius:var(--lump);background:var(--paper);cursor:pointer;font:600 17px/1.25 var(--f-body);width:100%;color:var(--ink)}
.opt:nth-child(2n){border-radius:var(--lump2)}
.opt .k{flex:none;font:700 12px var(--f-mono)}
.opt:hover:not([disabled]){border-width:3px;padding:9px 15px}
.opt[disabled]{cursor:default}
.opt.right{background:var(--lime);color:#0a0a0a;font-weight:800;border-width:2.5px}
.opt.right::after{content:"";margin-left:auto;width:18px;height:10px;border-left:3px solid #0a0a0a;border-bottom:3px solid #0a0a0a;transform:rotate(-45deg) translate(2px,-2px);flex:none}
.opt.wrong{background:var(--ink);color:var(--bg)}
.opt.wrong span:last-child{text-decoration:line-through}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{min-height:110px;justify-content:center;font:900 26px var(--f-display);letter-spacing:-.02em}
.tf .opt:first-child{border-radius:46% 54% 48% 52% / 52% 44% 56% 48%}
.tf .opt:last-child{border-radius:54% 46% 52% 48% / 44% 56% 46% 54%}
.tf .opt.right::after{display:none}
.order-seq{min-height:58px;display:flex;flex-direction:column;gap:8px;padding:10px;border:2px dashed var(--ink);border-radius:var(--lump);margin-bottom:10px}
.order-seq:empty::before{content:"Tap the items below in order";font:600 12px var(--f-mono);color:var(--muted);padding:6px}
.chip{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 14px;border:2px solid var(--ink);border-radius:var(--lump2);background:var(--paper);cursor:pointer;text-align:left;width:100%;font-size:15px;color:var(--ink)}
.chip .n{font:700 12px var(--f-mono);width:20px;flex:none}
.chip.placed{background:var(--lime);color:#0a0a0a}
.chip.ok{background:var(--lime);color:#0a0a0a}
.chip.no{background:var(--ink);color:var(--bg)}
.pool{display:flex;flex-direction:column;gap:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{min-height:60px;padding:8px 12px;border:2px solid var(--ink);border-radius:var(--lump);background:var(--paper);cursor:pointer;text-align:left;font:600 14.5px/1.25 var(--f-body);position:relative;width:100%;color:var(--ink)}
.mi:nth-child(2n){border-radius:var(--lump2)}
.mi.sel{border-width:4px;padding:6px 10px}
.mi[data-pair]{background:var(--lime);color:#0a0a0a;font-weight:800}
.mi[data-pair]::after{content:attr(data-tag);position:absolute;top:-10px;right:-6px;width:24px;height:22px;border-radius:58% 42% 55% 45% / 45% 55% 45% 55%;background:#0a0a0a;color:var(--lime);font:700 11px/22px var(--f-mono);text-align:center}
.mi.ok{background:var(--lime);color:#0a0a0a}
.mi.no{background:var(--ink);color:var(--bg)} .mi.no::after{background:var(--bg);color:var(--ink)}
.numin{display:flex;gap:8px}
.numin input{flex:1;min-width:0;min-height:62px;padding:0 16px;border:2.5px solid var(--ink);border-radius:var(--lump);background:var(--paper);font:700 22px var(--f-mono)}
.numin .u{display:grid;place-items:center;min-width:64px;padding:0 12px;background:var(--ink);color:var(--bg);border-radius:var(--lump2);font:700 14px var(--f-mono)}
.numin input.ok{background:var(--lime);color:#0a0a0a} .numin input.no{background:var(--ink);color:var(--bg)}

.fb{margin-top:18px;padding:18px 16px 16px;border-radius:34px 28px 30px 26px / 28px 34px 26px 30px;display:flex;flex-direction:column;gap:10px}
.fb.good{background:var(--lime);color:#0a0a0a;border:2.5px solid #0a0a0a}
.fb.bad{background:var(--ink);color:var(--bg)}
.fb .h{display:flex;align-items:center;gap:12px}
.fb .h b{font:900 28px var(--f-display);letter-spacing:-.03em;flex:1}
.fb .xp{font:700 12px var(--f-mono)}
.fb p{margin:0;font-size:16px;line-height:1.4}
.fb .ans{font:700 13px var(--f-mono)}
.fb .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.fb .why-btn{font:700 11px var(--f-mono);background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 14px;border-radius:var(--pill);cursor:pointer}
.fb.bad .why-btn{background:var(--bg);border-color:var(--bg)}
.fb .srcpill{border-color:currentColor;color:inherit;background:transparent}
.why{padding:12px;border-radius:var(--lump);background:var(--paper);color:var(--ink);font-size:15px}
.fb.bad .why{background:var(--bg)}
.fb .btn{min-height:56px;margin-top:2px}
.fb.good .btn{background:#0a0a0a;color:var(--lime);border-color:#0a0a0a}
.fb.bad .btn{background:var(--lime);color:#0a0a0a;border-color:var(--lime)}

/* complete */
.done-wrap{text-align:center;position:relative;overflow-x:clip}
.art{position:relative;z-index:1;width:100%;max-width:360px;margin:0 auto;display:block}
.done-wrap h1{font:900 40px/.95 var(--f-display);letter-spacing:-.04em;margin:6px 0 10px}
.stamp{display:inline-block;transform:rotate(-7deg);background:var(--pri-bg);color:var(--pri-fg);padding:8px 22px;border-radius:30px 22px 34px 20px / 22px 30px 20px 34px;font:900 26px var(--f-display);letter-spacing:.06em;margin:4px 0 18px}
@media (prefers-reduced-motion:no-preference){
  .stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) 1.1s both}
  .art .rb{animation:pop .35s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
  .art .face{animation:pop .4s ease-out 1s both;transform-box:fill-box;transform-origin:center}
  .art .rays{animation:fade .3s ease-out 1.25s both}
}
@keyframes stamp{from{transform:rotate(-7deg) scale(2.2);opacity:0}to{transform:rotate(-7deg) scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.tally div{border:2px solid var(--ink);border-radius:22px 18px 24px 16px / 18px 22px 16px 24px;padding:10px 6px;display:flex;flex-direction:column;gap:2px}
.tally div:last-child{background:var(--lime);color:#0a0a0a}
.tally small{font:700 9.5px var(--f-mono);text-transform:uppercase}
.tally b{font:900 26px var(--f-display)}
.newbadge{display:flex;align-items:center;gap:12px;text-align:left;margin:0 0 14px;padding:10px 14px;border:2.5px solid #0a0a0a;background:var(--lime);color:#0a0a0a;border-radius:var(--lump)}
.newbadge b{font:800 16px var(--f-display)}
.newbadge .more{margin-left:auto;font:700 10px var(--f-mono)}

/* tabs pages */
.phead{position:relative;padding-bottom:84px}
.phead .big{display:flex;align-items:baseline;gap:10px;margin-top:10px}
.phead .big span:first-child{font:900 96px/.82 var(--f-display);letter-spacing:-.07em}
.phead .big span:last-child{font:800 21px/1.05 var(--f-display)}
.phead h1{font:900 44px/.95 var(--f-display);letter-spacing:-.04em;margin-top:14px}
.lead{font-size:15px;line-height:1.45;margin:14px 0}
.card{border:2px solid var(--ink);border-radius:var(--lump);padding:14px;background:var(--paper)}
.miss{display:flex;align-items:center;gap:14px;padding:12px 14px;border:2px solid var(--ink);border-radius:var(--lump);text-decoration:none;text-align:left;width:100%;background:var(--paper);cursor:pointer}
.miss:nth-child(2n){border-radius:var(--lump2)}
.miss .eb{flex:none;width:34px;height:32px;border:2.5px solid var(--ink)}
.miss b{display:block;font-size:16px;line-height:1.2}
.miss small{font:700 9.5px var(--f-mono);text-transform:uppercase}
.list{display:flex;flex-direction:column;gap:10px}
.rule{border-top:2px solid var(--ink);padding-top:12px;margin-top:20px}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.diff button{min-height:70px;border:2px solid var(--ink);background:var(--paper);cursor:pointer;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.diff button b{font:800 16px var(--f-display)}
.diff button small{font:600 9.5px var(--f-mono)}
.diff button[aria-pressed="true"]{background:var(--lime);color:#0a0a0a;border-width:3px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin:12px 0}
.kv div{border:2px solid var(--ink);border-radius:22px 18px 24px 16px / 18px 22px 16px 24px;padding:10px;display:flex;flex-direction:column;gap:2px}
.kv div:first-child{background:var(--lime);color:#0a0a0a}
.kv small{font:700 9.5px var(--f-mono);text-transform:uppercase}
.kv b{font:900 24px var(--f-display)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 16px;border:2px solid var(--ink);background:var(--paper);border-radius:var(--pill);font:700 12px var(--f-mono);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pri-bg);color:var(--pri-fg);border-color:var(--pri-bg)}
.drips{display:block;width:100%;height:auto;margin:10px 0 4px}
.drips .band,.drips .drip{fill:var(--lime)}
.drips .drip.goal{stroke:var(--ink);stroke-width:2}
.drips text{font:600 9.5px var(--f-mono);fill:var(--ink)}
.drips line{stroke:var(--ink)}
.badges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 8px}
.badge{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.badge .bb{width:64px;height:60px;border:2.5px solid var(--ink);display:grid;place-items:center;font:900 17px var(--f-display);background:var(--lime);color:#0a0a0a}
.badge.locked .bb{background:transparent;border-style:dashed;color:var(--muted)}
.badge b{font:700 11px/1.2 var(--f-body)}
.badge small{font-size:10px;line-height:1.25;color:var(--muted)}
.srcrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:2px solid var(--ink);border-radius:var(--lump)}
.srcrow:nth-child(2n){border-radius:var(--lump2)}
.srcrow .c{flex:none;width:48px;height:44px;border:2px solid var(--ink);background:var(--lime);color:#0a0a0a;display:grid;place-items:center;font:700 13px var(--f-mono)}
.srcrow b{display:block;font:800 15px/1.2 var(--f-display)}
.srcrow small{font:600 9.5px/1.4 var(--f-mono);text-transform:uppercase}
.srcrow a{color:var(--ink)}
.confirm{margin-top:10px;padding:12px;border:2px solid var(--ink);border-radius:var(--lump)}

/* arena */
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;margin:8px 0 14px}
.vs .side{border:2.5px solid var(--ink);padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--paper)}
.vs .side.me{background:var(--lime);color:#0a0a0a}
.vs .side small{font:700 10px var(--f-mono);text-transform:uppercase}
.vs .side b{font:900 52px/1 var(--f-display)}
.vs .mid{font:900 18px var(--f-display)}
.dots{display:flex;gap:3px}
.dots i{width:10px;height:10px;border-radius:50%;border:1.5px solid currentColor}
.dots i.on{background:currentColor}
.timer{display:flex;align-items:center;gap:10px;margin-bottom:6px;font:700 12px var(--f-mono)}
.timer .t{flex:1;height:14px;border:2px solid var(--ink);border-radius:8px;position:relative}
.timer .t i{position:absolute;left:0;top:0;bottom:0;background:var(--lime);border-radius:6px 0 0 6px;transition:width .25s linear}
.timer .t i::after{content:"";position:absolute;right:-5px;top:4px;width:10px;height:16px;background:var(--lime);border-radius:0 0 6px 6px}
.timer.low .t i,.timer.low .t i::after{background:var(--ink)}
.opts.grid2{display:grid;grid-template-columns:1fr 1fr}
.opts.grid2 .opt{min-height:76px;justify-content:center;text-align:center;font:800 19px/1.15 var(--f-display)}
.opts.grid2 .opt .k{display:none}
.botsay{display:flex;align-items:center;gap:12px;border-top:2px solid var(--ink);padding-top:12px;margin-top:16px;font:600 11px var(--f-mono);min-height:44px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--bg);border-top:2px solid var(--ink);padding:8px max(4px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px))}
.tab{height:48px;display:flex;align-items:center;justify-content:center;border:0;background:none;cursor:pointer;font:700 9.5px var(--f-mono);letter-spacing:.03em;text-transform:uppercase;position:relative;min-width:0;color:var(--ink)}
.tab[aria-current="page"]{background:var(--lime);color:#0a0a0a;border-radius:56% 44% 52% 48% / 48% 56% 44% 52%}
.tab .badge-n{position:absolute;top:0;right:6%;min-width:20px;height:19px;padding:0 5px;background:var(--pri-bg);color:var(--pri-fg);font-size:10px;display:grid;place-items:center;border-radius:58% 42% 55% 45% / 45% 55% 45% 55%}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--pri-bg);color:var(--pri-fg);padding:10px 18px;border-radius:var(--pill);font:700 12px var(--f-mono);max-width:calc(100% - 32px);text-align:center}
</style>

<script>
const DATA = {"units":[{"u":"The big picture","c":1,"L":[{"t":"From idea to board","s":["hs",9],"f":"flow","x":"A product goes through fixed stages: concept, requirements and specs, schematic, PCB layout, then fabrication and assembly. Each stage feeds the next.","q":[{"k":"ord","p":"Put the product stages in order.","o":["Product concept","Requirements and specifications","Circuit schematic","PCB design","Manufacturing and assembly"],"w":"Layout always comes after the schematic."}]},{"t":"The Altium walkthrough","s":["altium",1],"x":"Altium's official tutorial takes a small two-transistor astable multivibrator from idea to output files. This path follows the same order.","q":[{"k":"ord","p":"Put Altium's tutorial stages in order.","o":["Create the project and schematic","Find and acquire components","Capture the schematic","Set up design constraints","Create and configure the PCB","Place components and route","Verify the board (DRC)","Create the PCB drawing","Prepare outputs and release"],"w":"Rules are set before the PCB exists, and checks come before outputs."}]},{"t":"Mark the special nets","s":["hs",10],"x":"Before layout starts, the schematic should flag impedance-controlled lines, high-current traces and voltages. The layout designer plans placement and routing from those marks.","q":[{"k":"mc","p":"Where should impedance-controlled lines first be marked?","o":["On the schematic","On the silkscreen","In the Gerber zip","On the shipping label"],"w":"Layout decisions start from what the schematic says."}]},{"t":"What layout includes","s":["hs",10],"x":"Layout is more than drawing copper. It covers footprints, setting DRC rules (trace width, spacing, via padstacks), impedance rules, placement and routing.","q":[{"k":"ord","p":"Order these layout tasks as the guide lists them.","o":["Create component footprints","Set DRC parameters","Place components","Route"],"w":"Rules are set before you place and route."}]},{"t":"Review before you order","s":["hs",10],"x":"Before committing to manufacturing, review the design for manufacturability (DFM) and assembly (DFA).","q":[{"k":"match","p":"Match each review to what it checks.","pairs":[["DFM","Can the board be fabricated?"],["DFA","Can the board be assembled?"]],"w":"Two different shops, two different checks."}]}]},{"u":"Project and parts","c":1,"L":[{"t":"Create a PCB project","s":["altium",2],"f":"aproj","x":"File » New » Project opens the Create Project dialog. Choose <Empty> under PCB, name the project and enable Constraint Management.","q":[{"k":"mc","p":"Which command starts a new PCB project?","o":["File » New » Project","Design » Update PCB","Tools » Design Rule Check","Place » Wire"],"w":"Everything else lives inside the project."},{"k":"mc","p":"Which option should be enabled in Create Project?","o":["Constraint Management","Autorouter","3D Layout Mode","Board Planning Mode"],"w":"Rules will live in the Constraint Manager."}]},{"t":"Project and schematic files","s":["altium",2],"f":"aproj","x":"The project appears in the Projects panel as a .PrjPcb file. Right-click it » Add New to Project » Schematic adds a sheet saved as a .SchDoc.","q":[{"k":"match","p":"Match the file extension to the document.","pairs":[[".PrjPcb","PCB project"],[".SchDoc","Schematic sheet"]],"w":"The project ties the documents together."}]},{"t":"Sheet grid","s":["altium",2],"x":"In the Properties panel, pick a sheet template and set the Visible and Snap grids to 100 mil so symbol pins land on grid. Ctrl+Mouse Wheel zooms.","q":[{"k":"num","p":"What Visible/Snap grid does the tutorial set on the schematic, in mil?","v":100,"tol":0,"u":"mil","w":"A coarse grid keeps pins aligned."}]},{"t":"Search real parts","s":["altium",3],"f":"mps","x":"Open the Manufacturer Part Search panel from the Panels button and search by part number or description. The SPNs link shows supplier availability.","q":[{"k":"mc","p":"Which panel finds real manufacturer parts?","o":["Manufacturer Part Search","Messages","View Configuration","Layer Stack Manager"],"w":"Start from parts you can actually buy."},{"k":"tf","p":"The SPNs link lets you explore a part's availability.","v":true,"w":"Check stock before you design it in."}]},{"t":"Faceted search","s":["altium",3],"f":"mps","x":"Instead of typing a part number, pick a category (e.g. Connectors) and narrow with filters such as Number of Contacts, Terminal Pitch, Contact Gender and Mounting Style.","q":[{"k":"mc","p":"Which is a filter you can use to narrow connectors?","o":["Terminal Pitch","Board thickness","Solder mask colour","Gerber format"],"w":"Filters describe the part, not the board."}]},{"t":"Acquire into a component","s":["altium",3],"x":"Saving a found part creates a component of a chosen type (Transistors, Capacitors…), pulling in its parameters, models and datasheet. It opens in the Component editor, then you save it to the Workspace.","q":[{"k":"mc","p":"Where does an acquired part open for review?","o":["Component editor","Gerber viewer","Draftsman","Messages panel"],"w":"Check the data before saving it."}]}]},{"u":"Capture the schematic","c":1,"L":[{"t":"Place parts","s":["altium",4],"x":"While a part is floating on the cursor, press Tab to open Properties and set its Designator, Spacebar to rotate and X to flip. Click to place, Esc to finish.","q":[{"k":"match","p":"Match the key to its action while placing.","pairs":[["Tab","Open Properties"],["Spacebar","Rotate"],["X","Flip horizontally"],["Esc","Exit placement"]],"w":"Set properties before the click."}]},{"t":"Wire it","s":["altium",4],"x":"Place » Wire (Ctrl+W). Click a pin to start and click the next pin to connect. Backspace removes the last anchor; Spacebar toggles the corner.","q":[{"k":"mc","p":"Which shortcut starts a wire in the schematic?","o":["Ctrl+W","Ctrl+E","Shift+R","Tab"],"w":"Place » Wire."},{"k":"mc","p":"While wiring, what does Backspace do?","o":["Removes the last anchor","Deletes the sheet","Rotates the part","Runs DRC"],"w":"Undo just the last click."}]},{"t":"Net labels","s":["altium",4],"f":"netlabel","x":"Place » Net Label, press Tab to type the Net Name (e.g. 12V, GND). A red cross on the cursor means the label is over a wire and will connect to it.","q":[{"k":"tap","p":"Tap the label that will connect to the wire.","scene":"netlabel","hit":"onwire","w":"The red cross shows a live connection."}]},{"t":"Catch unconnected pins","s":["altium",4],"x":"In Project Options, the Connection Matrix decides which pin situations are errors. The tutorial changes it so unconnected passive pins get reported.","q":[{"k":"mc","p":"What does the tutorial make the connection matrix detect?","o":["Unconnected passive pins","Silkscreen overlap","Trace width","Board thickness"],"w":"A floating resistor pin is almost always a mistake."}]},{"t":"Validate the project","s":["altium",4],"x":"Right-click the project » Validate PCB Project. A clean result reads \"Compile successful, no errors found\".","q":[{"k":"mc","p":"Which command checks the schematic for errors?","o":["Validate PCB Project","Update PCB Document","Export Gerbers","3D Layout Mode"],"w":"Fix the schematic before going to layout."}]},{"t":"The Messages panel","s":["altium",4],"x":"Errors and warnings land in the Messages panel. It only pops up by itself when there are errors; double-click a message to jump to the problem.","q":[{"k":"tf","p":"The Messages panel opens on its own even when there are only warnings.","v":false,"w":"Open it from the Panels button to see warnings."}]}]},{"u":"Set the rules","c":1,"L":[{"t":"The Constraint Manager","s":["altium",5],"f":"constraints","x":"Design » Constraint Manager holds the board's rules. It opens on the Clearances view; widths and via styles are in the Physical view.","q":[{"k":"mc","p":"Where are design constraints configured?","o":["Constraint Manager","Messages panel","Draftsman","Projects panel"],"w":"One place for every rule."}]},{"t":"Clearance","s":["altium",5],"f":"constraints","x":"Set clearance in the All Nets / All Nets cell. The tutorial uses 0.25 mm between all objects.","q":[{"k":"num","p":"Clearance the tutorial sets between all objects, in mm?","v":0.25,"tol":0,"u":"mm","w":"Entered in the All Nets / All Nets cell."}]},{"t":"A power net class","s":["altium",5],"x":"Select the 12V and GND rows and add them to a new class called Power. Give it wider tracks than everything else.","q":[{"k":"match","p":"Match the class to its preferred track width.","pairs":[["All Nets","0.25 mm"],["Power","0.5 mm"]],"w":"Power nets carry more current."}]},{"t":"Via style","s":["altium",5],"x":"In the Physical view, set the All Nets via style: diameter 1, hole 0.6, in the units set earlier (mm). The router uses it whenever it drops a via.","q":[{"k":"num","p":"Via diameter 1.0, hole 0.6 (mm). Annular ring = (diameter − hole) ÷ 2, in mm?","v":0.2,"tol":0.001,"u":"mm","w":"(1.0 − 0.6) ÷ 2 = 0.2 mm."}]}]},{"u":"Board and stack-up","c":1,"L":[{"t":"Add the PCB document","s":["altium",6],"x":"Right-click the project » Add New to Project » PCB, then Save As (e.g. Multivibrator.PcbDoc) and save the project, because the project changed.","q":[{"k":"tf","p":"After adding a PCB document you should save the project too.","v":true,"w":"Adding a document changes the project."}]},{"t":"Origin and units","s":["altium",6],"f":"origin","x":"Edit » Origin » Set, then click the board's bottom-left corner. View » Toggle Units switches between mil and mm.","q":[{"k":"tap","p":"Tap where the tutorial puts the origin.","scene":"origin","hit":"bl","w":"Bottom-left makes every coordinate positive."}]},{"t":"Board shape","s":["altium",6],"f":"origin","x":"The default board is 6 × 4 inches. In Board Planning Mode (key 1), Design » Edit Board Shape lets you drag edges; the tutorial makes it 30 × 30 mm. Key 2 returns to 2D and key 3 opens 3D.","q":[{"k":"match","p":"Match the key to the view mode.","pairs":[["1","Board Planning Mode"],["2","2D Layout Mode"],["3","3D Layout Mode"]],"w":"Three numbers, three views."},{"k":"num","p":"Tutorial board size: 30 × 30 mm. Area in mm²?","v":900,"tol":0,"u":"mm²","w":"30 × 30 = 900 mm²."}]},{"t":"Send the design to the PCB","s":["altium",6],"f":"eco","x":"From the schematic, Design » Update PCB Document opens an Engineering Change Order. Validate Changes, check for green ticks, then Execute Changes. Parts arrive outside the board.","q":[{"k":"ord","p":"Order the ECO steps.","o":["Design » Update PCB Document","Validate Changes","Check every change has a green tick","Execute Changes"],"w":"Validate before you execute."},{"k":"tf","p":"After the ECO, components arrive already placed on the board.","v":false,"w":"They sit outside the board, ready for placement."}]},{"t":"The default stack","s":["altium",6],"f":"stack2","x":"Design » Layer Stack Manager shows the default stack: overlay, solder mask, copper, a dielectric core, copper, solder mask, overlay. A board this simple can be routed double-sided with through-hole vias.","q":[{"k":"ord","p":"Order the default stack from top to bottom.","o":["Top Overlay","Top Solder","Top Layer","Dielectric core","Bottom Layer","Bottom Solder","Bottom Overlay"],"w":"Mirror image about the core."}]}]},{"u":"Place and route","c":1,"L":[{"t":"Connection lines","s":["altium",7],"x":"Drag parts onto the board; Spacebar rotates in 90° steps. The connection lines (ratsnest) re-optimise as you move, so use them to cut crossovers.","q":[{"k":"tf","p":"Connection lines update as you move a component.","v":true,"w":"Watch them shrink as you improve placement."}]},{"t":"Interactive routing","s":["altium",7],"f":"route","x":"Pick the Top Layer tab, then Route » Interactive Routing (Ctrl+W). Click a pad to anchor; hatched segments are a preview and become solid when clicked.","q":[{"k":"mc","p":"Hatched track segments are…","o":["A preview not yet placed","Errors","Copper pours","Keep-outs"],"w":"Click to commit them as solid copper."}]},{"t":"Router settings","s":["altium",7],"x":"In Preferences » PCB Editor » Interactive Routing, set conflict resolution to Walkaround Obstacles and both width sources to Rule Preferred, so tracks follow the Constraint Manager.","q":[{"k":"tf","p":"With Rule Preferred, track width comes from your constraints.","v":true,"w":"Rules drive the router."}]},{"t":"Switching layers","s":["altium",7],"f":"route","x":"While routing, press * on the numeric keypad to switch to the next signal layer. A via is added automatically using your via style.","q":[{"k":"mc","p":"What happens when you switch layers mid-route?","o":["A via is added using the via style rule","The track is deleted","DRC runs","The board flips over"],"w":"The rule you set earlier decides the via."}]},{"t":"Routing shortcuts","s":["altium",7],"x":"A few keys make routing fast.","q":[{"k":"match","p":"Match the key to its action while routing.","pairs":[["Backspace","Rip up the last segment"],["Ctrl+Click","Auto-complete the connection"],["Shift+Spacebar","Cycle corner modes"],["Shift+R","Cycle conflict modes"]],"w":"Shift+F1 shows the full list."}]},{"t":"Check it in 3D","s":["altium",7],"x":"View » 3D Layout Mode (key 3) shows the board in 3D. Shift+right-drag rotates it.","q":[{"k":"mc","p":"Which key switches to 3D?","o":["3","1","2","X"],"w":"1 planning, 2 for 2D, 3 for 3D."}]}]},{"u":"Check the board","c":1,"L":[{"t":"Online vs batch DRC","s":["altium",8],"x":"Online DRC flags violations as you edit. A batch DRC (Tools » Design Rule Check) tests the whole design and writes a report.","q":[{"k":"match","p":"Match the check to when it runs.","pairs":[["Online DRC","Continuously, while you work"],["Batch DRC","On demand, with a report"]],"w":"Use both."}]},{"t":"Run the batch DRC","s":["altium",8],"x":"In the Design Rule Checker, enable Create Report File and run it. Violations appear in the Messages panel; double-click one to jump to it.","q":[{"k":"mc","p":"Where are batch DRC violations listed?","o":["Messages panel","Projects panel","Draftsman","Layer Stack Manager"],"w":"Double-click to cross-probe."}]},{"t":"Solder mask slivers","s":["altium",8],"f":"sliver","x":"Mask openings around close pads can leave a thin strip of mask between them: a sliver. The tutorial fixes these in the Constraint Manager rules.","q":[{"k":"tap","p":"Tap the solder mask sliver.","scene":"sliver","hit":"sliver","w":"A thin strip of mask can flake off."}]},{"t":"A clean report","s":["altium",8],"x":"After fixing, rerun DRC. Don't move on until the report shows no rule violations.","q":[{"k":"tf","p":"It's fine to release with a few DRC violations left.","v":false,"w":"Clean report first."}]}]},{"u":"Drawings and outputs","c":1,"L":[{"t":"The Draftsman drawing","s":["altium",9],"f":"draftsman","x":"Add New to Project » Draftsman Document creates a .PCBDwf. Place an assembly view, top and bottom fabrication views, an isometric view and a layer stack legend.","q":[{"k":"mc","p":"Which is a view you place in Draftsman?","o":["Board Fabrication View","Connection Matrix","Manufacturer Part Search","Interactive Routing"],"w":"Draftsman makes the fab and assembly drawings."}]},{"t":"Annotate the drawing","s":["altium",9],"f":"draftsman","x":"Add linear dimensions to the board edges, BOM callouts that point to parts, and a Bill of Materials table.","q":[{"k":"match","p":"Match the annotation to its job.","pairs":[["Linear Dimension","Board size"],["Callout","Points to a part"],["Bill Of Materials","Parts table"]],"w":"The drawing answers questions the Gerbers can't."}]},{"t":"Output Job files","s":["altium",10],"f":"outjob","x":"An OutJob (.OutJob) stores settings for every output. The tutorial makes two: Fabrication (Gerber, NC Drill, DRC report) and Assembly (BOM, Draftsman PDF, pick and place).","q":[{"k":"match","p":"Match each output to its OutJob.","pairs":[["Gerber files","Fabrication"],["NC Drill","Fabrication"],["Pick and place","Assembly"],["Bill of Materials","Assembly"]],"w":"Fab builds the bare board; assembly populates it."}]},{"t":"Don't forget drill files","s":["altium",10],"x":"Gerbers describe layers. Holes go in a separate NC Drill output, so add both.","q":[{"k":"tf","p":"Gerber files alone describe the board's holes.","v":false,"w":"Add an NC Drill output."}]},{"t":"Release with checks","s":["altium",10],"x":"Project Releaser runs the OutJobs in stages: configure, validate, generate, review, upload. A failed validation such as DRC stops the release. Each release archives a snapshot of the design source.","q":[{"k":"tf","p":"A failed DRC validation stops the release.","v":true,"w":"Fix it, then release again."},{"k":"mc","p":"What is archived with each release?","o":["A snapshot of the design source","Only the BOM","Nothing","Only screenshots"],"w":"You can always rebuild exactly what shipped."}]}]},{"u":"What the fab needs","c":2,"L":[{"t":"Fab notes","s":["fab",5],"x":"Fab notes are the designer's written manufacturing requirements: materials, tolerances, surface finish, compliance standards and IPC class. They cover what the layer data alone doesn't say.","q":[{"k":"mc","p":"What do fab notes add?","o":["Requirements not captured in Gerber or CAD data","A copy of the schematic","Component prices","The rats nest"],"w":"Gerbers show shapes; notes state requirements."}]},{"t":"The fab drawing","s":["fab",6],"x":"The fab drawing is the graphical blueprint. It shows the outline with X-Y dimensions, a drill chart, plated and non-plated holes, cut-outs, stack-up, fiducials, tolerances, finish and impedance needs.","q":[{"k":"mc","p":"Which belongs on a fabrication drawing?","o":["A drill chart with hole sizes and quantities","The BOM prices","Pick-and-place rotations","Firmware version"],"w":"The drill chart is a core part of the drawing."}]},{"t":"The drawing is the contract","s":["fab",7],"x":"Fabricators quote and build to the drawing and notes. Keep both synchronised and update them with every design revision.","q":[{"k":"tf","p":"If the drawing is out of date, the fab may still build exactly what it shows.","v":true,"w":"The drawing is a contractual reference."}]},{"t":"Gerber RS-274X","s":["fab",7],"x":"Gerber (RS-274X) is the traditional standard. It uses a separate file for each layer (copper, mask, silkscreen) plus drill data and possibly outline data.","q":[{"k":"tf","p":"Gerber data uses a separate file for each layer.","v":true,"w":"One file per copper, mask and silkscreen layer."}]},{"t":"IPC-2581 in one file","s":["fab",10],"x":"IPC-2581 packs stack-up, netlist, BOM and XY data into one package. The guide recommends it when available because it reduces misalignment between files.","q":[{"k":"mc","p":"Why does the guide recommend IPC-2581?","o":["It integrates stack-up, netlist, BOM and XY data in one package","It is the oldest format","It is image-only","It needs no drill data"],"w":"One package means fewer mismatched files."}]},{"t":"The fab file checklist","s":["fab",10],"x":"Besides layer data, send NC drill (Excellon), fab and drill drawings, the stack-up, a netlist (IPC-356), a stencil file and test point reports.","q":[{"k":"match","p":"Match each file to its job.","pairs":[["NC drill (Excellon)","Hole locations, sizes and types"],["Stencil file","Making solder paste stencils"],["Netlist (IPC-356)","Testing the bare board's connectivity"]],"w":"Each file answers a different shop question."}]}]},{"u":"Writing fab notes","c":2,"L":[{"t":"Call out IPC-4101","s":["fab",12],"x":"FR4 varies widely between makers. Instead of a brand name, call out an IPC-4101 slash sheet such as /126. It defines Dk, Df and Tg so the fab can pick an equivalent.","q":[{"k":"mc","p":"Why use an IPC-4101 slash sheet instead of just \"FR4\"?","o":["FR4 varies widely; the slash sheet defines exact properties","Slash sheets are cheaper","FR4 is banned","It removes the need for a stack-up"],"w":"A spec beats a generic name."}]},{"t":"Impedance callouts","s":["fab",13],"x":"For each controlled-impedance trace, state the target (e.g. 50 Ω), tolerance (±5% or ±10%), model (microstrip, stripline, differential pair), width and dielectric, the layer, and whether a TDR coupon is needed.","q":[{"k":"mc","p":"Which is NOT part of an impedance callout?","o":["Silkscreen colour","Target impedance","Tolerance","Layer"],"w":"Colour has nothing to do with impedance."}]},{"t":"Board thickness","s":["fab",14],"x":"State the finished board thickness and copper weight per layer, plus minimum trace width and spacing. A common thickness is 1.6 mm, which is 62 mil.","q":[{"k":"num","p":"A 1.6 mm board is about how many mil thick?","v":62,"tol":1,"u":"mil","w":"1.6 mm ≈ 62 mil."}]},{"t":"Drill aspect ratio","s":["fab",15],"x":"Keep the hole depth-to-diameter ratio within the fab's capability, for example ≤10:1 for standard processes.","q":[{"k":"num","p":"At 10:1, what is the smallest drill (mm) through a 1.6 mm board?","v":0.16,"tol":0.005,"u":"mm","w":"1.6 ÷ 10 = 0.16 mm."}]},{"t":"Plated vs non-plated","s":["fab",15],"x":"The drill chart lists hole count, size, tolerance and type. Mark plated and non-plated holes with separate symbols so they aren't confused.","q":[{"k":"tf","p":"Plated and non-plated holes should share one drill symbol.","v":false,"w":"Separate symbols prevent misreading."}]},{"t":"Solder mask notes","s":["fab",18],"x":"State the mask type (e.g. LPI), colour, thickness (typically 0.8 mil), opening tolerances and registration, and where mask must be removed.","q":[{"k":"mc","p":"Typical standard solder mask thickness?","o":["0.8 mil","8 mil","80 mil","0.008 mil"],"w":"Mask is a thin coating."}]},{"t":"Silkscreen off pads","s":["fab",20],"x":"Silkscreen ink is non-conductive and permanent. Keep it off pads and vias unless the notes say otherwise.","q":[{"k":"tf","p":"Silkscreen may cover pads by default.","v":false,"w":"Ink on a pad blocks solder."}]},{"t":"Tented vias","s":["fab",20],"x":"A tented via is covered by solder mask to prevent solder bridging or contamination. State whether one or both sides are tented and the IPC-4761 type (Type I or II).","q":[{"k":"mc","p":"What covers a tented via?","o":["Solder mask","Copper plating","Silkscreen","Epoxy fill"],"w":"Tenting means mask over the hole."}]},{"t":"Plugged vias","s":["fab",21],"x":"Plugged vias stop solder from wicking into the hole during assembly. IPC-4761 calls these Type III and Type IV.","q":[{"k":"mc","p":"Why plug a via?","o":["To prevent solder ingress during assembly","To raise impedance","To add a test point","To make it a mounting hole"],"w":"A plug keeps solder on the pad."}]},{"t":"Via-in-pad callout","s":["fab",23],"x":"Via-in-pad under BGAs and QFNs is filled (often non-conductive epoxy), planarised and copper-capped so the pad is flat for soldering. IPC-4761 calls it Type VII.","q":[{"k":"mc","p":"Which IPC-4761 type is via-in-pad (filled and capped)?","o":["Type VII","Type I","Type III","Type II"],"w":"Type VII: filled and capped."}]},{"t":"Surface finishes","s":["fab",24],"x":"The finish protects exposed copper. Each has trade-offs.","q":[{"k":"match","p":"Match each finish to its note.","pairs":[["HASL","Cheap, not ideal for fine pitch"],["ENIG","Flat; suits BGAs and RF"],["ENEPIG","Wire bonding and soldering"],["Immersion tin","Can grow tin whiskers"]],"w":"Pick the finish for the parts you use."},{"k":"mc","p":"Which finish is noted as sensitive to humidity?","o":["Immersion silver","ENIG","HASL","ENEPIG"],"w":"ImAg suits high-speed boards but dislikes humidity."}]},{"t":"Bow and twist limits","s":["fab",25],"f":"bowtwist","x":"Bow is a curve along the board's long axis. Twist is warping across the board. Too much of either causes assembly problems, so set limits.","q":[{"k":"match","p":"Match the term to the shape.","pairs":[["Bow","Curve along the long axis"],["Twist","Warping across the board"]],"w":"Both are measured against a flat reference plane."}]},{"t":"IPC class and addenda","s":["fab",26],"x":"IPC class 2 is consumer electronics; class 3 is high reliability. IPC-6012 addenda add rules: ES for space and military, EM for medical, EA for automotive.","q":[{"k":"match","p":"Match the IPC-6012 addendum to its field.","pairs":[["ES","Space and military"],["EM","Medtech"],["EA","Automotive"]],"w":"S, M, A: space, medical, automotive."},{"k":"mc","p":"Which IPC class is for high-reliability products?","o":["Class 3","Class 2","Class 1","Class 0"],"w":"Class 3: medical, aerospace, defence."}]},{"t":"Bare-board electrical test","s":["fab",26],"x":"State whether 100% bare-board electrical test is required and which method: flying probe or bed-of-nails. Add Hi-Pot or impedance tests if needed.","q":[{"k":"match","p":"Match the test method to how it touches the board.","pairs":[["Flying probe","Moving probes"],["Bed-of-nails","Fixed fixture of pins"]],"w":"Both check opens and shorts."}]},{"t":"Write measurable notes","s":["fab",62],"x":"Good notes are measurable (\"soldermask thickness: 0.8 mil minimum\"), organised, free of contradictions, matched to the fab's capabilities and tied to IPC standards.","q":[{"k":"mc","p":"Which is a good fab note?","o":["Soldermask thickness: 0.8 mil minimum","Use high quality mask","Standard process","Make it good"],"w":"Numbers remove guesswork."}]}]},{"u":"The assembly package","c":2,"L":[{"t":"Fab vs assembly notes","s":["fab",37],"x":"Fab notes tell the fab house how to build the bare board. Assembly notes tell the assembly shop how to place and solder parts.","q":[{"k":"match","p":"Match each document to its files.","pairs":[["Fab notes","Gerber, IPC-2581, ODB++, fab drawing"],["Assembly notes","BOM, XY files, assembly drawing"]],"w":"Different audience, different files."}]},{"t":"Keep them separate","s":["fab",38],"x":"Keep fab and assembly notes in separate sections or documents so each team reads the right one.","q":[{"k":"tf","p":"Mixing fab and assembly notes together reduces confusion.","v":false,"w":"Separate them for the right audience."}]},{"t":"Pick-and-place files","s":["fab",39],"x":"Pick-and-place (centroid) files give the exact location and rotation of every surface-mount part. Automated assembly machines are programmed from them.","q":[{"k":"mc","p":"Another name for a pick-and-place file?","o":["Centroid file","Gerber file","Drill file","Stencil file"],"w":"Centroid = the part's centre point."}]},{"t":"What a netlist is for","s":["fab",40],"x":"A netlist lists which pins connect to which. It is used for electrical testing (flying probe, ICT), checking continuity and finding opens and shorts.","q":[{"k":"mc","p":"Which is a use of the netlist?","o":["Detecting opens and shorts","Choosing mask colour","Setting reflow profile","Ordering stencils"],"w":"Testers compare the board to the netlist."}]},{"t":"BOM fields","s":["fab",53],"x":"A BOM line has item no., reference designators, quantity, description, manufacturer, MPN, package, DNI/DNP, value and comments. The MPN is the exact part identifier.","q":[{"k":"mc","p":"What is the MPN?","o":["The manufacturer's exact part identifier","The PCB's revision","The netlist format","A test method"],"w":"MPN = manufacturer part number."}]},{"t":"DNI / DNP parts","s":["fab",55],"x":"Don't just delete do-not-install parts from the BOM. If they still appear in the schematic or layout, a missing BOM line causes confusion.","q":[{"k":"tf","p":"Delete DNP parts from the BOM to keep it clean.","v":false,"w":"Mark them; don't delete them."}]},{"t":"Orientation and polarity","s":["fab",42],"x":"Wrong orientation is one of the most common causes of field failures and rework. State orientation clearly, for example pin 1 marked with a dot on the silkscreen.","q":[{"k":"mc","p":"How is pin 1 commonly marked?","o":["A dot on the silkscreen","A drill hole","A copper pour","It isn't marked"],"w":"A clear mark stops parts going in backwards."}]},{"t":"Fiducials","s":["fab",56],"f":"fiducial","x":"Fiducials are copper marks that vision systems use to align the board. Use at least three global fiducials and two local ones (diagonal) near fine-pitch or BGA parts.","q":[{"k":"num","p":"Minimum number of global fiducials per board or panel?","v":3,"tol":0,"u":"","w":"The guide asks for at least three, plus two local ones near fine-pitch parts."}]},{"t":"Fiducial size","s":["fab",57],"x":"Make fiducials 1.0 mm bare copper circles with 2.0 mm clearance, away from components and free of silkscreen.","q":[{"k":"num","p":"Fiducial diameter in mm?","v":1.0,"tol":0,"u":"mm","w":"1.0 mm copper, 2.0 mm clearance."}]},{"t":"Tooling holes","s":["fab",58],"x":"Tooling holes are non-plated holes for aligning the board in fixtures. Two or three are used so the board can't rotate.","q":[{"k":"mc","p":"Why use two or three tooling holes?","o":["To prevent rotation","To carry current","To vent gases","For decoration"],"w":"One pin lets it spin; two lock it."}]},{"t":"V-score","s":["fab",59],"f":"vscore","x":"V-scoring cuts partway into the panel from the top and bottom so boards snap apart. Routing with breakaway tabs (mouse bites) is the alternative.","q":[{"k":"tf","p":"V-scoring cuts partway through from both sides.","v":true,"w":"Then the boards snap apart."}]}]},{"u":"What a board is made of","c":3,"L":[{"t":"Three ingredients","s":["mat",4],"x":"Every rigid board is built from three materials: prepreg, copper foil and copper-clad laminate (the core).","q":[{"k":"match","p":"Match each material to what it is.","pairs":[["Prepreg","Glass cloth in resin that is not fully cured"],["Copper foil","The conductive layer that is etched into traces"],["Core","Prepreg and foil already laminated and cured"]],"w":"Prepreg bonds layers, foil becomes traces, cores are pre-cured laminates."}]},{"t":"Prepreg is B-stage","s":["mat",4],"x":"Prepreg is woven glass soaked in resin that is only partly cured (B-stage). It is tacky, so it bonds laminates and foils together during lamination.","q":[{"k":"mc","p":"Why can prepreg bond layers together?","o":["Its resin is not fully cured","It is pure copper","It is fully cured epoxy","It is coated in solder"],"w":"Partly cured resin flows and cures during lamination, gluing the stack."}]},{"t":"Traces come from etching","s":["mat",4],"x":"Traces are what is left after copper foil is selectively etched away. On multilayer boards, plated drilled holes connect the layers.","q":[{"k":"tf","p":"Copper traces are formed by selectively etching copper foil.","v":true,"w":"The unwanted copper is etched off; the traces remain."}]},{"t":"How a core is made","s":["mat",5],"x":"Glass fibre is woven into cloth, soaked in epoxy and semi-cured into prepreg plies. Several plies plus outer copper foils are laminated into a copper-clad core.","q":[{"k":"ord","p":"Put the core-making steps in order.","o":["Weave glass fibre into cloth","Impregnate cloth with epoxy and semi-cure it","Bond prepreg plies with copper foils"],"w":"Cloth, then prepreg, then a laminated core."}]},{"t":"Glass styles","s":["mat",5],"x":"Prepregs are sold by glass style number. Common ones include 1080, 7628, 2116, 2113 and 2165.","q":[{"k":"mc","p":"Which is a common prepreg glass style?","o":["7628","0402","FR-1","6061"],"w":"7628 is one of the styles the guide lists; 0402 is a component size."}]}]},{"u":"Thermal properties","c":3,"L":[{"t":"Glass transition (Tg)","s":["mat",6],"x":"Tg is the temperature range where the substrate goes from rigid and glassy to soft and deformable. It recovers when it cools back down.","q":[{"k":"mc","p":"What happens to a substrate above its Tg?","o":["It softens and becomes deformable","It melts into liquid","It decomposes permanently","It becomes a conductor"],"w":"Above Tg the resin softens; it only flows as a liquid above the melting temperature."}]},{"t":"Decomposition (Td)","s":["mat",6],"x":"Td is where the material chemically breaks down, defined as losing at least 5% of its mass. Unlike Tg, the damage is not reversible.","q":[{"k":"mc","p":"How is decomposition temperature defined?","o":["The material loses at least 5% of its mass","The resin softens","Copper starts to oxidise","Solder melts"],"w":"Td is a mass-loss threshold, and its effects are permanent."},{"k":"tf","p":"Like Tg, the changes at Td reverse when the board cools.","v":false,"w":"Td changes are permanent; Tg changes reverse."}]},{"t":"Td vs soldering heat","s":["mat",6],"x":"Assembly soldering typically runs 200-250°C, so Td must sit above that. Most materials have a Td above 320°C.","q":[{"k":"mc","p":"What is the typical soldering temperature range during assembly?","o":["200-250°C","100-150°C","320-400°C","50-80°C"],"w":"The guide gives 200-250°C, well below the >320°C Td of most materials."}]},{"t":"Expansion (CTE)","s":["mat",7],"x":"Woven glass holds X and Y expansion to about 10-20 ppm/°C, so the board grows mostly in Z. Z-axis CTE should be as low as possible.","q":[{"k":"mc","p":"About how much does a board expand in X and Y?","o":["10-20 ppm/°C","100-200 ppm/°C","0.1-0.2 ppm/°C","1000 ppm/°C"],"w":"Glass weave constrains X and Y to roughly 10-20 ppm/°C."},{"k":"tf","p":"Because X and Y are constrained, the material expands mainly in the Z direction.","v":true,"w":"That Z growth is what stresses plated holes."}]},{"t":"Copper moves heat","s":["mat",8],"x":"PCB dielectrics conduct only 0.3-0.6 W/m°C, while copper conducts 386 W/m°C. Copper planes carry heat away far faster than the laminate.","q":[{"k":"num","p":"Copper's thermal conductivity is about how many W/m°C?","v":386,"tol":5,"u":"W/m°C","w":"386 W/m°C, roughly 1000 times a typical dielectric."}]}]},{"u":"Electrical properties","c":3,"L":[{"t":"Dielectric constant (Dk)","s":["mat",8],"x":"Dk (Er) is the material's permittivity relative to vacuum. Most PCB materials sit between 2.5 and 4.5, and Dk generally falls as frequency rises.","q":[{"k":"mc","p":"What Dk range covers most PCB materials?","o":["2.5-4.5","10-20","0.5-1.0","50-100"],"w":"Most laminates fall between 2.5 and 4.5."},{"k":"tf","p":"Dk generally decreases as frequency increases.","v":true,"w":"Good high-frequency materials keep Dk nearly flat across frequency."}]},{"t":"Loss tangent (Df)","s":["mat",8],"x":"Df measures power lost in the dielectric. Higher Df means more loss; values run from about 0.001 to 0.030 and rise with frequency.","q":[{"k":"mc","p":"A laminate with a higher Df will have…","o":["More dielectric loss","Less dielectric loss","Higher thermal conductivity","Thicker copper"],"w":"Df is a direct measure of dielectric loss."}]},{"t":"Two kinds of loss","s":["mat",10],"x":"Signal loss in a board has two parts: dielectric loss (molecules vibrating in the field) and copper loss (current crowding in the conductor). Both grow with frequency.","q":[{"k":"match","p":"Match each loss to its cause.","pairs":[["Dielectric loss","Polarised molecules vibrating in the field"],["Copper loss","Current flowing in a thin skin of the conductor"]],"w":"Lower Df cuts dielectric loss; wider, smoother copper cuts copper loss."}]},{"t":"Skin depth","s":["mat",12],"x":"At high frequency, current crowds into the conductor's surface. In copper the skin depth is about 65 µm at 1 MHz but only 2.1 µm at 1 GHz.","q":[{"k":"mc","p":"About how deep does current flow in copper at 1 GHz?","o":["2.1 µm","65 µm","65 mm","0.29 mm"],"w":"Skin depth shrinks with frequency: 65 µm at 1 MHz, 2.1 µm at 1 GHz."}]},{"t":"Smooth copper, less loss","s":["mat",13],"x":"Rough copper makes high-frequency current follow a longer, bumpy path. Low-profile copper with good adhesion reduces that loss.","q":[{"k":"mc","p":"What copper reduces high-frequency conductor loss?","o":["Low-profile copper","Extra-rough copper","Nickel-plated copper","Thinner, rougher foil"],"w":"Smoother copper shortens the path the skin current travels."}]}]},{"u":"Choosing a laminate","c":3,"L":[{"t":"Speed classes","s":["mat",22],"x":"Sierra groups laminates by speed and loss: normal (0-3 GHz), medium (1-10 GHz), high speed/low loss (10-30 GHz), and very high speed/RF (20-60 GHz).","q":[{"k":"match","p":"Match each material class to its frequency range.","pairs":[["Normal speed, normal loss","0-3 GHz"],["Medium speed, medium loss","1-10 GHz"],["High speed, low loss","10-30 GHz"],["Very high speed (RF)","20-60 GHz"]],"w":"Higher-speed classes have flatter Dk and lower loss."}]},{"t":"FR-4 is lossiest","s":["mat",14],"x":"Standard FR-4 is easy to process and fits most work, but it is the lossiest family. Low-loss options include Isola I-Speed, Astra and Tachyon.","q":[{"k":"tf","p":"Standard FR-4 is among the lowest-loss laminates available.","v":false,"w":"FR-4 is the lossiest family the guide shows."}]},{"t":"Copper weights","s":["mat",17],"x":"Copper foil typically ranges from 0.25 oz (0.3 mil) to 5 oz (7 mil). Electronic-grade foil is about 99.7% pure.","q":[{"k":"mc","p":"What is the typical copper foil thickness range?","o":["0.25 oz to 5 oz","5 oz to 20 oz","0.01 oz to 0.1 oz","Always exactly 1 oz"],"w":"0.25 oz (0.3 mil) to 5 oz (7 mil)."}]},{"t":"ED vs rolled copper","s":["mat",17],"x":"Electro-deposited copper has a vertical grain and rougher surface and is used in rigid boards. Rolled copper has a horizontal grain and smoother surface, ideal for flex.","q":[{"k":"match","p":"Match each copper type to its typical use.","pairs":[["Electro-deposited","Rigid boards"],["Rolled","Flex and rigid-flex boards"]],"w":"Rolled copper's grain survives repeated bending better."}]},{"t":"Watch out for CAF","s":["mat",19],"x":"Conductive anodic filament (CAF) is a metal filament that grows by electrochemical migration and can short a board. CAF-resistant material is one of the best defences.","q":[{"k":"mc","p":"What is CAF?","o":["A metal filament grown by electrochemical migration","A type of solder flux","A copper foil grade","A drill bit coating"],"w":"CAF filaments can bridge conductors and cause failures."}]},{"t":"Moisture absorption","s":["mat",19],"x":"Prefer low moisture absorption. Most laminates absorb 0.01% to 0.20% of their weight in water under test conditions.","q":[{"k":"mc","p":"What moisture absorption range is typical?","o":["0.01%-0.20%","5%-10%","20%-30%","0%"],"w":"The guide quotes 0.01% to 0.20%."}]},{"t":"Tg for hot boards","s":["mat",21],"x":"Pick a laminate whose Tg is at least the board's maximum operating temperature. For a 200°C operating temperature, Tg must be 200°C or more.","q":[{"k":"num","p":"A board runs at 170°C. What is the minimum Tg in °C by this rule?","v":170,"tol":0,"u":"°C","w":"Tg must be greater than or equal to the maximum operating temperature."}]},{"t":"Base material standards","s":["mat",25],"x":"IPC base-material specs: IPC-4101 for rigid and multilayer, IPC-4103 for high-speed/high-frequency, IPC/JPCA-4104 for HDI and microvia, IPC-4204 for flexible metal-clad.","q":[{"k":"match","p":"Match each IPC spec to its material.","pairs":[["IPC-4101","Rigid and multilayer base materials"],["IPC-4103","High-speed/high-frequency materials"],["IPC-4104","HDI and microvia materials"],["IPC-4204","Flexible metal-clad materials"]],"w":"These are the four specs the guide explains."}]}]},{"u":"Stack-up basics","c":4,"L":[{"t":"What a stack-up is","s":["stack",6],"x":"A stack-up (build-up) is the ordered arrangement of copper and dielectric layers. It tells the fabricator material thicknesses, copper weights, prepreg types and overall board thickness.","q":[{"k":"tap","p":"In this foil-construction stack-up, tap the core.","scene":"foilbuild","hit":"core","w":"Foil construction puts foil and prepreg on both sides of a central core."}]},{"t":"What to specify","s":["stack",6],"x":"When you define a stack-up, state the construction type, core and prepreg thicknesses, copper weight, impedance requirements, and which layers are signal, power or ground.","q":[{"k":"mc","p":"Which item belongs in a stack-up definition?","o":["Controlled impedance requirements","The schematic font","The BOM supplier","The enclosure colour"],"w":"Impedance targets drive dielectric and trace choices."}]},{"t":"Ounces to mils","s":["stack",7],"x":"Copper weight is ounces per square foot. One ounce spread over one square foot is 1.4 mil thick, so 2 oz is 2.8 mil and 3 oz is 4.2 mil.","q":[{"k":"num","p":"How thick is 4 oz copper, in mils?","v":5.6,"tol":0.05,"u":"mil","w":"4 × 1.4 mil = 5.6 mil, matching the guide's table."}]},{"t":"Prepreg resin content","s":["stack",9],"x":"Prepreg comes in high-resin (HR), medium-resin (MR) and standard-resin (SR) types. Resin content changes both final thickness and dielectric constant.","q":[{"k":"mc","p":"What does a prepreg's resin content affect?","o":["Final thickness and dielectric constant","Only its colour","Copper purity","Drill bit life only"],"w":"Fabs model impedance using the Dk shift that resin content causes."}]},{"t":"Same glass, different Dk","s":["stack",10],"x":"In Isola 370HR, a 106 prepreg at 71% resin is 2 mil thick with Dk 3.63, while 2116 at 56% resin is 4.8 mil with Dk 3.92. More resin, lower Dk.","q":[{"k":"tf","p":"In the 370HR table, the higher-resin prepreg has the lower Dk.","v":true,"w":"Resin has a lower Dk than glass, so more resin pulls Dk down."}]},{"t":"Resin starvation","s":["stack",11],"x":"Resin starvation means too little resin to wet the glass during lamination. It causes voids, weak bonding and poor reliability; causes include low resin content and bad press conditions.","q":[{"k":"mc","p":"What can resin starvation cause?","o":["Voids and weak layer bonding","Thicker copper","Lower Dk only","Better adhesion"],"w":"Unfilled gaps become voids and delamination risks."}]},{"t":"Core vs prepreg thickness","s":["stack",13],"x":"A core is already cured, so its dielectric thickness stays the same after lamination. Prepreg is semi-cured and changes thickness in the press.","q":[{"k":"tf","p":"Prepreg keeps exactly its datasheet thickness after lamination.","v":false,"w":"Prepreg flows and compresses; fabs use pressed-out thickness for impedance."}]}]},{"u":"Dielectric numbers","c":4,"L":[{"t":"FR-4 vs Rogers","s":["stack",14],"x":"Isola 370HR (FR-4) has Dk 3.92 and Df 0.0250. Rogers 4350B has Dk 3.48 and Df 0.0037, far lower loss.","q":[{"k":"match","p":"Match each material to its Df.","pairs":[["370HR (FR-4)","0.0250"],["Rogers 4350B","0.0037"]],"w":"The Rogers laminate has roughly one seventh the loss tangent."}]},{"t":"Z-axis CTE limit","s":["stack",15],"x":"Keep Z-axis CTE low, ideally under 70 ppm/°C. It climbs sharply once the material passes Tg.","q":[{"k":"mc","p":"What Z-axis CTE does the guide prefer?","o":["Under 70 ppm/°C","Over 200 ppm/°C","Exactly 386 ppm/°C","It doesn't matter"],"w":"Low Z expansion protects plated holes."}]},{"t":"Tg of two laminates","s":["stack",15],"x":"370HR has a Tg of 180°C and Td of 340°C. Rogers 4350B has a Tg of 280°C and Td of 390°C.","q":[{"k":"mc","p":"What is the Tg of 370HR?","o":["180°C","280°C","340°C","130°C"],"w":"180°C Tg; 340°C is its Td."}]},{"t":"Effective Dk","s":["stack",20],"x":"When two dielectrics sit between a trace and its plane, use the thickness-weighted average Dk. The guide's example: 4.6 mil at Dk 3.22 plus 8 mil at Dk 3.65 gives 3.49.","q":[{"k":"num","p":"2 mil at Dk 3.0 plus 6 mil at Dk 4.0. What is the effective Dk?","v":3.75,"tol":0.01,"u":"","w":"(2×3.0 + 6×4.0) ÷ 8 = 30 ÷ 8 = 3.75."}]},{"t":"Keep prepregs simple","s":["stack",20],"x":"For predictable impedance, use no more than three prepreg types in a stack-up, and keep each prepreg layer under 10 mil.","q":[{"k":"mc","p":"How thick should each prepreg layer be for tight impedance?","o":["Under 10 mil","Over 20 mil","Exactly 62 mil","Thickness doesn't matter"],"w":"Thinner prepreg layers vary less after pressing."}]},{"t":"Two ways to control impedance","s":["stack",19],"x":"With controlled dielectric thickness, you specify thicknesses and the fab holds about ±10% layer to layer. With impedance control, the fab adjusts geometry and proves it with TDR coupons.","q":[{"k":"match","p":"Match each approach to how it works.","pairs":[["Controlled dielectric thickness","Fab holds the specified thickness within ±10%"],["Impedance control","Fab tunes geometry and tests TDR coupons"]],"w":"The second hands the impedance target to the fabricator."}]}]},{"u":"Planning layers","c":4,"L":[{"t":"Three jobs of a stack-up","s":["stack",21],"x":"Every stack-up must distribute power, provide ground reference planes, and give signals layers to travel on.","q":[{"k":"mc","p":"Which is one of the stack-up's three essential tasks?","o":["Establishing ground reference planes","Choosing solder paste","Setting the BOM","Printing the silkscreen"],"w":"Power, ground reference and signal routing."}]},{"t":"BGA layer estimate","s":["stack",23],"x":"A rough rule for a non-fine-pitch BGA: signal layers = 0.5 × rows − 2, rounded up. A 15-row BGA gives 5.5, so 6 signal layers.","q":[{"k":"num","p":"Using the rule, how many signal layers for a 20-row BGA?","v":8,"tol":0,"u":"layers","w":"0.5 × 20 − 2 = 8."}]},{"t":"Four layers is popular","s":["stack",23],"x":"A 4-layer stack-up handles high-speed, high-frequency and mixed-signal work at reasonable density. When signal count grows a lot, 6 layers suits many products.","q":[{"k":"mc","p":"Which layer count does the guide call a popular choice?","o":["4 layers","3 layers","1 layer","32 layers"],"w":"4-layer boards balance cost and performance."}]},{"t":"Round up to even","s":["stack",23],"x":"Round the total layer count up to an even number to keep the stack-up symmetric.","q":[{"k":"tf","p":"You should round a 7-layer estimate up to 8 layers.","v":true,"w":"Even counts keep the build symmetric."}]},{"t":"No adjacent signal layers","s":["stack",25],"x":"Two signal layers side by side couple their fields and create common-mode noise. If you must, route them orthogonally.","q":[{"k":"mc","p":"If two signal layers must sit next to each other, what helps?","o":["Route them at right angles to each other","Route them in parallel","Remove the ground plane","Use thicker silkscreen"],"w":"Orthogonal routing minimises overlap and coupling."}]},{"t":"Plane pair spacing","s":["stack",25],"x":"Placing power and ground planes 8-10 mil apart creates a high-frequency capacitor and a low-impedance distribution network.","q":[{"k":"mc","p":"How close does the guide suggest power and ground planes sit?","o":["8-10 mil","80-100 mil","1 mil","Opposite sides of the board"],"w":"Close planes add interplane capacitance and shrink loop area."}]},{"t":"Avoid plane splits","s":["stack",25],"x":"Splits in a plane used as a reference create impedance discontinuities. Signals routed over them suffer integrity problems.","q":[{"k":"tf","p":"Routing a signal over a split in its reference plane is harmless.","v":false,"w":"The return path is broken at the split."}]},{"t":"Balance the stack","s":["stack",26],"x":"A balanced, symmetric stack-up stays mechanically stable, warps less and expands evenly. Balance copper weight across the stack too.","q":[{"k":"mc","p":"What does a symmetric stack-up reduce?","o":["Warping","Dk","Copper purity","Drill count"],"w":"Imbalance bends the board during heating and cooling."}]}]},{"u":"Build types","c":4,"L":[{"t":"Core vs foil build","s":["stack",17],"f":"foilbuild","x":"Core construction bonds pre-made cores with prepreg and is rarely used except in some microwave hybrids. Foil construction laminates foil and prepreg onto cores and is more flexible.","q":[{"k":"tf","p":"Core construction is the most common way to build multilayer boards.","v":false,"w":"The guide says core construction is rarely used."}]},{"t":"Foil build allows blind vias","s":["stack",18],"x":"Foil construction lets you mix copper and prepreg thicknesses freely and add blind and buried vias.","q":[{"k":"mc","p":"What does foil construction make possible?","o":["Blind and buried vias","Only single-sided boards","No impedance control","Thicker silkscreen"],"w":"Sequential pressing in foil builds supports blind and buried vias."}]},{"t":"Stacked vs staggered microvias","s":["stack",32],"x":"Stacked microvias save space but are less reliable and need copper filling. Staggered microvias are simpler to make because they don't need filling.","q":[{"k":"match","p":"Match each microvia style to its trait.","pairs":[["Stacked","Space-efficient, needs filling, less reliable"],["Staggered","Simpler, no copper fill needed"]],"w":"Offsetting the vias avoids the fill step."}]},{"t":"HDI notation","s":["stack",33],"x":"HDI stack-ups are written X+N+X: X is the number of sequential laminations on each side of a central N-layer core. 2+4+2 is an 8-layer board.","q":[{"k":"num","p":"How many layers does a 1+6+1 HDI stack-up have?","v":8,"tol":0,"u":"layers","w":"1 + 6 + 1 = 8."},{"k":"mc","p":"How many lamination cycles does the guide recommend for HDI?","o":["2 to 3","8 to 10","Exactly 1","As many as possible"],"w":"Each cycle stresses the board, so keep it to 2-3."}]},{"t":"Flex goes in the middle","s":["stack",37],"x":"In a rigid-flex stack-up, put the flexible layers in the middle to prevent slippage between flex and rigid layers.","q":[{"k":"mc","p":"Where should flex layers sit in a rigid-flex stack-up?","o":["In the middle","On the top only","On the bottom only","Outside the board"],"w":"Centring them prevents slippage."}]},{"t":"Hybrid bonding","s":["stack",39],"x":"In hybrid stack-ups, bond the different cores with a single prepreg type, for example Rogers 4350 and 370HR cores with 370HR prepreg. Mixing prepregs adds cost and time.","q":[{"k":"mc","p":"How should hybrid cores be bonded to save cost?","o":["With a single prepreg type","With three different prepregs","With solder paste","Without any prepreg"],"w":"One prepreg type keeps the process simpler."}]}]},{"u":"Why width and spacing matter","c":5,"L":[{"t":"Too narrow, too close","s":["trace",3],"x":"Undersized width or spacing can cause overheating and voltage drop, shorts and arcing, impedance mismatches and reflections, crosstalk, and manufacturing defects.","q":[{"k":"mc","p":"Which problem can come from traces that are too narrow?","o":["Overheating and voltage drop","Better impedance matching","Lower resistance","Less crosstalk"],"w":"Narrow traces have more resistance, so they heat and drop voltage."}]},{"t":"Not just passing DRC","s":["trace",3],"x":"Passing your CAD tool's DRC is not the goal. Width and spacing must keep the product safe and within industry standards.","q":[{"k":"tf","p":"If the CAD DRC passes, your trace widths are automatically safe.","v":false,"w":"DRC only checks the rules you entered; the rules themselves must be right."}]},{"t":"Target impedance","s":["trace",5],"x":"High-speed lines like USB and PCIe need a set impedance, commonly 50 Ω single-ended or 100 Ω differential, held uniform along the line.","q":[{"k":"match","p":"Match each line type to its common target.","pairs":[["Single-ended","50 Ω"],["Differential pair","100 Ω"]],"w":"These are the typical values the guide gives."}]},{"t":"What moves impedance","s":["trace",5],"x":"Wider traces lower impedance. A thinner dielectric lowers it. A lower Dk raises it. Thinner copper raises it.","q":[{"k":"match","p":"Match each change to its effect on impedance.","pairs":[["Wider trace","Lower impedance"],["Thinner dielectric","Lower impedance"],["Lower Dk material","Higher impedance"],["Thinner copper","Higher impedance"]],"w":"Impedance falls with more capacitance to the plane and rises with less."}]},{"t":"Heavier copper, narrower trace","s":["trace",5],"x":"Thicker copper lowers resistance, so a 2 oz trace can be narrower than a 1 oz trace for the same current. But heavy copper is harder to etch finely.","q":[{"k":"mc","p":"What is a downside of heavier copper?","o":["It is harder to etch fine traces","It raises resistance","It cannot carry current","It increases impedance a lot"],"w":"Longer etching makes fine features hard to hold."}]},{"t":"Minimums by copper weight","s":["trace",6],"x":"Heavier copper needs wider minimum features. On outer layers, 1 oz copper needs 5 mil width and 5 mil space; 2 oz needs 7/7; 4 oz needs 14/14.","q":[{"k":"mc","p":"Mini
